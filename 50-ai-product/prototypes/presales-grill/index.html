<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>售前需求助手原型</title>
<style>
:root{
  --primary:#0152D9;--primary-hover:#2A6BDD;--primary-active:#003EAA;--primary-soft:#EEF4FF;
  --text:#1F1F1F;--text-2:#595959;--text-3:#8C8C8C;--text-dis:#BFBFBF;
  --border:#D9D9D9;--border-strong:#B9D0F7;--divider:#E5E5E5;
  --page:#F8F8F8;--card:#FFFFFF;--block:#F5F5F5;
  --green-bg:#E9F7EF;--green-tx:#18794E;
  --blue-bg:#EEF4FF;--blue-tx:#0D4AB8;
  --amber-bg:#FFF6E0;--amber-tx:#946200;
  --red-bg:#FDECEC;--red-tx:#C22F2F;
  --hair:.5px solid var(--border);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#3B7BF0;--primary-hover:#5A90F3;--primary-active:#2A63CC;--primary-soft:#14264A;
  --text:#EDEDED;--text-2:#B4B4B4;--text-3:#8C8C8C;--text-dis:#5C5C5C;
  --border:#3A3A3A;--border-strong:#2E4E8A;--divider:#2E2E2E;
  --page:#111111;--card:#1B1B1B;--block:#242424;
  --green-bg:#13301F;--green-tx:#6FD39A;--blue-bg:#14264A;--blue-tx:#8FB4FF;
  --amber-bg:#3A2C08;--amber-tx:#F2C55C;--red-bg:#3D1616;--red-tx:#FF8A8A;
}}
:root[data-theme="dark"]{
  --primary:#3B7BF0;--primary-hover:#5A90F3;--primary-active:#2A63CC;--primary-soft:#14264A;
  --text:#EDEDED;--text-2:#B4B4B4;--text-3:#8C8C8C;--text-dis:#5C5C5C;
  --border:#3A3A3A;--border-strong:#2E4E8A;--divider:#2E2E2E;
  --page:#111111;--card:#1B1B1B;--block:#242424;
  --green-bg:#13301F;--green-tx:#6FD39A;--blue-bg:#14264A;--blue-tx:#8FB4FF;
  --amber-bg:#3A2C08;--amber-tx:#F2C55C;--red-bg:#3D1616;--red-tx:#FF8A8A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--text);font:14px/22px "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
h1{font-size:20px;line-height:28px;font-weight:500;margin:0}
h2{font-size:16px;line-height:24px;font-weight:500;margin:0}
.note{font-size:12px;line-height:20px;color:var(--text-3)}
.muted{color:var(--text-2)}

.shell{display:flex;min-height:100vh}
.side{width:148px;flex:none;background:var(--card);border-right:var(--hair);padding:16px 8px}
.brand{white-space:nowrap;font-weight:500;padding:4px 8px 16px}
.nav button{white-space:nowrap;display:block;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:4px;color:var(--text-2)}
.nav button:hover{background:var(--block)}
.nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.main{flex:1;min-width:0;padding:24px}
.card{background:var(--card);border-radius:8px;padding:24px}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.stack>*+*{margin-top:16px}
.demo{display:inline-block;margin-left:8px;padding:0 6px;border-radius:4px;background:var(--amber-bg);color:var(--amber-tx);font-size:12px;line-height:20px;vertical-align:middle}

.btn{border:var(--hair);background:var(--card);color:var(--text);border-radius:4px;padding:5px 16px;min-height:32px}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);color:#fff}
.btn-primary:active{background:var(--primary-active)}
.btn-link{border:0;background:none;color:var(--primary);padding:0}
.btn:focus-visible,.chip:focus-visible,.nav button:focus-visible,.step:focus-visible,.btn-link:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px;border-bottom:var(--hair);vertical-align:top}
th{font-weight:500;background:var(--block);color:var(--text-2)}
.tag{display:inline-block;padding:0 8px;border-radius:4px;font-size:12px;line-height:22px;white-space:nowrap}
.t-can{background:var(--green-bg);color:var(--green-tx)}
.t-alt{background:var(--blue-bg);color:var(--blue-tx)}
.t-plan{background:var(--amber-bg);color:var(--amber-tx)}
.t-no{background:var(--red-bg);color:var(--red-tx)}
.t-neutral{background:var(--block);color:var(--text-2)}

/* stepper */
.steps{display:flex;align-items:center;gap:16px;margin:12px 0}
.track{flex:1;display:flex;align-items:center;min-width:0}
.seg{flex:none;width:28px;height:28px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;font-size:12px;line-height:1;background:var(--card);color:var(--text-dis);box-shadow:inset 0 0 0 .5px var(--border)}
.seg.done{background:var(--primary);color:#fff;box-shadow:none}
.seg.current{background:var(--primary-soft);color:var(--primary);font-weight:500;box-shadow:inset 0 0 0 2px var(--primary)}
.seg.reached{color:var(--primary);box-shadow:inset 0 0 0 1px var(--border-strong)}
.seg:disabled{cursor:default}
.seg:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.link{flex:1;min-width:12px;height:4px;margin:0 2px;border-radius:2px;background:var(--divider)}
.link.done{background:var(--primary)}
.steps-now{flex:none;font-size:12px;line-height:20px;color:var(--text-2);white-space:nowrap}
@media (max-width:480px){
  .steps{gap:12px}
  .seg{width:24px;height:24px}
  .steps-now .lab{display:none}
}

/* flow */
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.flow .node{flex:1;min-width:150px;background:var(--block);border-radius:8px;padding:12px}
.flow .arrow{align-self:center;color:var(--text-3)}
.flow .node b{display:block;font-weight:500}

/* chat */
.grill{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
.chat{display:flex;flex-direction:column;min-height:560px}
.msgs{flex:1}
.msg{max-width:80%;margin-bottom:16px}
.msg .who{font-size:12px;line-height:20px;color:var(--text-3)}
.bubble{padding:12px 16px;border-radius:8px;background:var(--block);white-space:pre-wrap}
.msg.me{margin-left:auto}
.msg.me .who{text-align:right}
.msg.me .bubble{background:var(--primary-soft)}
.ask{border:.5px solid var(--border-strong);border-radius:8px;padding:20px;margin-top:16px;background:var(--card)}
.brief{background:var(--block);border-radius:8px;padding:12px 16px;margin-bottom:8px}
.qa{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:12px 0;border-top:var(--hair)}
.qa .num{width:24px;height:24px;border-radius:50%;background:var(--block);color:var(--text-2);font-size:12px;line-height:24px;text-align:center}
.qa .q{color:var(--text-2)}
.qa .a{margin-top:4px;font-weight:500}
.sys{display:flex;gap:8px;padding:4px 0 8px 36px;font-size:12px;line-height:20px;color:var(--green-tx)}
.ask-head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ask-no{font-size:12px;line-height:20px;color:var(--primary);font-weight:500}
.ask-q{margin-bottom:16px}
.opts{display:grid;gap:8px;margin-bottom:12px}
.opt{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;text-align:left;border:var(--hair);background:var(--card);color:var(--text);border-radius:6px;padding:10px 12px}
.opt:hover{border-color:var(--primary);background:var(--primary-soft)}
/* 候选回答一行显示；放不下时省略，完整内容悬停可见 */
.opt-text{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .tag{flex:none}
.opt:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.opt kbd{font:inherit;font-size:12px;width:24px;height:24px;line-height:22px;text-align:center;border:var(--hair);border-radius:4px;color:var(--text-2)}
.done-ask .ask-q{margin-bottom:4px}
.ask .free{flex-wrap:wrap;align-items:center}
.ask .free input{min-width:180px}
.v-select{margin-top:8px}
/* 判定页：卡片列表
   元素：状态图标、原话、结论行（短名+一句话）、右侧标记（待确认/可签，最多一个）、展开箭头；
   展开后：说明、场景、依据、调整判定（分段按钮）、能写进合同（开关行） */
.filters.vfilters{margin:12px 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.vfilters::-webkit-scrollbar{display:none}
.vfilters .chip{flex:none;white-space:nowrap;border-radius:16px;padding:4px 12px}
.vlist{display:grid;gap:8px}
.vcard{border:var(--hair);border-radius:8px;background:var(--card);overflow:hidden}
.vcard.open{border-color:var(--border-strong);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.vcard-head{display:grid;grid-template-columns:28px minmax(0,1fr) auto 12px;gap:12px;align-items:center;width:100%;min-height:60px;padding:10px 14px;border:0;background:none;text-align:left;color:var(--text)}
.vcard-head:hover{background:var(--block)}
.vcard-head:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.vicon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:500}
.vmain{min-width:0;display:grid;gap:2px}
.vquote{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard.open .vquote{white-space:normal}
.vsub{font-size:12px;line-height:20px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsub b{font-weight:500}
.t-can-tx{color:var(--green-tx)}.t-alt-tx{color:var(--blue-tx)}.t-plan-tx{color:var(--amber-tx)}.t-no-tx{color:var(--red-tx)}
.vbadge{font-size:12px;line-height:20px;padding:0 8px;border-radius:10px;white-space:nowrap}
.vbadge.sign{color:var(--green-tx);box-shadow:inset 0 0 0 .5px var(--green-tx)}
.vbadge.wait{color:var(--text-2);background:var(--block)}
.vchev{color:var(--text-dis);font-size:16px;transition:transform 250ms ease-out;justify-self:end}
.vcard.open .vchev{transform:rotate(90deg)}
.vcard-body{border-top:var(--hair);padding:12px 14px 14px 54px;display:grid;gap:12px}
.vsec{display:grid;gap:4px}
.vlabel{font-size:12px;line-height:20px;font-weight:400;color:var(--text-3);margin:0}
.vsec p{margin:0}
.vid{margin-left:8px;font-size:12px;color:var(--text-3)}
.vquote-block{margin:0;padding:8px 12px;background:var(--block);border-radius:6px;color:var(--text-2)}
.vquote-block cite{display:block;margin-top:4px;font-style:normal;font-size:12px;line-height:20px;color:var(--text-3)}
.segbar{display:flex;background:var(--block);border-radius:8px;padding:2px}
.seg-opt{flex:1;border:0;background:none;padding:6px 8px;min-height:36px;border-radius:6px;color:var(--text-2);display:flex;gap:4px;align-items:center;justify-content:center;white-space:nowrap}
.seg-opt.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.seg-opt.on.t-can{color:var(--green-tx)}.seg-opt.on.t-alt{color:var(--blue-tx)}.seg-opt.on.t-plan{color:var(--amber-tx)}.seg-opt.on.t-no{color:var(--red-tx)}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:var(--hair)}
.vrow > span{display:grid}
.vrow-title{color:var(--text)}
.switch{border:0;background:none;padding:4px 0;min-height:32px;display:flex;align-items:center}
.switch .knob{width:40px;height:24px;border-radius:12px;background:var(--border);position:relative;transition:background 250ms ease-out}
.switch .knob::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform 250ms ease-out}
.switch.on .knob{background:var(--green-tx)}
.switch.on .knob::after{transform:translateX(16px)}
.switch:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:700px){
  .vpage.card{padding:12px}
  .vcard-body{padding:12px 14px 14px}
  .seg-opt{min-height:40px;padding:8px 4px}
  .vpage.card .bar{position:sticky;bottom:0;margin:12px -12px -12px;padding:8px 12px;background:var(--card);border-top:var(--hair);flex-wrap:nowrap}
  .vpage.card .bar .btn{flex:1;min-height:44px}
}
@media (prefers-reduced-motion:reduce){.switch .knob,.switch .knob::after,.vchev{transition:none}}
/* 手机 App 化：首页、底部导航、详情页顶栏 */
.card{border-radius:12px}
.nav button{display:flex;align-items:center;gap:8px}
.nav svg{width:16px;height:16px;flex:none}
.home{display:grid;gap:16px;max-width:720px}
.home-head .note{margin:0}
.stat-card{display:grid;grid-template-columns:repeat(3,1fr);background:#16335F;color:#fff;border-radius:16px;padding:16px 8px}
.stat{display:grid;justify-items:center;gap:2px}
.stat b{font-size:20px;line-height:28px;font-weight:500}
.stat span{font-size:12px;line-height:20px;opacity:.75}
.stat+.stat{box-shadow:inset .5px 0 0 rgba(255,255,255,.25)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:grid;gap:2px;align-content:start;text-align:left;border:0;border-radius:16px;padding:16px;min-height:112px;background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tile b{font-weight:500}
.tile .tile-sub{font-size:12px;line-height:20px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);margin-bottom:8px}
.tile-primary{background:var(--primary);color:#fff}
.tile-primary .tile-sub{color:rgba(255,255,255,.8)}
.tile-primary .tile-icon{background:rgba(255,255,255,.18);color:#fff}
.tile:focus-visible,.ccard-main:focus-visible,.cdel:focus-visible,.back:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.clist{display:grid;gap:8px}
.ccard{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ccard-main{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;border:0;background:none;padding:12px 4px 12px 14px;text-align:left;color:var(--text);border-radius:12px;min-width:0}
.cavatar{width:40px;height:40px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:500}
.cinfo{min-width:0;display:grid;gap:2px}
.cname{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font-size:12px;line-height:20px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cprog{height:4px;border-radius:2px;background:var(--divider);overflow:hidden;margin-top:4px}
.cprog span{display:block;height:100%;background:var(--primary)}
.cside{display:grid;justify-items:end;gap:2px;white-space:nowrap}
.mini-chip{font-size:12px;line-height:20px;padding:0 8px;border-radius:10px}
.cdel{width:40px;height:40px;margin-right:6px;border:0;border-radius:50%;background:none;color:var(--text-3);display:grid;place-items:center}
.cdel:hover{background:var(--block);color:var(--red-tx)}
.cdel svg{width:18px;height:18px}
.case-top{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.back{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--card);color:var(--text);font-size:20px;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.case-title{font-size:16px;line-height:24px;font-weight:500;margin:0}
@media (max-width:700px){
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;padding:4px 8px calc(4px + env(safe-area-inset-bottom));border-top:var(--hair);border-bottom:0}
  .side .brand{display:none}
  .nav{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:0}
  .nav button{flex-direction:column;justify-content:center;gap:2px;font-size:12px;line-height:16px;padding:6px 0;min-height:48px;background:none}
  .nav button:hover{background:none}
  .nav svg{width:22px;height:22px}
  .nav button[aria-current="page"]{background:none;color:var(--primary)}
  .main{padding-bottom:84px}
  body.in-case .side{display:none}
  body.in-case .main{padding-bottom:12px}
}
/* 访谈卡：顶栏是信息收集进度，下面是问答；记下的需求以小标签挂在问答里 */
.chat.card{padding-top:0}
.chat-head{position:sticky;top:0;z-index:3;background:var(--card);margin:0 -24px 12px;border-bottom:var(--hair);border-radius:12px 12px 0 0}
.chat-head .task-head{padding:12px 24px}
.chat-head .task-body{border-top:0;padding:0 24px 8px}
.caps{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cap{font-size:12px;line-height:20px;padding:0 8px;border-radius:10px;background:var(--green-bg);color:var(--green-tx)}
@media (max-width:700px){
  .grill .chat.card{padding-top:0}
  .chat-head{margin:0 -12px 8px}
  .chat-head .task-head{padding:10px 12px}
  .chat-head .task-body{padding:0 12px 8px}
}
/* 上一条记录：只显示一条，左右滑动或点 ‹ › 切换 */
.hist{background:var(--block);border-radius:12px;padding:10px 14px 12px;touch-action:pan-y;user-select:none}
.hist-top{display:flex;align-items:center;justify-content:space-between;min-height:28px}
.hist-nav{display:flex;align-items:center;gap:4px}
.hist-nav button{width:28px;height:28px;border:0;border-radius:50%;background:var(--card);color:var(--text-2);font-size:16px;line-height:1}
.hist-nav button:disabled{opacity:.35;cursor:default}
.hist-nav button:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.hist-q{color:var(--text-2);margin-top:2px}
.hist-a{font-weight:500;margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* 玻璃效果：底部导航、访谈卡顶栏和它展开的明细（浮在内容上方，不推开下面的内容） */
.chat-head{position:sticky;background:var(--card);background:color-mix(in srgb,var(--card) 72%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.chat-head .task-body{position:absolute;left:0;right:0;top:100%;margin:0;border-radius:0 0 12px 12px;border-bottom:var(--hair);box-shadow:0 8px 24px rgba(0,0,0,.08);
  background:var(--card);background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
@media (max-width:700px){
  .side{background:var(--card);background:color-mix(in srgb,var(--card) 70%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
}
/* 追问页顶部固定任务卡 */
.task-card{position:sticky;top:0;z-index:5;background:var(--card);border-radius:8px;margin-bottom:12px;box-shadow:0 1px 0 var(--divider)}
.task-head{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 16px;text-align:left;color:var(--text)}
.task-head:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;border-radius:8px}
.task-title{font-weight:500;white-space:nowrap}
.task-meter{flex:0 1 160px;height:6px;border-radius:3px;background:var(--divider);overflow:hidden}
.task-meter span{display:block;height:100%;background:var(--green-tx);transition:width 250ms ease-out}
.task-count{font-size:12px;color:var(--text-2)}
.task-now{flex:1;min-width:0;font-size:12px;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-caret{font-size:12px;color:var(--text-3);white-space:nowrap}
.task-body{padding:0 16px 8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));column-gap:16px;border-top:var(--hair)}
.task-body[hidden]{display:none}
.task-tip{grid-column:1/-1;padding:8px 0 4px;color:var(--green-tx)}
.gap.flash{background:var(--green-bg);border-radius:4px;padding-left:4px;animation:gap-flash 250ms ease-out}
@keyframes gap-flash{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.gap.flash{animation:none}}

function startAnalyze(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  S.analyzing = true; S.analyzeShown = reduce ? EXTRACTED.length : 0; render();
  const tick = () => {
    if(S.analyzeShown < EXTRACTED.length){ S.analyzeShown++; render(); setTimeout(tick, 380); return; }
    setTimeout(() => { S.analyzing = false; S.step = 2; S.maxStep = Math.max(S.maxStep, 2); render(); window.scrollTo(0,0); }, reduce ? 300 : 900);
  };
  setTimeout(tick, reduce ? 0 : 300);
}

// 访谈记录：开头是客户信息，之后每组一问一答编号；这一问记下的需求以小标签挂在问答下面
function transcript(){
  const log = S.log, items = [];
  let n = 0;
  const captured = t => { const m=t.match(/^记下[:：](.*)$/); return m ? m[1].split(/[；;、，,]/).map(x=>x.replace(/[。.]$/,'').trim()).filter(Boolean) : []; };
  for(let i=0;i<log.length;i++){
    const m = log[i];
    if(i===0 && m.me){ items.push({kind:'brief', a:m.text, caps:[]}); continue; }
    if(!m.me && log[i+1]?.me){ n++; items.push({kind:'qa', n, q:m.text, a:log[i+1].text, caps:[]}); i++; continue; }
    const got = captured(m.text);
    if(got.length && items.length) items[items.length-1].caps.push(...got);
  }
  return histCard(items);
}
// 只显示一条记录，默认最近一条；左右滑动或点 ‹ › 切换。和回答原文重复的标签不显示
function histCard(items){
  if(!items.length) return '';
  const total=items.length, idx=S.histIdx==null||S.histIdx>=total?total-1:S.histIdx, it=items[idx];
  const extra=it.caps.filter(x=>!it.a.includes(x)&&!x.includes(it.a));
  return `<div class="hist" data-total="${total}">
    <div class="hist-top"><span class="note">${it.kind==='brief'?'客户信息':`第 ${it.n} 问`}</span>
      ${total>1?`<span class="hist-nav"><button data-hstep="-1" ${idx===0?'disabled':''} aria-label="上一条">‹</button><span class="note">${idx+1}/${total}</span><button data-hstep="1" ${idx===total-1?'disabled':''} aria-label="下一条">›</button></span>`:''}</div>
    ${it.q?`<div class="hist-q">${it.q}</div>`:''}<div class="hist-a">${it.a}</div>
    ${extra.length?`<div class="caps">${extra.map(x=>`<span class="cap">＋ ${x}</span>`).join('')}</div>`:''}
  </div>`;
}
function stepHist(d,total){
  const cur=S.histIdx==null||S.histIdx>=total?total-1:S.histIdx, next=Math.min(total-1,Math.max(0,cur+d));
  S.histIdx=next===total-1?null:next; render();
}

function stepVerdict(){

    .map(([k,l,ic])=>`<button class="chip" data-filter="${k}" aria-pressed="${S.filter===k}">${ic?`<span aria-hidden="true">${ic}</span> `:''}${l} ${counts[k]}</button>`).join('');
  const left = GAPS.filter(g=>!S.gapsDone.has(g.id));
  // 每条需求一张卡：收起时只有「状态图标 + 原话 + 一句结论」，点开看说明、依据和改判
  const cards = S.reqIds.filter(id=>S.filter==='all'||S.verdicts[id]===S.filter).map(id=>{

    const badge = r.pending&&v==='no' ? '<span class="vbadge wait">待确认</span>' : S.contract[id] ? '<span class="vbadge sign">可签</span>' : '';
    return `<article class="vcard ${m.cls}-card ${open?'open':''}">
      <button class="vcard-head" data-card="${id}" aria-expanded="${open}" aria-label="${id} ${VERDICT[v].label}：${r.quote}">

        <span class="vmain"><span class="vquote">${r.quote}</span><span class="vsub"><b class="${m.cls}-tx">${m.short}</b>　${r.how.split(/[。：:]/)[0]}</span></span>
        ${badge}<span class="vchev" aria-hidden="true">›</span>
      </button>
      ${open?`<div class="vcard-body">
        <section class="vsec"><h3 class="vlabel">说明</h3><p>${r.how}</p></section>
        <section class="vsec"><h3 class="vlabel">场景</h3><p class="muted">${r.scene}<span class="vid">${id}</span></p></section>

        <section class="vsec"><h3 class="vlabel">调整判定</h3><div class="segbar" role="group" aria-label="${id} 改判">${seg}</div></section>

          <button class="switch ${S.contract[id]?'on':''}" data-csw="${id}" role="switch" aria-checked="${!!S.contract[id]}" aria-label="能写进合同" ${canSign?'':'disabled'}><span class="knob"></span></button>

  }).join('');
  return `

  return Object.fromEntries([...ready,...plan].map((id,i)=>[id,i+1]));
}
// 客户版按客户自己的工作场景来写：先说「您那边会是什么样」，再说「我们怎么做」，不出现内部判定词和编号
function customerHTML(){
  const no=custNumbers();
  const ready=S.reqIds.filter(id=>['can','alt'].includes(S.verdicts[id]));
  const plan=S.reqIds.filter(id=>S.verdicts[id]==='plan');
  const scene=id=>{const c=REQS[id].cx||{title:REQS[id].quote,scene:REQS[id].scene,how:''};
    return `<li><h3>${no[id]}. ${c.title}</h3><p>${c.scene}</p><p class="how">${c.how}</p></li>`;};
  const dirs=plan.map(id=>`<li><h3>${no[id]}. ${(REQS[id].cx||{}).title||REQS[id].quote}</h3><p>${REQS[id].dir}</p></li>`).join('');
  return `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${CUSTOMER.name} 方案要点</title>
<style>body{margin:0;background:#F8F8F8;color:#1F1F1F;font:14px/24px "PingFang SC","Microsoft YaHei",sans-serif}main{max-width:720px;margin:0 auto;padding:32px 16px}h1{font-size:20px;font-weight:500;margin:0 0 4px}h2{font-size:16px;font-weight:500;margin:0 0 12px}h3{font-size:14px;font-weight:500;margin:0 0 4px}section{background:#fff;border-radius:8px;padding:24px;margin-top:16px}ol,ul{list-style:none;padding:0;margin:0}li+li{margin-top:20px}p{margin:0}p+p{margin-top:4px}.how{color:#595959}.note{color:#8C8C8C;font-size:12px}</style></head>
<body><main>
<h1>${CUSTOMER.name}　岗位技能图谱与技能竞赛方案要点</h1><p class="note">初稿　2026 年 11 月 2 日</p>
<section><p>您好，感谢上次的沟通。我们把您提到的情况整理成下面几个使用场景，想请您看看和实际是否一致。不对的地方直接告诉我们，我们再调整。</p></section>
<section><h2>我们的理解</h2><p>贵司一线员工约 3000 人。这次最想先解决的，是把各岗位要掌握的技能理清楚，让员工在车间用手机就能学；技能竞赛可以放在图谱之后。图谱希望年底前能用起来。</p></section>
<section><h2>上线后，大家会这样用</h2><ol>${ready.map(scene).join('')}</ol></section>
${dirs?`<section><h2>您关心、我们正在推进的</h2><ol>${dirs}</ol></section>`:''}
<section><h2>还想跟您确认两件事</h2><ul>${CONFIRM_QS.map(q=>`<li>${q}</li>`).join('')}</ul></section>
<section><p>回复时直接说第几条就行，比如「第 2 条我们其实是……」，或者「都没问题」。</p><p class="note" style="margin-top:12px">时代光华　售前　（姓名、电话）</p></section>
</main></body></html>`;
}
function stepOutput(){
  const txt=productText();
  const noCount=S.reqIds.filter(id=>S.verdicts[id]==='no').length;
  const tab=S.outTab==='product'
    ? (txt?`<div class="row between" style="margin-bottom:12px"><span class="muted">${noCount} 条现在做不到，复制后发到产品群或私聊即可</span><button class="btn btn-primary" data-copy>复制全部</button></div><pre class="copy" id="ptext">${txt}</pre>`
           :`<p class="muted">这个客户没有做不到的需求，不用发产品。</p>`)
    : `<div class="row between" style="margin-bottom:12px"><span class="muted">只包含能做和换个方式能做的需求；规划中的只讲方向，不写时间</span><button class="btn btn-primary" data-dl>下载 HTML</button></div><iframe title="客户版场景说明预览" id="preview"></iframe>`;
  return `
  <section class="card">
    <h1>产出</h1>
    <div class="tabs" role="tablist" style="margin-top:16px">
      <button role="tab" aria-selected="${S.outTab==='product'}" data-tab="product">发给产品（${noCount}）</button>
      <button role="tab" aria-selected="${S.outTab==='customer'}" data-tab="customer">客户版场景说明</button>
    </div>
    ${tab}
    <div class="bar row between"><span class="note">发出去以后，客户或产品回复了，到「回填」录入结果</span><button class="btn" data-step="5">去回填反馈</button></div>
  </section>`;
}

/* ---------- 回填：客户和产品的回复进来，开启下一轮 ---------- */
const CUST_FB = {pending:'待回复', ok:'确认', dispute:'有异议'};
const PROD_FB = {pending:'待回复', have:'现网已支持', plan:'已列入规划', nodo:'确认不做', more:'需要更多信息'};
function fbRow(id, kind){
  const r=REQS[id], map=kind==='cust'?CUST_FB:PROD_FB, f=S.fb[kind][id]||{status:'pending',note:''};
  const opts=Object.entries(map).map(([k,l])=>`<option value="${k}" ${k===f.status?'selected':''}>${l}</option>`).join('');
  return `<div class="fb-row">
    <div><span class="note">${kind==='cust'?`客户版第 ${custNumbers()[id]} 条`:id}</span>　${r.quote}<div><span class="tag ${VERDICT[S.verdicts[id]].cls}">${VERDICT[S.verdicts[id]].label}</span></div></div>
    <select data-fb="${kind}" data-id="${id}" aria-label="${id} ${kind==='cust'?'客户':'产品'}回复">${opts}</select>
    <input data-fb-note="${kind}" data-id="${id}" value="${f.note}" placeholder="${kind==='cust'?'客户原话或异议点':'产品的说明'}" aria-label="${id} 补充说明">
  </div>`;
}
function stepFeedback(){
  const cust=S.reqIds.filter(id=>S.verdicts[id]!=='no'), prod=S.reqIds.filter(id=>S.verdicts[id]==='no');
  const filled=fbFilled();
  const disputes=Object.values(S.fb.cust).filter(f=>f.status==='dispute').length;
  return `
  <section class="card stack">
    <div class="row between"><h1>回填反馈</h1><span class="note">第 ${S.round} 轮</span></div>
    <p class="muted">客户和产品都按编号回复。把结果填在这里，点「开始下一轮」：产品的回复会直接改判，客户有异议的条目会变成助手的追问，然后重新判定、重新出产出。</p>
    <h2>客户回复</h2>
    <div>${cust.map(id=>fbRow(id,'cust')).join('')}</div>
    <div class="stack">${CONFIRM_QS.map((q,i)=>`<div><label class="field" for="ans${i}">${q}</label><input id="ans${i}" data-fb-ans="${i}" value="${S.fb.answers[i]||''}" placeholder="客户的回答"></div>`).join('')}</div>
    <div><label class="field" for="fbraw">客户回复原文（可选，直接粘贴）</label><textarea id="fbraw" data-fb-raw style="min-height:96px" placeholder="微信、邮件里客户的原话">${S.fb.raw}</textarea></div>
    <h2>产品回复</h2>
    <div>${prod.length?prod.map(id=>fbRow(id,'prod')).join(''):'<p class="note">这一轮没有发给产品的需求</p>'}</div>
    <div class="bar row between">
      <span class="note">已填 ${filled} 条${disputes?`，${disputes} 条客户有异议`:''}</span>
      <button class="btn btn-primary" data-next-round ${filled?'':'disabled'}>开始第 ${S.round+1} 轮</button>
    </div>
  </section>`;
}
// 选了状态、写了说明、回答了确认问题、贴了原文，任何一项都算填了
function fbFilled(){
  const rows=[...Object.values(S.fb.cust),...Object.values(S.fb.prod)].filter(f=>f.status!=='pending'||(f.note||'').trim()).length;
  return rows+Object.values(S.fb.answers).filter(a=>(a||'').trim()).length+((S.fb.raw||'').trim()?1:0);
}
// 打字时只刷新按钮，不重绘整页（重绘会换掉正要点击的按钮）
function refreshNextBtn(){ const b=app.querySelector('[data-next-round]'); if(b) b.disabled=!fbFilled(); }
function nextRound(){
  const notes=[];
  Object.entries(S.fb.prod).forEach(([id,f])=>{
    if(f.status==='have'){S.verdicts[id]='can';REQS[id].pending=false;REQS[id].how=`产品回复现网已支持${f.note?`：${f.note}`:''}`;notes.push(`${id} 改判能做`);}
    if(f.status==='plan'){S.verdicts[id]='plan';REQS[id].pending=false;notes.push(`${id} 改判规划`);}
    if(f.status==='nodo'){REQS[id].pending=false;REQS[id].how=`产品确认不做${f.note?`：${f.note}`:''}`;notes.push(`${id} 确认不做`);}
  });
  const disputes=Object.entries(S.fb.cust).filter(([,f])=>f.status==='dispute');
  const ok=Object.values(S.fb.cust).filter(f=>f.status==='ok').length;
  S.round++;
  S.log.push({me:false,text:`第 ${S.round} 轮：确认 ${ok} 条${disputes.length?`，${disputes.map(([id])=>id).join('、')} 有异议`:''}${notes.length?`；${notes.join('；')}`:''}`});
  CONFIRM_QS.forEach((q,i)=>{ if(S.fb.answers[i]) S.log.push({me:false,text:q},{me:true,text:S.fb.answers[i]}); });
  if(S.fb.raw) S.log.push({me:false,text:`客户回复原文已记录：${S.fb.raw}`});
  const followUps=disputes.map(([id,f])=>({gap:id,text:`客户对「${REQS[id].quote}」有异议${f.note?`（${f.note}）`:''}，具体哪里不符合？`,
    options:[{t:'我们理解偏了，需求要改',adds:[],rec:true},{t:'需求没变，客户不接受这个做法',adds:[]}]}));
  QUESTIONS.splice(S.qIndex,0,...followUps);
  S.fb={cust:{},prod:{},raw:'',answers:{}};
  S.approved=false; S.maxStep=3; S.step=followUps.length?2:3;
  render(); window.scrollTo(0,0);
  toast(followUps.length?'已带着反馈回到追问':'已按产品回复改判，请重新批准');
}

/* ---------- 交互 ---------- */
function bind(){
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.view=b.dataset.go;render();});
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.view='case';S.step=S.approved?4:Math.max(S.step,2);render();});
  app.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{S.view='case';S.step=1;render();});
  app.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.maxStep=Math.max(S.maxStep,S.step);render();window.scrollTo(0,0);});
  const az=app.querySelector('[data-analyze]'); if(az) az.onclick=startAnalyze;
  app.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{S.openCard=S.openCard===b.dataset.card?null:b.dataset.card;render();});
  app.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{const [id,k]=b.dataset.set.split(':');S.verdicts[id]=k;if(k!=='can')S.contract[id]=false;render();});
  app.querySelectorAll('[data-csw]').forEach(b=>b.onclick=()=>{const id=b.dataset.csw;if(S.verdicts[id]==='can'){S.contract[id]=!S.contract[id];render();}});
  const tk=app.querySelector('[data-task]'); if(tk) tk.onclick=()=>{ if(S.taskOpen) collapseTask(); else {S.taskOpen=true;render();} };
  // 任务卡上滑收起（触屏）
  const tc=app.querySelector('.chat-head');
  if(tc){ let y0=null;
    tc.ontouchstart=e=>{y0=e.touches[0].clientY;};
    tc.ontouchend=e=>{ if(y0!==null && S.taskOpen && y0-e.changedTouches[0].clientY>30) collapseTask(); y0=null; };
  }
  const hist=app.querySelector('.hist');
  if(hist){ const total=+hist.dataset.total; let x0=null;
    hist.querySelectorAll('[data-hstep]').forEach(b=>b.onclick=()=>stepHist(+b.dataset.hstep,total));
    hist.ontouchstart=e=>{x0=e.touches[0].clientX;};
    hist.ontouchend=e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>40) stepHist(dx<0?1:-1,total); };
  }
  app.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>answer(QUESTIONS[S.qIndex].options[+b.dataset.ans]));
  const free=app.querySelector('[data-free]'); if(free) free.onclick=()=>{const v=document.getElementById('freeAns').value.trim(); if(v) answer({t:v,adds:[]});};
  const skip=app.querySelector('[data-skip]'); if(skip) skip.onclick=()=>{S.log.push({me:false,text:QUESTIONS[S.qIndex].text},{me:true,text:'（跳过）'});S.qIndex++;render();};
  app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.filter;render();});
  app.querySelectorAll('[data-verdict]').forEach(s=>s.onchange=()=>{const id=s.dataset.verdict;S.verdicts[id]=s.value;if(s.value!=='can')S.contract[id]=false;render();});
  app.querySelectorAll('[data-contract]').forEach(c=>c.onchange=()=>{
    const id=c.dataset.contract;
    if(c.checked&&S.verdicts[id]!=='can'){c.checked=false;document.getElementById('err-'+id).textContent=`「${VERDICT[S.verdicts[id]].label}」不能写进合同`;return;}
    S.contract[id]=c.checked;render();
  });
  app.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>openEvidence(b.dataset.ev,b));
  const rej=app.querySelector('[data-reject]'); if(rej) rej.onclick=()=>{S.step=2;S.log.push({me:false,text:'判定被驳回。哪条需求理解错了？直接告诉我，我接着问。'});render();toast('已回到追问');};
  const ap=app.querySelector('[data-approve]'); if(ap) ap.onclick=()=>{S.approved=true;S.step=4;render();toast('已批准，产出已生成');};
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.outTab=b.dataset.tab;render();});
  const cp=app.querySelector('[data-copy]'); if(cp) cp.onclick=()=>{navigator.clipboard.writeText(productText()).then(()=>toast('已复制，可直接粘贴发送'),()=>toast('复制失败，请手动选中文字复制'));};
  const pv=document.getElementById('preview'); if(pv) pv.srcdoc=customerHTML();
  app.querySelectorAll('[data-fb]').forEach(s=>s.onchange=()=>{const k=s.dataset.fb,id=s.dataset.id;S.fb[k][id]={...(S.fb[k][id]||{note:''}),status:s.value};render();});
  app.querySelectorAll('[data-fb-note]').forEach(i=>i.oninput=()=>{const k=i.dataset.fbNote,id=i.dataset.id;S.fb[k][id]={...(S.fb[k][id]||{status:'pending'}),note:i.value};refreshNextBtn();});
  app.querySelectorAll('[data-fb-ans]').forEach(i=>i.oninput=()=>{S.fb.answers[i.dataset.fbAns]=i.value;refreshNextBtn();});
  const raw=app.querySelector('[data-fb-raw]'); if(raw) raw.oninput=()=>{S.fb.raw=raw.value;refreshNextBtn();};
  const nr=app.querySelector('[data-next-round]'); if(nr) nr.onclick=nextRound;
  const dl=app.querySelector('[data-dl]'); if(dl) dl.onclick=saveCustomerHTML;
}
function answer(opt){
  const q=QUESTIONS[S.qIndex];
  S.log.push({me:false,text:q.text},{me:true,text:opt.t});
  const added=opt.adds.filter(id=>!S.reqIds.includes(id));
  S.reqIds.push(...added);
  const isNewGap = GAPS.some(g=>g.id===q.gap) && !S.gapsDone.has(q.gap);
  S.gapsDone.add(q.gap);
  if(isNewGap) S.gapNotes[q.gap]=opt.t;
  if(added.length) S.log.push({me:false,text:`记下：${added.map(id=>REQS[id].quote).join('；')}`});
  S.qIndex++; S.histIdx=null;
  if(isNewGap) announceGap(q.gap); else render();
}
// 某项信息刚收集到：任务卡自动展开提示，3 秒后自动收起；手动点击或上滑可提前收起
let gapTimer;
function announceGap(id){
  S.justGot=id; S.taskOpen=true; render();
  clearTimeout(gapTimer);
  gapTimer=setTimeout(()=>{ if(S.justGot===id){ S.justGot=null; S.taskOpen=false; if(S.view==='case'&&S.step===2) render(); } },3000);
}
function collapseTask(){ clearTimeout(gapTimer); S.justGot=null; S.taskOpen=false; render(); }
// 在 claude.ai 里打开时走平台下载（普通下载链接会被拦）；本地直接打开时用浏览器下载
async function saveCustomerHTML(){
  const filename=`${CUSTOMER.name}-场景说明.html`, data=customerHTML();
  if(window.claude){
    const downloads=await window.claude.use('downloads');
    if(!downloads){toast('当前页面不支持下载');return;}
    try{await downloads.save({filename,data});toast('已下载');}
    catch(e){if(e.code!=='declined')toast('下载失败，请稍后重试');}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/html'}));a.download=filename;a.click();URL.revokeObjectURL(a.href);
}
let lastFocus=null;
function openEvidence(id,trigger){
  const r=REQS[id]; lastFocus=trigger;
  const d=document.getElementById('drawer'), m=document.getElementById('mask');
  d.innerHTML=`<div class="row between"><h2 id="drawerTitle">${id} 的证据</h2><button class="btn" data-close>关闭</button></div>
    <div class="stack" style="margin-top:16px">
      <div><div class="note">来源</div><div>${r.src}</div></div>
      <div><div class="note">原文摘录</div><div class="quote">${r.excerpt}</div></div>
      <div><div class="note">据此判定</div><span class="tag ${VERDICT[S.verdicts[id]].cls}">${VERDICT[S.verdicts[id]].label}</span></div>
      <p class="note">证据来自已入库的手册和能力分层表。来源过期时以产品最新答复为准。</p>
    </div>`;
  d.classList.add('open');m.classList.add('open');d.focus();
  const close=()=>{d.classList.remove('open');m.classList.remove('open');lastFocus&&lastFocus.focus();};
  d.querySelector('[data-close]').onclick=close; m.onclick=close;
  d.onkeydown=e=>{if(e.key==='Escape')close();};
}
let tt;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2000);}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.view=b.dataset.nav;render();});
// 追问页：按数字键直接选候选回答（在输入框里打字时不触发）
document.addEventListener('keydown',e=>{
  if(S.view!=='case'||S.step!==2||e.target.matches('input,textarea,select')) return;
  const q=QUESTIONS[S.qIndex], i=+e.key-1;
  if(q&&q.options[i]) answer(q.options[i]);
});
render();
</script>
</body>
</html>
