<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>心连心 · 工作页索引</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { margin: 0; background: #f6f7f9; color: #1a1a1a; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    .lead { color: #555; margin: 0 0 28px; line-height: 1.5; }
    .cards { display: grid; gap: 14px; }
    a.card {
      display: block; padding: 18px 20px; background: #fff; border: 1px solid #e5e7eb;
      border-radius: 12px; text-decoration: none; color: inherit; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    a.card:hover { border-color: #94a3b8; }
    a.card strong { display: block; font-size: 1.05rem; margin-bottom: 4px; }
    a.card span { color: #64748b; font-size: .92rem; line-height: 1.45; }
    .note { margin-top: 28px; font-size: .85rem; color: #64748b; line-height: 1.5; }
    code { font-size: .85em; background: #eef2f7; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>心连心 · 培训考核工作页</h1>
    <p class="lead">光谱落地相关 HTML 工具页（不进个人站首页导航）。有链接即可打开与分享。</p>
    <div class="cards">
      <a class="card" href="./flow/">
        <strong>实施流程 · 甬道图</strong>
        <span>操作级泳道（42 节点）· 跨道连线 · 点步骤看详情</span>
      </a>
      <a class="card" href="./feature-list/">
        <strong>Feature List · 可标记</strong>
        <span>A01–A29 / L01–L11 · 勾选、判定、备注 · 导出 JSON/MD（备注存本机浏览器）</span>
      </a>
    </div>
    <p class="note">路径：<code>/work/xlx/</code> · 页面带 noindex，不进站点 sitemap。备注仅存在打开者本机 localStorage，分享链接不会带上他人的标记。</p>
  </main>
</body>
</html>
