<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>工作页面</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
  <link rel="stylesheet" href="../../assets/fonts/fonts.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="brand" href="#/">工作页面</a>
      <p class="brand-note">只存在这台浏览器。首页导航里没有这里。</p>
      <nav aria-label="工作页面">
        <a href="#/" data-nav="overview">总览</a>
        <a href="#/projects" data-nav="projects">项目</a>
        <a href="#/pages" data-nav="pages">全部页面</a>
        <a href="#/favorites" data-nav="favorites">收藏</a>
        <a href="#/recent" data-nav="recent">最近打开</a>
      </nav>
      <div class="side-foot">
        <button type="button" data-act="export">导出备份</button>
        <button type="button" data-act="import">导入备份</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
    </aside>
    <div class="main">
      <header class="top">
        <label class="search">
          <span class="sr">搜索</span>
          <input id="q" type="search" placeholder="搜索标题、路径或标签" autocomplete="off">
        </label>
      </header>
      <div id="view" class="view"></div>
    </div>
  </div>
  <dialog id="modal"></dialog>
  <p id="toast" role="status" hidden></p>
  <script type="module" src="./app.js"></script>
</body>
</html>
