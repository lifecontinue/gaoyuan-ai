<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>光谱优化进展汇报 · 2026-11-06</title>
<style>
  :root {
    --bg: #f5f7fb; --card: #fff; --line: #e6e9ef; --text: #1f2329; --sub: #5f6672; --muted: #8f959e;
    --brand: #2f6bff; --brand-soft: #eaf1ff;
    --p1: #2f9e6a; --p1-soft: #e6f6ee; --p2: #6b5cf0; --p2-soft: #efecfe;
    --amber: #c27400; --amber-soft: #fdf1dc; --gray-soft: #f0f2f5; --today: #e5484d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 4px 0 0; color: var(--sub); }
  header .date { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .card > h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: baseline; gap: 10px; }
  .card > h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }

  .phases { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .phase { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; border-top: 4px solid var(--c); }
  .phase .k { font-size: 13px; color: var(--c); font-weight: 600; }
  .phase h3 { margin: 2px 0 6px; font-size: 17px; }
  .phase p { margin: 0 0 10px; color: var(--sub); font-size: 13px; }
  .phase .nums { display: flex; gap: 22px; }
  .phase .nums b { display: block; font-size: 20px; }
  .phase .nums span { font-size: 12px; color: var(--muted); }

  table.list { width: 100%; border-collapse: collapse; }
  .list th { text-align: left; font-weight: 500; color: var(--sub); font-size: 13px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: #fafbfc; white-space: nowrap; }
  .list td { padding: 7px 10px; border-bottom: 1px solid #f0f2f5; vertical-align: top; }
  .list tr.phase-row td { background: var(--soft); color: var(--c); font-weight: 600; padding: 9px 10px; }
  .list tr.parent td { font-weight: 600; background: #fcfcfd; }
  .list tr.parent td.num { color: var(--muted); font-weight: 500; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .list tr.child td { color: var(--sub); font-size: 13px; }
  .list tr.child td.name { padding-left: 34px; position: relative; }
  .list tr.child td.name::before { content: ""; position: absolute; left: 20px; top: 15px; width: 6px; height: 6px; border-radius: 50%; background: #c9ced6; }
  .list td.date { white-space: nowrap; font-size: 13px; }
  .st { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .st-done { background: #1f9d55; color: #fff; }
  .st-test { background: #e3f5ea; color: #1f9d55; }
  .st-sched { background: var(--brand-soft); color: var(--brand); }
  .st-dev { background: var(--brand-soft); color: var(--brand); }
  .st-plan { background: var(--gray-soft); color: var(--sub); }
  .low { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }

  .gantt { overflow-x: auto; }
  .g-grid { min-width: 980px; position: relative; margin-bottom: 22px; }
  .g-row { display: grid; grid-template-columns: 230px 1fr; align-items: center; min-height: 34px; border-bottom: 1px solid #f0f2f5; }
  .g-row.head { min-height: 30px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .g-row.ph { background: var(--soft); color: var(--c); font-weight: 600; font-size: 13px; min-height: 30px; }
  .g-label { padding: 4px 10px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-track { position: relative; height: 100%; min-height: inherit; }
  .g-tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid #eef0f3; }
  .g-tick span { position: absolute; top: 6px; left: 4px; white-space: nowrap; }
  .g-bar { position: absolute; top: 8px; height: 18px; border-radius: 9px; background: var(--c); color: #fff; font-size: 11px; line-height: 18px; padding: 0 8px; white-space: nowrap; overflow: hidden; }
  .g-bar.tail { background: transparent; border: 1.5px dashed var(--c); opacity: .7; }
  .g-bar.tbd { background: repeating-linear-gradient(45deg, #eef0f3, #eef0f3 6px, #f7f8fa 6px, #f7f8fa 12px); color: var(--muted); border: 1px dashed #cfd4dc; }
  .g-ms { position: absolute; top: 9px; width: 14px; height: 14px; transform: translateX(-7px) rotate(45deg); background: var(--c); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--c); }
  .g-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--today); z-index: 3; pointer-events: none; }
  .g-today span { position: absolute; bottom: -20px; left: 4px; font-size: 11px; color: var(--today); white-space: nowrap; background: #fff; padding: 0 3px; }
  .g-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--sub); }
  .g-legend i { display: inline-block; width: 18px; height: 8px; border-radius: 4px; vertical-align: middle; margin-right: 5px; }

  .confirm ol { margin: 0; padding-left: 20px; }
  .confirm li { margin: 5px 0; }
  .confirm li span { color: var(--muted); font-size: 13px; }
  .proto { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .proto a { background: var(--brand); color: #fff; text-decoration: none; padding: 7px 16px; border-radius: 8px; white-space: nowrap; }

  .edit-bar { position: sticky; top: 0; z-index: 10; display: flex; gap: 12px; align-items: center; justify-content: space-between; background: #fff7e6; border: 1px solid #f3dfb5; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; color: var(--amber); }
  .edit-bar[hidden] { display: none; }
  .edit-bar button { background: var(--brand); color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; white-space: nowrap; }
  .list input, .list select { font: inherit; font-size: 12px; border: 1px solid var(--brand); border-radius: 4px; padding: 1px 4px; }
  footer { margin-top: 24px; color: var(--muted); font-size: 12px; text-align: center; }
  @media (max-width: 760px) { .phases { grid-template-columns: 1fr; } }
  @media print { body { background: #fff; } .card, .phase { break-inside: avoid; } * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>

<script>
const STATUS = { done: ["已上线", "st-done"], test: ["测试中", "st-test"], dev: ["开发中", "st-dev"], sched: ["已排期", "st-sched"], plan: ["待排期", "st-plan"] };
const DATA = JSON.parse(document.getElementById("data").textContent);
const editing = location.hash === "#edit";
const DAY = 86400000;
const toDate = s => new Date(s + "T00:00:00");
const md = s => s ? `${toDate(s).getMonth() + 1}月${toDate(s).getDate()}日` : "";

function render(edit) {
  document.getElementById("edit-bar").hidden = !edit;
  renderPhases();
  renderList(edit);
  renderGantt();
}

// 阶段完成日 = 该期已排期需求里最晚的上线日
const phaseEnd = p => p.items.map(i => i.endLatest || i.end).filter(Boolean).sort().pop() || "";
const phaseEarly = p => p.items.map(i => i.end).filter(Boolean).sort().pop() || "";
const endText = it => it.endLatest ? `${md(it.end)}–${md(it.endLatest)}（待定）` : md(it.end);

function renderPhases() {
  document.getElementById("phases").innerHTML = DATA.phases.map(p => {
    const subs = p.items.reduce((n, i) => n + i.sub.length, 0);
    const pending = p.items.filter(i => i.s === "plan").length;
    const end = phaseEnd(p), early = phaseEarly(p);
    const endLabel = end && early !== end ? `${md(early)}–${md(end)}` : md(end);
    return `<div class="phase" style="--c:var(--${p.color})">
      <div class="k">${p.name}</div><h3>${p.title}</h3><p>${p.desc}</p>
      <div class="nums">
        <div><b>${p.items.length}</b><span>项需求</span></div>
        <div><b>${subs}</b><span>个功能点</span></div>
        <div><b>${end ? endLabel : "待排期"}</b><span>${!end ? "暂未排期" : pending ? `已排期部分完成；另 ${pending} 项待排期` : early !== end ? "计划全部上线，具体日期待定" : "计划全部上线"}</span></div>
      </div></div>`;
  }).join("");
}

function renderList(edit) {
  let total = 0;
  const rows = DATA.phases.map((p, pi) => {
    const head = `<tr class="phase-row" style="--c:var(--${p.color});--soft:var(--${p.color}-soft)"><td colspan="5">${p.name}：${p.title}</td></tr>`;
    return head + p.items.map((it, ii) => {
      total += it.sub.length;
      const num = `${pi + 1}.${ii + 1}`;
      const parent = `<tr class="parent"><td class="num">${num}</td>
        <td>${it.t}${it.low ? '<span class="low">优先级低</span>' : ""}</td>
        <td>${edit ? statusSelect(it.s, pi, ii) : `<span class="st ${STATUS[it.s][1]}">${STATUS[it.s][0]}</span>`}</td>
        <td class="date">${dateCell(it.start, pi, ii, "start", edit)}</td>
        <td class="date">${edit ? `${dateCell(it.end, pi, ii, "end", edit)}<br>至 ${dateCell(it.endLatest || "", pi, ii, "endLatest", edit)}` : it.end ? endText(it) : '<span style="color:var(--muted)">待排期</span>'}</td></tr>`;
      const children = it.sub.map((s, si) => `<tr class="child"><td class="num" style="color:var(--muted);font-size:12px">${num}.${si + 1}</td><td class="name" colspan="4">${s}</td></tr>`).join("");
      return parent + children;
    }).join("");
  }).join("");
  document.getElementById("list").innerHTML = rows;
  document.getElementById("list-count").textContent = `共 ${DATA.phases.reduce((n, p) => n + p.items.length, 0)} 项需求、${total} 个功能点`;
  document.querySelectorAll("[data-field]").forEach(el => el.oninput = el.onchange = () => {
    const [pi, ii, f] = el.dataset.field.split(".");
    DATA.phases[pi].items[ii][f] = el.value;
    renderPhases(); renderGantt();
  });
}

function dateCell(v, pi, ii, f, edit, empty = "—") {
  return edit ? `<input type="date" value="${v}" data-field="${pi}.${ii}.${f}">` : (v ? md(v) : `<span style="color:var(--muted)">${empty}</span>`);
}

function statusSelect(v, pi, ii) {
  return `<select data-field="${pi}.${ii}.s">${Object.entries(STATUS).map(([k, [l]]) => `<option value="${k}" ${k === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
}

function renderGantt() {
  const [from, to] = DATA.range.map(toDate);
  const span = (to - from) / DAY;
  const pos = d => Math.max(0, Math.min(100, (((typeof d === "string" ? toDate(d) : d) - from) / DAY) / span * 100));
  const ticks = [];
  for (let d = new Date(from); d <= to; d = new Date(+d + 7 * DAY)) {
    ticks.push(`<div class="g-tick" style="left:${pos(d)}%"><span>${d.getMonth() + 1}/${d.getDate()}</span></div>`);
  }
  const grid = ticks.join("").replace(/<span>.*?<\/span>/g, "");
  const today = `<div class="g-today" style="left:calc(230px + (100% - 230px) * ${pos(DATA.today) / 100})"><span>今天 ${md(DATA.today)}</span></div>`;

  let html = `<div class="g-row head"><div class="g-label">需求</div><div class="g-track">${ticks.join("")}</div></div>`;
  DATA.phases.forEach(p => {
    const c = `--c:var(--${p.color});--soft:var(--${p.color}-soft)`;
    const end = phaseEnd(p);
    const ms = end ? `<div class="g-ms" style="left:${pos(end)}%" title="${p.name}最晚上线 ${md(end)}"></div>` : "";
    html += `<div class="g-row ph" style="${c}"><div class="g-label">${p.name}</div><div class="g-track">${grid}${ms}</div></div>`;
    p.items.forEach(it => {
      let bar;
      if (it.start && it.end) {
        const l = pos(it.start), w = Math.max(pos(it.end) - l, 1.5);
        const label = it.s === "done" ? `已上线 · ${md(it.end)}` : `${endText(it)}上线`;
        const tail = it.endLatest ? `<div class="g-bar tail" style="left:${pos(it.end)}%;width:${pos(it.endLatest) - pos(it.end)}%"></div>` : "";
        bar = `${tail}<div class="g-bar" style="left:${l}%;width:${w}%" title="${md(it.start)} – ${endText(it)}">${label}</div>`;
      } else if (it.start) {
        const l = pos(it.start), w = Math.max(pos(DATA.today) - l, 1.5);
        bar = `<div class="g-bar" style="left:${l}%;width:${w}%">${STATUS[it.s][0]}</div>`;
      } else {
        bar = `<div class="g-bar tbd" style="left:${pos(DATA.today)}%;width:22%">待排期</div>`;
      }
      html += `<div class="g-row" style="${c}"><div class="g-label" title="${it.t}">${it.t}</div><div class="g-track">${grid}${bar}</div></div>`;
    });
  });
  document.getElementById("gantt").innerHTML = html + today;
}

// 把修改写回页面数据，下载一份不带编辑状态的新文件
function saveFile() {
  document.getElementById("data").textContent = "\n" + JSON.stringify(DATA, null, 1) + "\n";
  render(false);
  const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  render(true);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  a.download = document.title.replace(/\s+/g, "") + ".html";
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById("save").onclick = saveFile;
render(editing);
</script>
