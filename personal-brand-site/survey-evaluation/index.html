    ['讲师中心', 'getSfDegree4Teacher、getSatisfactionDegree', '满意度接口结构不变，合并两边数据；新增加权得分字段', '待指定', '二期'],
    ['易培', '创建评估任务（引用对象待确认）', '创建任务时选评估型调查', '待指定', '二期'],
    ['国药等定制开放接口', 'guoYaoOpen 等', '不切，留在评估管理', '—', '不做'],
  ];
  return `<h1>接入方切换</h1>
  <div class="card"><div class="scroll"><table>
    <thead><tr><th>接入方</th><th>现在调评估管理</th><th>切换后</th><th>负责人</th><th>分期</th></tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td>${i === 4 ? `<span class="tag ${c === '不做' ? '' : 'blue'}">${c}</span>` : c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>
  <p class="note" style="margin-top:12px">切换跟随租户开关：开关打开后，该租户各入口新建都走调查；已有评估管理项目照常查看和作答到结束。来源清单取自评估管理现网「项目来源」下拉（2026-11-03），易培不在其中。各接入方实际调用的接口和调用量待研发确认。</p></div>`;
}

/* ---------- 学员端作答（手机） ---------- */
state.rankVisible = true;
state.stu = { q: '', screen: 'entry', entry: 'todo', scanRule: 'list', picks: [], mine: [], status: {}, cur: null, ans: {} };
const STU_ME = { name: '周一', dept: '研发中心', rel: '学员' };
const SURVEY_NAME = '2026 Q4 内训师授课评估';

function stuObjects() { return state.stu.mine.map(id => state.objects.find(o => o.id === id)).filter(Boolean); }
function stuStart(entry) {
  const s = state.stu;
  s.entry = entry; s.status = {}; s.ans = {}; s.cur = null; s.picks = [];
  if (entry === 'todo' || entry === 'scanIn') { s.mine = state.objects.slice(0, 4).map(o => o.id); s.screen = 'list'; }
  else if (s.scanRule === 'pick') { s.mine = []; s.screen = 'pick'; }
  else s.screen = 'denied';
}

function pageStudent() {
  const s = state.stu;
  return `<h1>学员端作答</h1>
  <div class="stu-wrap">
    <div class="phone" aria-label="学员端手机预览"><div class="phone-bar"><span>9:41</span><span>${SURVEY_NAME}</span><span></span></div>
      <div class="phone-body">${({ entry: stuEntry, pick: stuPick, list: stuList, answer: stuAnswer, done: stuDone, denied: stuDenied })[s.screen]()}</div></div>
    <div class="card stu-ctrl">
      <h2>演示入口</h2>
      <div class="col">
        <button class="btn" data-stu-entry="todo">从待办进入（周一，已安排评测 4 位讲师）</button>
        <button class="btn" data-stu-entry="scanIn">扫码进入（周一在评测人名单中）</button>
        <button class="btn" data-stu-entry="scanOut">扫码进入（不在评测人名单中的学员）</button>
      </div>
      <h2 style="margin-top:20px">扫码规则（项目设置里配置）</h2>
      <label class="switch"><input type="radio" name="scanRule" value="list" ${s.scanRule === 'list' ? 'checked' : ''} /> 只允许评测人名单内的人参与</label>
      <label class="switch" style="margin-top:8px"><input type="radio" name="scanRule" value="pick" ${s.scanRule === 'pick' ? 'checked' : ''} /> 任何人扫码可参与，自己选择评估对象</label>
      <p class="note" style="margin-top:8px">自选评估对象时，评测关系记为「学员」，按该对象「学员」关系的权重计分；对象没有「学员」关系时，不能被自选。</p>
      <label class="switch" style="margin-top:12px"><input type="checkbox" id="stuRankVis" ${state.rankVisible ? 'checked' : ''} /> 允许学员查看排名（项目设置）</label>
      <h2 style="margin-top:20px">规则</h2>
      <ul class="note" style="padding-left:18px">
        <li>每个对象一份答卷，可暂存，提交后只能查看。</li>
        <li>全部对象提交后，这次评估才算完成；来源应用（如学习地图）在这时收到完成回调。</li>
        <li>匿名模式下，作答页顶部提示「本次评估为匿名，管理员看不到你的姓名」。</li>
        <li>项目设置开启「允许学员查看排名」时，列表显示每个对象的当前排名和综合得分（与评估管理现网学员端一致）。</li>
      </ul>
    </div>
  </div>`;
}

function stuEntry() {
  return `<div class="stu-pad"><p class="stu-title">${SURVEY_NAME}</p>
    <p class="stu-note">请在右侧选择一种入口开始演示。</p></div>`;
}
function stuDenied() {
  return `<div class="stu-pad stu-center"><div class="stu-icon warn">!</div>
    <p class="stu-title">你不在本次评估的评测人名单中</p>
    <p class="stu-note">如需参与，请联系培训管理员。</p></div>`;
}
function stuPick() {
  const s = state.stu, can = state.objects.filter(o => o.rels.some(r => r.name === '学员'));
  return `<div class="stu-pad"><p class="stu-title">选择你要评价的讲师</p>
    <p class="stu-note">可多选，确定后逐个评价。</p>
    ${can.map(o => `<label class="stu-pick"><input type="checkbox" data-stu-pick="${o.id}" ${s.picks.includes(o.id) ? 'checked' : ''} />
      <span><b>${o.name}</b><span class="stu-note">${o.level || ''}${o.pool ? '　' + o.pool : ''}</span></span></label>`).join('')}
    <button class="btn primary stu-full" id="stuPickOk" ${s.picks.length ? '' : 'disabled'}>开始评价（${s.picks.length}）</button></div>`;
}
function stuStatus(id) { return state.stu.status[id] || 'todo'; }
// 学员可见排名时显示「当前排名、综合得分」（评估管理现网学员端同样展示）
function stuRank(id) {
  const ranked = OBJECTS.map(o => ({ id: o.id, sc: objScore(o.id).score })).filter(x => x.sc != null).sort((a, b) => b.sc - a.sc);
  const i = ranked.findIndex(x => x.id === id);
  return i < 0 ? null : { rank: i + 1, score: ranked[i].sc };
}
function stuList() {
  const s = state.stu, all = stuObjects(), done = all.filter(o => stuStatus(o.id) === 'done').length;
  const objs = all.filter(o => !s.q || o.name.includes(s.q));
  const label = { todo: ['未开始', ''], draft: ['已暂存', 'orange'], done: ['已提交', 'green'] };
  return `<div class="stu-pad">
    <p class="stu-title">${SURVEY_NAME}</p>
    <p class="stu-note">请对以下讲师分别评价，已完成 <b>${done}/${all.length}</b></p>
    <div class="stu-progress"><i style="width:${all.length ? done / all.length * 100 : 0}%"></i></div>
    <input type="search" class="stu-search" id="stuSearch" value="${s.q || ''}" placeholder="搜索被评测对象" aria-label="搜索被评测对象" />
    ${objs.length ? '' : '<p class="stu-note stu-center">没有找到该被评测对象</p>'}
    ${objs.map(o => { const st = stuStatus(o.id), rel = s.entry === 'scanOut' ? '学员' : (o.rels[0] || {}).name || '学员';
      const rk = state.rankVisible ? stuRank(o.id) : null;
      return `<div class="stu-obj"><div><b>${o.name}</b> <span class="tag">${rel}</span><div class="stu-note">${o.level || o.dept || ''}${o.pool ? '　' + o.pool : ''}</div>
        ${rk ? `<div class="stu-rank">当前排名 ${rk.rank}　综合得分 ${r1(rk.score)} 分</div>` : ''}</div>
        <div class="stu-obj-r"><span class="tag ${label[st][1]}">${label[st][0]}</span>
        <button class="btn ${st === 'done' ? '' : 'primary'} sm" data-stu-open="${o.id}">${st === 'done' ? '查看我的答卷' : (st === 'draft' ? '继续评价' : '去评价')}</button></div></div>`; }).join('')}
    ${s.entry === 'scanOut' ? '<button class="btn stu-full" id="stuRepick">修改评价对象</button>' : ''}
  </div>`;
}

function stuQ(q, i, ro) {
  const k = `${state.stu.cur}.${i}`, v = state.stu.ans[k];
  const dis = ro ? 'disabled' : '';
  let body = '';
  if (q.type === '打分') body = `<div class="stu-scale">${Array.from({ length: q.max - q.min + 1 }, (_, n) => q.min + n).map(n => `<button class="stu-chip ${v === n ? 'on' : ''}" data-stu-a="${i}" data-val="${n}" ${dis}>${n}</button>`).join('')}</div>`;
  if (q.type === 'NPS') body = `<div class="stu-scale">${Array.from({ length: 11 }, (_, n) => `<button class="stu-chip sm ${v === n ? 'on' : ''}" data-stu-a="${i}" data-val="${n}" ${dis}>${n}</button>`).join('')}</div>`;
  if (q.type === '单选') body = q.opts.map((o, n) => `<label class="stu-opt"><input type="radio" name="sq${i}" data-stu-a="${i}" data-val="${n}" ${v === n ? 'checked' : ''} ${dis} /> ${o.t}</label>`).join('');
  if (q.type === '多选') body = q.opts.map((o, n) => `<label class="stu-opt"><input type="checkbox" data-stu-m="${i}" data-val="${n}" ${(v || []).includes(n) ? 'checked' : ''} ${dis} /> ${o.t}</label>`).join('');
  if (q.type === '矩阵单选' || q.type === '矩阵量表') body = q.rows.map((r, ri) => `<div class="stu-mrow"><div class="stu-note">${r}</div><div class="stu-scale">${q.cols.map((c, ci) => `<button class="stu-chip sm ${(v || {})[ri] === ci ? 'on' : ''}" data-stu-x="${i}" data-row="${ri}" data-val="${ci}" ${dis}>${c.t}</button>`).join('')}</div></div>`).join('');
  if (['问答', '填空', '矩阵填空'].includes(q.type)) body = `<textarea class="stu-text" data-stu-t="${i}" placeholder="请输入" ${dis}>${v || ''}</textarea>`;
  return `<div class="stu-q"><p>${q.req ? '<span class="req">*</span>' : ''}${i + 1}. ${q.title}</p>${body}</div>`;
}
function stuAnswer() {
  const s = state.stu, o = state.objects.find(x => x.id === s.cur), ro = stuStatus(s.cur) === 'done';
  const objs = stuObjects(), idx = objs.findIndex(x => x.id === s.cur);
  return `<div class="stu-head"><button class="btn link" id="stuBack">‹ 返回</button><span>${idx + 1}/${objs.length}</span></div>
    <div class="stu-pad">
      ${state.anon ? '<p class="stu-anon">本次评估为匿名，管理员看不到你的姓名。</p>' : ''}
      <div class="stu-target"><span class="stu-note">被评测对象</span><b>${o.name}</b><span class="stu-note">${o.level || ''}${o.pool ? '　' + o.pool : ''}</span></div>
      ${state.edQs.map((q, i) => stuQ(q, i, ro)).join('')}
      ${ro ? '<p class="stu-note stu-center">已提交，只能查看。</p>' : `<div class="stu-ops"><button class="btn" id="stuDraft">暂存</button><button class="btn primary" id="stuSubmit">提交</button></div>`}
    </div>`;
}
function stuDone() {
  return `<div class="stu-pad stu-center"><div class="stu-icon ok">✓</div>
    <p class="stu-title">评价已全部提交</p><p class="stu-note">感谢你的评价！</p>
    <button class="btn stu-full" id="stuToList">查看我的评价</button></div>`;
}

function stuMissing() {
  const s = state.stu;
  return state.edQs.findIndex((q, i) => {
    if (!q.req) return false;
    const v = s.ans[`${s.cur}.${i}`];
    if (q.type === '矩阵单选' || q.type === '矩阵量表') return !v || Object.keys(v).length < q.rows.length;
    if (q.type === '多选') return !v || !v.length;
    return v === undefined || v === '';
  });
}

function bindStudent() {
  const s = state.stu, on = (sel, ev, fn) => { const el = main.querySelector(sel); if (el) el.addEventListener(ev, fn); };
  main.querySelectorAll('[data-stu-entry]').forEach(b => b.onclick = () => { stuStart(b.dataset.stuEntry); render(); });
  on('#stuRankVis', 'change', e => { state.rankVisible = e.target.checked; render(); });
  main.querySelectorAll('input[name=scanRule]').forEach(r => r.onchange = () => { s.scanRule = r.value; if (s.entry === 'scanOut') stuStart('scanOut'); render(); });
  main.querySelectorAll('[data-stu-pick]').forEach(c => c.onchange = () => { const id = c.dataset.stuPick; s.picks = c.checked ? [...s.picks, id] : s.picks.filter(x => x !== id); render(); });
  on('#stuPickOk', 'click', () => { s.mine = [...s.picks]; s.screen = 'list'; render(); });
  on('#stuRepick', 'click', () => { s.picks = [...s.mine]; s.screen = 'pick'; render(); });
  main.querySelectorAll('[data-stu-open]').forEach(b => b.onclick = () => { s.cur = b.dataset.stuOpen; s.screen = 'answer'; render(); main.querySelector('.phone-body').scrollTop = 0; });
  on('#stuBack', 'click', () => { s.screen = 'list'; render(); });
  on('#stuSearch', 'change', e => { s.q = e.target.value.trim(); render(); });
  on('#stuToList', 'click', () => { s.screen = 'list'; render(); });
  const key = i => `${s.cur}.${i}`;
  main.querySelectorAll('[data-stu-a]').forEach(b => b.addEventListener(b.tagName === 'INPUT' ? 'change' : 'click', () => { s.ans[key(b.dataset.stuA)] = Number(b.dataset.val); render(); }));
  main.querySelectorAll('[data-stu-m]').forEach(c => c.onchange = () => { const k = key(c.dataset.stuM), n = Number(c.dataset.val), cur = s.ans[k] || []; s.ans[k] = c.checked ? [...cur, n] : cur.filter(x => x !== n); });
  main.querySelectorAll('[data-stu-x]').forEach(b => b.onclick = () => { const k = key(b.dataset.stuX); s.ans[k] = { ...(s.ans[k] || {}), [b.dataset.row]: Number(b.dataset.val) }; render(); });
  main.querySelectorAll('[data-stu-t]').forEach(t => t.onchange = () => { s.ans[key(t.dataset.stuT)] = t.value; });
  on('#stuDraft', 'click', () => { s.status[s.cur] = 'draft'; s.screen = 'list'; render(); toast('已暂存，下次可继续评价'); });
  on('#stuSubmit', 'click', () => {
    const m = stuMissing();
    if (m >= 0) { toast(`第 ${m + 1} 题还没有作答`); return; }
    s.status[s.cur] = 'done';
    const left = stuObjects().filter(o => stuStatus(o.id) !== 'done');
    s.screen = left.length ? 'list' : 'done'; render(); toast(left.length ? `已提交，还剩 ${left.length} 位讲师` : '已全部提交');
  });
}

/* ---------- 事件 ---------- */
function bind() {
  if (state.page === 'create' && state.step === 'score') bindEditor();
  if (state.page === 'create' && state.step === 'rel') bindRel();
  if (state.page === 'student') bindStudent();
  main.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  main.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { state.step = b.dataset.step; render(); });
  main.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
  const on = (sel, ev, fn) => { const el = main.querySelector(sel); if (el) el.addEventListener(ev, fn); };
  on('#newSurvey', 'click', () => $('#mask').classList.add('show'));
  on('#rankVisSet', 'change', e => { state.rankVisible = e.target.checked; });
  main.querySelectorAll('[data-scan]').forEach(r => r.onchange = () => { state.stu.scanRule = r.dataset.scan; });
  main.querySelectorAll('[data-toast]').forEach(b => b.onclick = () => toast(b.dataset.toast));
  main.querySelectorAll('input[name=anon]').forEach(r => r.onchange = () => { state.anon = r.value === '1'; });
  on('#anonView', 'change', e => { state.anon = e.target.checked; render(); });
  on('#publish', 'click', e => toast(e.target.dataset.ok === 'true' ? '已发布' : '还有检查项未通过，不能发布'));
  on('#relFilter', 'change', e => { state.relFilter = e.target.value; render(); });
  on('#deptFilter', 'change', e => { state.deptFilter = e.target.value; render(); });
  on('#trim', 'change', e => { state.trim = e.target.checked; render(); });
  on('#weighted', 'change', e => { state.weighted = e.target.checked; render(); });
  on('#exportBtn', 'click', () => toast('已加入导出任务，可在导出任务列表下载'));
}
document.querySelectorAll('.side a').forEach(a => a.onclick = () => { if (a.dataset.page === 'create') { state.step = 'score'; state.selQ = null; } go(a.dataset.page); });
document.querySelectorAll('.typecard').forEach(c => c.onclick = () => { document.querySelectorAll('.typecard').forEach(x => x.classList.remove('on')); c.classList.add('on'); });
$('#modalCancel').onclick = () => $('#mask').classList.remove('show');
$('#modalOk').onclick = () => {
  $('#mask').classList.remove('show');
  if (document.querySelector('.typecard.on').dataset.type === 'eval') { state.step = 'score'; go('create'); } else toast('普通调查沿用现有流程');
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (state.poolOpen || state.tplOpen || state.importOpen || state.peopleOpen)) { state.poolOpen = state.tplOpen = state.importOpen = state.peopleOpen = false; render(); } });
render();
</script>
</body>
</html>
