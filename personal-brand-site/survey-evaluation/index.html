<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>评估型调查原型</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --primary: #0152D9; --primary-hover: #2A6BDD; --primary-soft: #EEF4FF;
    --text-1: #1F1F1F; --text-2: #595959; --text-3: #8C8C8C;
    --border: #D9D9D9; --divider: #E5E5E5; --page: #F8F8F8; --card: #FFFFFF; --block: #F5F5F5;
    --danger: #FF4D4F; --danger-soft: #FFF1F0; --success: #52C41A; --success-soft: #F6FFED;
    --warning: #FAAD14; --warning-soft: #FFFBE6; --navy: #16335F;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; font-size: 14px; line-height: 22px; color: var(--text-1); background: var(--page); }
  button, input, select { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 208px 1fr; min-height: 100vh; }
  .side { background: var(--navy); color: #fff; padding: 16px 0; }
  .side .brand { padding: 0 20px 16px; font-weight: 500; }
  .side .group { padding: 12px 20px 4px; font-size: 12px; color: rgba(255,255,255,.55); }
  .side a { display: block; padding: 8px 20px; color: rgba(255,255,255,.85); text-decoration: none; cursor: pointer; }
  .side a:hover { background: rgba(255,255,255,.08); }
  .side a.on { background: var(--primary); color: #fff; }
  main { padding: 24px; min-width: 0; }
  h1 { font-size: 20px; line-height: 28px; font-weight: 500; margin-bottom: 16px; }
  h2 { font-size: 16px; line-height: 24px; font-weight: 500; margin-bottom: 12px; }
  .card { background: var(--card); border-radius: 8px; padding: 24px; margin-bottom: 16px; }
  .note { font-size: 12px; line-height: 20px; color: var(--text-3); }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .btn { height: 32px; padding: 0 16px; border-radius: 4px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.link { border: none; padding: 0; height: auto; color: var(--primary); background: none; }
  input[type=text], input[type=number], select { height: 32px; border: 1px solid var(--border); border-radius: 4px; padding: 0 8px; background: #fff; }
  input[type=number] { width: 72px; }
  input:focus, select:focus, .btn:focus-visible { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--divider); vertical-align: middle; }
  th { background: var(--block); font-weight: 500; color: var(--text-2); white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 0 8px; border-radius: 4px; font-size: 12px; line-height: 20px; background: var(--block); color: var(--text-2); white-space: nowrap; }
  .tag.blue { background: var(--primary-soft); color: var(--primary); }
  .tag.red { background: var(--danger-soft); color: var(--danger); }
  .tag.green { background: var(--success-soft); color: #389E0D; }
  .tag.orange { background: var(--warning-soft); color: #AD6800; }
  .banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 4px; background: var(--primary-soft); margin-bottom: 16px; }
  .banner.warn { background: var(--warning-soft); }
  .steps { display: flex; gap: 0; margin-bottom: 16px; background: #fff; border-radius: 8px; overflow: hidden; }
  .steps button { flex: 1; height: 48px; border: none; background: #fff; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; }
  .steps button.on { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }
  .tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--divider); margin-bottom: 16px; }
  .tabs button { border: none; background: none; height: 40px; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .switch input { width: 16px; height: 16px; accent-color: var(--primary); }
  .bar { height: 8px; border-radius: 4px; background: var(--block); min-width: 80px; position: relative; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--primary); }
  .err { color: var(--danger); }
  .ok { color: #389E0D; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: grid; grid-template-columns: 112px 1fr; gap: 8px 16px; align-items: center; margin-bottom: 16px; }
  .field label { color: var(--text-2); }
  .typecards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .typecard { border: 1px solid var(--border); border-radius: 8px; padding: 16px; cursor: pointer; background: #fff; text-align: left; }
  .typecard.on { border-color: var(--primary); background: var(--primary-soft); }
  .typecard b { display: block; font-weight: 500; margin-bottom: 4px; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 10; }
  .mask.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 24px; width: min(560px, calc(100vw - 32px)); }
  .modal .foot { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: #fff; padding: 10px 16px; border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; z-index: 20; }
  .toast.show { display: block; }
  .scroll { overflow-x: auto; }
  .muted { color: var(--text-3); }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .side { display: flex; flex-wrap: wrap; padding: 8px; }
    .side .brand, .side .group { display: none; }
    .side a { padding: 6px 10px; }
    main { padding: 16px; }
    .grid2, .typecards { grid-template-columns: 1fr; }
    .field { grid-template-columns: 1fr; }
  }

  /* ===== 第 1 步：沿用调查管理(新)「新建问卷」页（参照 survey-paragraph-one-per-question/ref/） ===== */
  main.editor-mode { padding: 0; }
  .ed { --e-primary: #0f5fd7; --e-primary-light: #e8f0fc; --e-text: #303133; --e-text-2: #606266; --e-text-3: #909399;
        --e-border: #dcdfe6; --e-border-light: #ebeef5; --e-danger: #f56c6c;
        display: flex; flex-direction: column; height: 100vh; background: #f0f2f5; font-size: 13px; color: var(--e-text); }
  .ed-head { height: 52px; background: #fff; display: flex; align-items: center; padding: 0 16px 0 20px; border-bottom: 1px solid var(--e-border-light); flex: none; }
  .ed-head h1 { font-size: 14px; font-weight: 500; margin: 0; flex: 1; display: flex; align-items: center; gap: 8px; }
  .ed-btn { height: 30px; padding: 0 14px; border: 1px solid var(--e-border); background: #fff; border-radius: 3px; color: var(--e-text-2); font-size: 12px; margin-left: 8px; cursor: pointer; white-space: nowrap; }
  .ed-btn:hover { color: var(--e-primary); border-color: #a9c4ef; }
  .ed-btn.primary { background: var(--e-primary); border-color: var(--e-primary); color: #fff; }
  .ed-body { flex: 1; display: grid; grid-template-columns: 136px minmax(0, 1fr) 220px; min-height: 0; }
  .ed-pal { background: #fff; border-right: 1px solid var(--e-border-light); overflow-y: auto; padding: 10px 10px 20px; }
  .ed-pal-title { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 2px; }
  .ed-pal-title span { color: var(--e-text-3); }
  .ed-pal-item { height: 26px; margin: 4px 0; padding: 0 8px; background: #f5f6f8; border-radius: 3px; display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; border: none; width: 100%; color: var(--e-text); }
  .ed-pal-item:hover { background: var(--e-primary-light); color: var(--e-primary); }
  .ed-pal-item i { width: 12px; height: 12px; border: 1.2px solid currentColor; border-radius: 2px; flex: none; }
  .ed-pal-item .sc { margin-left: auto; font-size: 12px; color: var(--e-text-3); }
  .ed-pal-note { font-size: 12px; color: var(--e-text-3); line-height: 1.6; padding: 4px 2px 0; }
  .ed-wrap { overflow-y: auto; padding: 0 16px 80px; }
  .ed-sum { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #eef3fb; color: var(--e-text-2); font-size: 12px; padding: 8px 12px; margin: 12px 0 0; }
  .ed-sum b { color: var(--e-primary); font-weight: 600; }
  .ed-canvas { background: #fff; margin-top: 12px; }
  .ed-block { position: relative; border: 1px solid transparent; border-bottom-color: var(--e-border-light); cursor: pointer; }
  .ed-block:hover { border-color: #c6d8f5; }
  .ed-block.sel { border-color: var(--e-primary); box-shadow: inset 3px 0 0 var(--e-primary); }
  .ed-h { padding: 22px 52px 20px; }
  .ed-h-title { font-size: 16px; font-weight: 600; text-align: center; margin-bottom: 10px; }
  .ed-h-desc { font-size: 13px; color: var(--e-text-2); line-height: 1.8; }
  .ed-q { padding: 14px 52px 18px; }
  .ed-tags { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .ed-tag { display: inline-block; background: #f2f3f5; color: var(--e-text-2); font-size: 12px; padding: 0 6px; line-height: 20px; border-radius: 2px; }
  .ed-tag.score { background: #eef3fb; color: var(--e-primary); }
  .ed-q-title { font-size: 14px; display: flex; gap: 6px; align-items: baseline; margin-bottom: 14px; }
  .ed-q-title .req { color: var(--e-danger); margin-left: -10px; width: 4px; flex: none; }
  .ed-q-title .no { font-weight: 600; flex: none; }
  .ed-stars { display: flex; gap: 16px; color: var(--e-text-3); font-size: 12px; }
  .ed-stars span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .ed-stars span::before { content: "★"; color: #dcdfe6; font-size: 18px; }
  .ed-essay { height: 60px; border: 1px solid var(--e-border-light); border-radius: 3px; color: #c0c4cc; font-size: 12px; padding: 8px; }
  .ed-props { background: #fff; border-left: 1px solid var(--e-border-light); padding: 16px 14px; overflow-y: auto; }
  .ed-props h3 { font-size: 13px; font-weight: 500; margin: 0 0 16px; }
  .ed-props h4 { font-size: 12px; font-weight: 500; color: var(--e-text); margin: 20px 0 12px; padding-top: 16px; border-top: 1px solid var(--e-border-light); }
  .ed-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--e-text-2); margin-bottom: 16px; gap: 8px; }
  .ed-row a { color: var(--e-primary); cursor: pointer; }
  .ed-row input[type=number] { width: 64px; height: 26px; border: 1px solid var(--e-border); border-radius: 3px; padding: 0 6px; font-size: 12px; }
  .ed-row b { color: var(--e-text); font-weight: 500; }
  .ed-hint { font-size: 12px; color: var(--e-text-3); line-height: 1.6; background: #f7f8fa; padding: 8px 10px; border-radius: 3px; }
  .ed-sw { width: 30px; height: 16px; border-radius: 8px; background: var(--e-primary); position: relative; cursor: pointer; flex: none; border: none; padding: 0; }
  .ed-sw::after { content: ""; position: absolute; right: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  .ed-sw.off { background: #dcdfe6; }
  .ed-sw.off::after { right: auto; left: 2px; }
  .ed-sw:disabled { opacity: .5; cursor: not-allowed; }
  .ed-steps { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--e-text-3); margin-right: 8px; }
  .ed-steps b { color: var(--e-primary); font-weight: 500; }
  @media (max-width: 760px) { .ed-body { grid-template-columns: 1fr; } .ed-pal, .ed-props { display: none; } .ed-h, .ed-q { padding-left: 20px; padding-right: 20px; } }
  .reltable td.objcell { vertical-align: top; background: #fff; min-width: 150px; }
  .reltable td.objcell .note { margin-top: 4px; }
  .reltable tr.addrow td { padding: 4px 12px 12px; border-bottom: 1px solid var(--border); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .ed-tag.warn { background: #fdf6ec; color: #b88230; }
  .ed-err { color: var(--e-danger, #f56c6c); font-size: 12px; }
  .ed-q-desc { font-size: 12px; color: var(--e-text-3); margin: -8px 0 12px; }
  .ed-opt-view { display: flex; align-items: center; gap: 10px; min-height: 26px; color: var(--e-text-2); font-size: 12px; }
  .ed-opt-view i, .ed-opt i { width: 12px; height: 12px; border: 1px solid var(--e-border); border-radius: 50%; flex: none; }
  .ed-optscore { margin-left: auto; color: var(--e-text-3); min-width: 64px; text-align: right; }
  .ed-editing { cursor: default; }
  .ed-erow { display: flex; align-items: flex-start; gap: 6px; }
  .ed-erow .no { font-size: 14px; font-weight: 600; padding-top: 6px; flex: none; }
  .ed-erow .req { color: var(--e-danger); padding-top: 6px; margin-left: -10px; width: 4px; flex: none; }
  .ed-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .ed-in { height: 30px; border: 1px solid var(--e-border); border-radius: 3px; padding: 0 8px; font-size: 12px; color: var(--e-text); background: #fff; min-width: 0; }
  .ed-in:focus { border-color: var(--e-primary); outline: none; }
  .ed-in.title { font-size: 14px; height: 32px; }
  .ed-in.num { width: 72px; }
  .ed-in:disabled { background: #f5f7fa; }
  .ed-ebody { margin: 14px 0 0 28px; }
  .ed-opts { display: flex; flex-direction: column; gap: 6px; }
  .ed-opt, .ed-opt-head { display: grid; grid-template-columns: 12px minmax(0, 1fr) 72px 44px 22px; gap: 8px; align-items: center; }
  .ed-opt.noscore { grid-template-columns: 12px minmax(0, 1fr) 22px; }
  .ed-opt-head { font-size: 12px; color: var(--e-text-3); }
  .ed-opt input[type=checkbox] { justify-self: center; width: 14px; height: 14px; accent-color: var(--e-primary); }
  .ed-x { border: none; background: none; color: var(--e-text-3); font-size: 16px; cursor: pointer; }
  .ed-x:hover:not(:disabled) { color: var(--e-danger); }
  .ed-x:disabled { opacity: .3; cursor: not-allowed; }
  .ed-add { border: none; background: none; color: var(--e-primary); font-size: 12px; padding: 4px 0 0 20px; text-align: left; cursor: pointer; }
  .ed-tip { font-size: 12px; color: var(--e-text-3); margin-top: 8px; line-height: 1.6; }
  .ed-ops { display: flex; justify-content: flex-end; margin-top: 14px; }
  .ed-range { display: inline-flex; align-items: center; gap: 4px; }
  .ed-range input { width: 48px !important; }
  .ed-mini { width: 100%; font-size: 12px; margin-top: 4px; }
  .ed-mini th, .ed-mini td { padding: 6px 4px; border-bottom: 1px solid var(--e-border-light); background: none; color: var(--e-text-2); }
  .ed-mini th { color: var(--e-text-3); font-weight: 400; }
  .ed-opt-view i.sq, .ed-opt i.sq { border-radius: 2px; }
  .ed-matrix { width: 100%; border-collapse: collapse; font-size: 12px; color: var(--e-text-2); }
  .ed-matrix th, .ed-matrix td { padding: 6px 4px; text-align: center; border: none; background: none; font-weight: 400; }
  .ed-matrix td:first-child, .ed-matrix th:first-child { text-align: left; }
  .ed-matrix i { width: 12px; height: 12px; border: 1px solid var(--e-border); border-radius: 50%; display: inline-block; }
  .ed-matrix .ed-optscore { margin: 2px 0 0; text-align: center; min-width: 0; }
  .ed-nps { display: flex; gap: 4px; flex-wrap: wrap; }
  .ed-nps span { width: 28px; height: 26px; border: 1px solid var(--e-border-light); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--e-text-3); }
  .ed-scale-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--e-text-3); margin-top: 6px; max-width: 420px; }
  .ed-sub { font-size: 12px; color: var(--e-text); font-weight: 500; }
  .ed-ends { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--e-text-2); }
  .ed-ends .ed-in { width: 120px; margin-left: 6px; }
  .ed-ops { align-items: center; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
  .stu-wrap { display: grid; grid-template-columns: 390px minmax(0, 1fr); gap: 24px; align-items: start; }
  .phone { width: 375px; height: 720px; border: 1px solid var(--border); border-radius: 24px; background: #f5f6f8; overflow: hidden; display: flex; flex-direction: column; }
  .phone-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; background: #fff; font-size: 12px; color: var(--text-2); border-bottom: 1px solid var(--divider); }
  .phone-body { flex: 1; overflow-y: auto; }
  .stu-pad { padding: 16px; }
  .stu-center { text-align: center; }
  .stu-title { font-size: 16px; font-weight: 500; margin: 8px 0; }
  .stu-note { font-size: 12px; color: var(--text-3); }
  .stu-progress { height: 6px; background: var(--block); border-radius: 3px; margin: 8px 0 16px; position: relative; }
  .stu-progress i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--primary); border-radius: 3px; }
  .stu-obj { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .stu-obj-r { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .stu-pick { display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
  .stu-pick > span { display: flex; flex-direction: column; }
  .stu-full { width: 100%; margin-top: 12px; height: 40px; }
  .stu-head { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; background: #fff; font-size: 12px; color: var(--text-3); }
  .stu-target { background: #fff; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
  .stu-target b { font-size: 16px; font-weight: 500; }
  .stu-anon { font-size: 12px; background: var(--warning-soft); color: #AD6800; padding: 8px 12px; border-radius: 4px; margin-bottom: 12px; }
  .stu-q { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .stu-q p { margin-bottom: 8px; }
  .stu-q .req { color: var(--danger); margin-right: 2px; }
  .stu-scale { display: flex; flex-wrap: wrap; gap: 6px; }
  .stu-chip { min-width: 40px; height: 36px; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; font-size: 14px; }
  .stu-chip.sm { min-width: 28px; height: 32px; font-size: 12px; padding: 0 6px; }
  .stu-chip.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
  .stu-chip:disabled { cursor: default; }
  .stu-opt { display: flex; gap: 8px; align-items: center; min-height: 36px; }
  .stu-mrow { margin-bottom: 8px; }
  .stu-text { width: 100%; min-height: 72px; border: 1px solid var(--border); border-radius: 4px; padding: 8px; font: inherit; }
  .stu-ops { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 12px; }
  .stu-ops .btn { height: 40px; }
  .stu-icon { width: 56px; height: 56px; border-radius: 50%; margin: 48px auto 8px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; }
  .stu-icon.ok { background: var(--success); }
  .stu-icon.warn { background: var(--warning); }
  @media (max-width: 760px) { .stu-wrap { grid-template-columns: 1fr; } .phone { width: 100%; } }
  .stu-search { width: 100%; height: 36px; border: 1px solid var(--border); border-radius: 18px; padding: 0 14px; margin-bottom: 12px; background: #fff; font: inherit; }
  .stu-rank { font-size: 12px; color: #D4380D; margin-top: 4px; }
  .ed-tools { position: absolute; right: 10px; top: 10px; display: none; gap: 2px; background: #fff; border: 1px solid var(--e-border-light); border-radius: 3px; padding: 2px; z-index: 2; }
  .ed-block:hover .ed-tools, .ed-block.sel .ed-tools { display: flex; }
  .ed-tools button { border: none; background: none; height: 24px; padding: 0 8px; font-size: 12px; color: var(--e-text-2); border-radius: 2px; cursor: pointer; }
  .ed-tools button:hover:not(:disabled) { background: var(--e-primary-light); color: var(--e-primary); }
  .ed-tools button.del:hover { background: #fef0f0; color: var(--e-danger); }
  .ed-tools button:disabled { opacity: .35; cursor: not-allowed; }
  .ed-empty { padding: 48px 16px; text-align: center; color: var(--e-text-3); font-size: 13px; border-top: 1px solid var(--e-border-light); }
  .ed-mini a { color: var(--e-primary); cursor: pointer; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }

<script>
/* ---------- 演示数据 ---------- */
const QUESTIONS = [
  { id: 'q1', title: '授课内容贴合工作实际', max: 5, weight: 3 },
  { id: 'q2', title: '讲解清楚、重点突出', max: 5, weight: 2 },

const OPEN_QUESTION = '对讲师还有什么建议？';
const OPEN_ANSWERS = {
  t1: ['案例很贴近我们部门的工作', '希望多留一些练习时间', '讲得很清楚'],
  t2: ['节奏有点快', '可以多分享销售一线的例子'],

// 「讲师池」= 讲师中心的「讲师分类」（多级目录，接口 /app-lecturer/teacherCategory/teacherCategoryList.do）
const POOL_LIST = [{ id: 'p1', name: '培训' }, { id: 'p3', name: '研发技术' }, { id: 'p4', name: '营销管理' }, { id: 'p5', name: '课程开发技能' }, { id: 'p6', name: '课程开发技能 / 课程设计', child: true }];
const poolName = id => (POOL_LIST.find(p => p.id === id) || {}).name || '—';
const TEACHERS = [
  { id: 't1', name: '张明', no: 'JS0012', src: '内部讲师', level: '高级讲师', dept: '研发中心', pool: 'p3' },
  { id: 't2', name: '李华', no: 'JS0035', src: '内部讲师', level: '中级讲师', dept: '销售部', pool: 'p4' },
  { id: 't3', name: '王芳', no: 'JS0041', src: '内部讲师', level: '专家讲师', dept: '人力资源部', pool: 'p1' },
  { id: 't4', name: '陈刚', no: 'JS0058', src: '内部讲师', level: '初级', dept: '研发中心', pool: 'p3' },
  { id: 't6', name: '赵静', no: 'JS0066', src: '内部讲师', level: '预备讲师', dept: '财务部', pool: 'p1' },
  { id: 't7', name: '孙磊', no: 'JS0071', src: '内部讲师', level: '初级', dept: '销售部', pool: 'p4' },
  { id: 't5', name: '刘洋', no: 'WP0003', src: '外部讲师', level: '中级讲师', dept: '外部讲师', pool: 'p5' },
  { id: 't8', name: '周婷', no: 'WP0007', src: '外部讲师', level: '高级讲师', dept: '外部讲师', pool: 'p6' },
];
const OBJECTS = TEACHERS.slice(0, 4); // 结果页使用的演示对象（有答卷）

const EVALUATORS = {
  s1: { name: '周一', dept: '研发中心', rel: '学员' },
  s2: { name: '吴二', dept: '销售部', rel: '学员' },
  s3: { name: '郑三', dept: '销售部', rel: '学员' },
  s4: { name: '孙四', dept: '人力资源部', rel: '学员' },
  m1: { name: '赵敏', dept: '培训中心', rel: '班主任' },
};

// 每份答卷：对象、评测人、关系、各计分题原始分（1-5）
const A = (obj, who, rel, s) => ({ obj, who, rel, s });
const ANSWERS = [
  A('t1','s1','学员',[5,4,4,4,3]), A('t1','s2','学员',[5,5,4,4,4]), A('t1','s3','学员',[4,4,4,4,2]), A('t1','s4','学员',[5,5,5,4,4]),
  A('t1','m1','班主任',[4,4,4,4,4]), A('t1','t1','自评',[5,5,5,5,3]),
  A('t2','s1','学员',[4,4,4,3,4]), A('t2','s2','学员',[4,3,4,4,3]), A('t2','s3','学员',[3,3,4,3,3]), A('t2','s4','学员',[5,4,4,4,4]),
  A('t2','m1','班主任',[4,4,3,4,4]), A('t2','t2','自评',[5,5,5,5,5]),
  A('t3','s1','学员',[5,5,5,5,4]), A('t3','s2','学员',[5,5,4,5,4]), A('t3','s3','学员',[4,5,5,4,4]), A('t3','s4','学员',[5,4,5,5,5]),
  A('t3','m1','班主任',[5,5,4,4,4]),
  A('t4','s1','学员',[3,4,3,3,3]), A('t4','s2','学员',[3,3,3,3,4]), A('t4','s3','学员',[2,3,3,2,3]), A('t4','s4','学员',[4,4,3,4,4]),
  A('t4','m1','班主任',[3,3,3,3,3]), A('t4','t4','自评',[4,4,4,4,4]),
];

/* ---------- 页面状态 ---------- */
const state = {
  page: 'result', step: 'score', tab: 'object',
  qWeightOn: true, qWeights: QUESTIONS.map(q => q.weight),
  relWeightOn: true, objects: [], objSel: [], poolOpen: false, poolSel: [], poolTpl: true,
  poolF: { name: '', src: '', level: '', pool: '' },
  trim: false, weighted: true, relFilter: '', deptFilter: '', anon: false, selQ: null,
};
const REL_NAMES = ['学员', '班主任', '自评'];
// 每个对象在第 2 步各自设置关系权重
function relWeight(objId, rel) { const o = state.objects.find(x => x.id === objId); const r = o && o.rels.find(x => x.name === rel); return r ? Number(r.weight) || 0 : 0; }

/* ---------- 计分（与 PRD 2.2 一致） ---------- */
const FULL = QUESTIONS.reduce((s, q) => s + q.max * q.weight, 0); // 50
const total = a => a.s.reduce((sum, v, i) => sum + v * QUESTIONS[i].weight, 0);
const avg = list => list.length ? list.reduce((a, b) => a + b, 0) / list.length : null;
const r1 = v => v == null ? '—' : (Math.round(v * 10 + 1e-9) / 10).toFixed(1);

function trimmed(totals) {
  if (!state.trim) return totals;
  const t = [...totals].sort((a, b) => a - b);
  if (t.length - 1 >= 1) t.pop();   // 去掉最高分，剩余不足 1 份时不去
  if (t.length - 1 >= 1) t.shift(); // 去掉最低分
  return t;
}
function included() {
  return ANSWERS.filter(a => (!state.relFilter || a.rel === state.relFilter)
    && (!state.deptFilter || objById(a.obj).dept === state.deptFilter));
}
const objById = id => OBJECTS.find(o => o.id === id);
const evalInfo = who => EVALUATORS[who] || { name: objById(who).name, dept: objById(who).dept, rel: '自评' };

function relScore(objId, rel) {
  const totals = included().filter(a => a.obj === objId && a.rel === rel).map(total);
  return totals.length ? avg(trimmed(totals)) : null;
}
function objScore(objId) {
  const useWeight = state.weighted && !state.relFilter;
  if (useWeight) {
    let sum = 0, w = 0; const missing = [];
    REL_NAMES.forEach(rel => {
      const s = relScore(objId, rel);
      const rw = relWeight(objId, rel);
      if (s == null) { if (rw) missing.push(rel); } else { sum += s * rw; w += rw; }
    });
    return { score: w ? sum / w : null, missing };
  }
  const totals = included().filter(a => a.obj === objId).map(total);
  return { score: totals.length ? avg(trimmed(totals)) : null, missing: [] };
}
function projectAvg() { return avg(included().map(total)); }

/* ---------- 渲染 ---------- */
const $ = s => document.querySelector(s);
const main = $('#main');
function go(page) { state.page = page; render(); window.scrollTo(0, 0); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2000); }

function render() {
  document.querySelectorAll('.side a').forEach(a => a.classList.toggle('on', a.dataset.page === state.page));
  main.classList.toggle('editor-mode', state.page === 'create' && state.step === 'score');
  main.innerHTML = ({ list: pageList, create: pageCreate, result: pageResult, legacy: pageLegacy, callers: pageCallers, student: pageStudent })[state.page]();

}

function pageList() {
  const rows = [
    ['2026 Q4 内训师授课评估', '评估型调查', '调查管理', '进行中', '23/24'],
    ['新员工入职培训讲师评价', '评估型调查', '面授管理', '已结束', '96/100'],
    ['门店督导评估', '评估型调查', '远程督导', '进行中', '18/40'],
    ['管培生混合培训评估', '评估型调查', '混合培训', '未开始', '0/32'],
    ['销售训练营阶段评估', '评估型调查', '学习地图', '未开始', '0/45'],
    ['2026 年度培训需求调研', '普通调查', '调查管理', '进行中', '312/800'],
  ];
  return `<h1>调查列表</h1>
  <div class="card">
    <div class="row between" style="margin-bottom:16px">

        <select aria-label="类型"><option>全部类型</option><option>普通调查</option><option>评估型调查</option></select>
        <select aria-label="来源"><option>全部来源</option><option>调查管理</option><option>学习地图</option><option>面授管理</option><option>混合培训</option><option>远程督导</option></select>

      <tbody>${rows.map(r => `<tr><td>${r[0]}</td>
        <td><span class="tag ${r[1] === '评估型调查' ? 'blue' : ''}">${r[1]}</span></td>
        <td>${r[2]}${r[2] !== '调查管理' ? `<div class="note">由${r[2]}创建，请到来源应用修改</div>` : ''}</td><td>${r[3]}</td><td class="num">${r[4]}</td>
        <td>${r[1] === '评估型调查' ? '<button class="btn link" data-go="result">结果分析</button>' : '<span class="muted">统计</span>'}</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="note" style="margin-top:12px">来源不是调查管理的，是在学习地图、面授管理、混合培训、远程督导里点「新建评估」后创建的。这里可以看监控和结果，基本信息、对象和关系要到来源应用修改。</p>
  </div>`;
}

function pageLegacy() {

function pageCreate() {

  const steps = [['score','编辑问卷'],['rel','对象与关系'],['setting','项目设置与发布']];

/* 第 1 步沿用调查管理(新)的「新建问卷」页：左侧题型（点击添加）、中间画布（点题目直接编辑）、右侧题目设置。
   评估型调查只放能设分值的题型：单选、多选、打分、NPS；问答单列为「附加问题」，不计分。
   编辑操作：新增（插在选中题后）、编辑、自动保存、上移、下移、复制、删除（确认）、取消恢复、预览、保存为模版、保存并关闭、离开确认、下一步校验。 */
const PALETTE = [
  ['选择题', ['单选', '多选']],
  ['评分题', ['打分', 'NPS']],
  ['附加问题（不计分）', ['问答']],
];
const SCORABLE = ['单选', '多选', '打分', 'NPS'];
const OPT_TYPES = ['单选', '多选'];
const MATRIX_TYPES = [];   // 矩阵题本期不在评估型调查里提供

function newQuestion(type) {
  const base = { type, title: '请输入题目', desc: '', weight: 1, score: SCORABLE.includes(type), req: true };
  if (OPT_TYPES.includes(type)) return { ...base, opts: [{ t: '选项1', v: 2 }, { t: '选项2', v: 1 }, { t: '选项3', v: 0 }] };
  if (type === '打分') return { ...base, min: 1, max: 5 };
  if (type === 'NPS') return { ...base, title: '你有多大可能向同事推荐这位讲师？' };
  return base;
}

// 编辑器里的问卷：前 4 题打分、第 5 题单选（选项分值 5~1，与结果页演示答卷一致）、第 6 题问答（附加问题）
state.edHead = { title: '内训师授课评价表', desc: '请根据本次课程的实际感受，对每位讲师分别评价。评价结果用于讲师改进和年度评优。' };
state.edQs = [
  ...QUESTIONS.slice(0, 4).map(q => ({ type: '打分', title: q.title, desc: '', min: 1, max: q.max, weight: q.weight, score: true, req: true })),
  { type: '单选', title: QUESTIONS[4].title, desc: '', weight: QUESTIONS[4].weight, score: true, req: true,
    opts: [{ t: '非常合理', v: 5 }, { t: '比较合理', v: 4 }, { t: '一般', v: 3 }, { t: '不太合理', v: 2 }, { t: '很不合理', v: 1 }, { t: '没注意', v: null, ns: true }] },
  { type: '问答', title: OPEN_QUESTION, desc: '', score: false, req: true },
];
state.edDirty = false;

const qW = q => state.qWeightOn ? (Number(q.weight) || 0) : 1;
const isEmpty = v => v === null || v === '' || v === undefined;
const scored = list => list.filter(o => !o.ns && !isEmpty(o.v));
const maxOf = list => scored(list).reduce((m, o) => Math.max(m, Number(o.v)), 0);
function qMax(q) {
  if (q.type === '单选') return maxOf(q.opts);
  if (q.type === '多选') return scored(q.opts).reduce((s, o) => s + Math.max(0, Number(o.v)), 0);
  if (q.type === '打分') return Number(q.max) || 0;
  if (q.type === 'NPS') return 10;
  return 0;
}
const qFull = q => q.score ? qMax(q) * qW(q) : 0;
const fmt = v => Number.isInteger(v) ? String(v) : v.toFixed(1);
function fullScore() { return state.edQs.reduce((s, q) => s + qFull(q), 0); }
function scoredCount() { return state.edQs.filter(q => q.score).length; }
function qError(q) {
  if (!q.title || !q.title.trim() || q.title === '请输入题目') return '请填写题目';
  if (OPT_TYPES.includes(q.type) && q.opts.some(o => !o.t.trim())) return '选项文字不能为空';
  if (!q.score) return '';
  if (OPT_TYPES.includes(q.type) && q.opts.some(o => !o.ns && isEmpty(o.v))) return '请为每个选项填写分值，或设为不计分';
  if (OPT_TYPES.includes(q.type) && !scored(q.opts).length) return '至少 1 个选项计分';
  if (q.type === '打分' && !(Number(q.max) > Number(q.min))) return '最高分需要大于最低分';
  if (state.qWeightOn && !(Number(q.weight) > 0)) return '题目权重需要大于 0';
  return '';
}
function maxRule(q) {
  if (q.type === '单选') return `最高选项分值 ${fmt(qMax(q))}`;
  if (q.type === '多选') return `计分选项分值之和 ${fmt(qMax(q))}`;
  if (q.type === '打分') return `最高分 ${q.max}`;
  if (q.type === 'NPS') return '最高 10 分';
  return '';
}
const touch = () => { state.edDirty = true; };

function stepScore() {
  const sel = state.selQ ?? null;
  const errs = state.edQs.filter(qError).length;
  return `<div class="ed">

    <button class="ed-btn" id="edSaveTpl">保存为模版</button>
    <button class="ed-btn" id="edSaveClose">保存并关闭</button>
    <button class="ed-btn" id="edCancel">取消</button>
    <button class="ed-btn primary" id="edNext">下一步</button>
  </div>
  <div class="ed-body">
    <aside class="ed-pal" aria-label="题型">
      ${PALETTE.map(([g, items]) => `<div class="ed-pal-title">${g}<span>⌃</span></div>
        ${items.map(n => `<button class="ed-pal-item" data-addq="${n}"><i></i>${n}</button>`).join('')}`).join('')}
      <p class="ed-pal-note">评估型调查只提供能设分值的题型。问答作为附加问题，只收集文字，不计分。点击题型添加题目，插在当前选中的题目后面。</p>
    </aside>
    <main class="ed-wrap">
      <div class="ed-sum"><span>计分题 <b>${scoredCount()}</b> 道，满分 <b>${fmt(fullScore())}</b> 分${errs ? `　<span class="ed-err">${errs} 道题未完成</span>` : ''}</span>
        <span>${state.edDirty ? '有未保存的修改' : '已保存'}　${state.qWeightOn ? '已开启题目权重' : '未开启题目权重，每题按 1 倍计'}</span></div>
      <div class="ed-canvas">
        <div class="ed-block ${sel === 'head' ? 'sel' : ''}" ${sel === 'head' ? '' : 'data-selq="head"'}>${sel === 'head' ? headEdit() : `
          <div class="ed-h"><div class="ed-h-title">${state.edHead.title}</div><div class="ed-h-desc">${state.edHead.desc || '<span class="ed-err">（未填写问卷说明）</span>'}</div></div>`}
        </div>
        ${state.edQs.length ? state.edQs.map((q, i) => `<div class="ed-block ${sel === i ? 'sel' : ''}" ${sel === i ? '' : `data-selq="${i}"`}>
          ${qTools(i)}${sel === i ? qEdit(q, i) : qView(q, i)}</div>`).join('')
        : '<div class="ed-empty">还没有题目。从左侧点击题型添加，至少需要 1 道计分题。</div>'}
      </div>
    </main>
    <aside class="ed-props" aria-label="设置">${edProps(sel)}</aside>
  </div>
  ${state.edModal ? edModal() : ''}
  </div>`;
}

function qTools(i) {
  const n = state.edQs.length;
  return `<div class="ed-tools" role="toolbar" aria-label="第${i + 1}题操作">
    <button data-qact="up" data-qi="${i}" ${i === 0 ? 'disabled' : ''}>上移</button>
    <button data-qact="down" data-qi="${i}" ${i === n - 1 ? 'disabled' : ''}>下移</button>
    <button data-qact="copy" data-qi="${i}">复制</button>
    <button data-qact="del" data-qi="${i}" class="del">删除</button></div>`;
}

function headEdit() {
  return `<div class="ed-h ed-editing">
    <input class="ed-in title" value="${state.edHead.title}" data-head="title" aria-label="问卷标题" style="width:100%;text-align:center" />
    <textarea class="ed-in" data-head="desc" aria-label="问卷说明" placeholder="说明本次评估的目的和注意事项" style="width:100%;height:64px;margin-top:8px;padding:6px 8px">${state.edHead.desc}</textarea>
    <div class="ed-ops"><button class="ed-btn primary" id="headDone">完 成</button></div></div>`;
}

function scoreTag(q) {
  if (qError(q)) return '<span class="ed-tag warn">未完成</span>';
  if (!q.score) return '<span class="ed-tag">不计分</span>';
  return `<span class="ed-tag score">计分　${state.qWeightOn ? `权重 ${q.weight}　` : ''}本题满分 ${fmt(qFull(q))}</span>`;
}
const no = i => String(i + 1).padStart(2, '0');
const scoreText = o => o.ns ? '不计分' : (isEmpty(o.v) ? '<span class="ed-err">未填分值</span>' : o.v + ' 分');

function qBodyView(q) {
  if (q.type === '打分') return `<div class="ed-stars">${Array.from({ length: Math.max(0, q.max - q.min + 1) }, (_, k) => `<span>${q.min + k} 分</span>`).join('')}</div>`;
  if (OPT_TYPES.includes(q.type)) return q.opts.map(o => `<div class="ed-opt-view"><i class="${q.type === '多选' ? 'sq' : ''}"></i>${o.t}${q.score ? `<span class="ed-optscore">${scoreText(o)}</span>` : ''}</div>`).join('');
  if (q.type === 'NPS') return `<div class="ed-nps">${Array.from({ length: 11 }, (_, k) => `<span>${k}</span>`).join('')}</div><div class="ed-scale-ends"><span>不可能</span><span>极有可能</span></div>`;
  return '<div class="ed-essay">请输入</div>';
}

function qView(q, i) {
  return `<div class="ed-q">
    <div class="ed-tags"><span class="ed-tag">${q.type}</span>${scoreTag(q)}</div>
    <div class="ed-q-title">${q.req ? '<span class="req">*</span>' : ''}<span class="no">${no(i)}</span><span>${q.title}</span></div>
    ${q.desc ? `<div class="ed-q-desc">${q.desc}</div>` : ''}${qBodyView(q)}</div>`;
}

function optTable(q) {
  const list = q.opts, can = list.length > 2;
  return `${q.score ? '<div class="ed-opt-head"><span></span><span>选项</span><span>分值</span><span>不计分</span><span></span></div>' : ''}
    ${list.map((o, k) => `<div class="ed-opt ${q.score ? '' : 'noscore'}"><i class="${q.type === '多选' ? 'sq' : ''}"></i>
      <input class="ed-in" value="${o.t}" data-ot="${k}" aria-label="选项${k + 1}" />
      ${q.score ? `<input class="ed-in num" type="number" step="0.5" value="${o.ns ? '' : (o.v ?? '')}" ${o.ns ? 'disabled placeholder="—"' : 'placeholder="分值"'} data-ov="${k}" aria-label="选项${k + 1}分值" />
      <input type="checkbox" ${o.ns ? 'checked' : ''} data-ons="${k}" aria-label="选项${k + 1}不计分" />` : ''}
      <button class="ed-x" data-odel="${k}" aria-label="删除选项${k + 1}" ${can ? '' : 'disabled'} title="${can ? '删除选项' : '至少保留 2 个选项'}">×</button></div>`).join('')}`;
}

function qEdit(q, i) {
  let body = '';
  if (OPT_TYPES.includes(q.type)) body = `<div class="ed-opts">${optTable(q)}
      <button class="ed-add" id="eoAdd">+ 添加选项</button>
      ${q.score ? `<p class="ed-tip">${q.type === '多选' ? '多选题得分 = 所选计分选项分值之和；分值可以填负数，作扣分项。' : ''}「不计分」选项被选中时不加分，也不计入本题满分，如「没注意」「不适用」。至少保留 2 个选项。</p>` : ''}</div>`;
  if (q.type === '打分') body = `${qBodyView(q)}<p class="ed-tip">打分范围、题目权重在右侧设置。</p>`;
  if (q.type === 'NPS') body = `${qBodyView(q)}<p class="ed-tip">0–10 分，选几分得几分；本题满分 10 分。</p>`;
  if (q.type === '问答') body = `${qBodyView(q)}<p class="ed-tip">附加问题：只收集文字，不计分，结果页按对象汇总回答。</p>`;
  const e = qError(q);
  return `<div class="ed-q ed-editing">
    <div class="ed-tags"><span class="ed-tag">${q.type}</span>${scoreTag(q)}</div>
    <div class="ed-erow">${q.req ? '<span class="req">*</span>' : ''}<span class="no">${no(i)}</span>
      <div class="ed-fields"><input class="ed-in title" value="${q.title === '请输入题目' ? '' : q.title}" placeholder="请输入题目" data-et="title" aria-label="题目" />
        <input class="ed-in desc" value="${q.desc}" placeholder="请输入题目说明（选填）" data-et="desc" aria-label="题目说明" /></div></div>
    <div class="ed-ebody">${body}</div>
    ${e ? `<p class="ed-err" style="margin:8px 0 0 28px">${e}</p>` : ''}
    <div class="ed-ops"><span class="ed-tip" style="flex:1;margin:0">点击其他题目会自动保存本题</span><button class="ed-btn" id="eqCancel">取 消</button><button class="ed-btn primary" id="eqDone">完 成</button></div>
  </div>`;
}

function edProps(sel) {
  const sw = (id, on, dis) => `<button class="ed-sw ${on ? '' : 'off'}" id="${id}" role="switch" aria-checked="${on}" ${dis ? 'disabled' : ''}></button>`;
  if (sel === null || sel === 'head') {
    return `<h3>问卷设置</h3>
      <div class="ed-row"><span>题目权重</span>${sw('swQWeight', state.qWeightOn)}</div>
      <div class="ed-hint">开启后每道计分题可以单独设权重，本题满分 = 最高分值 × 权重。关闭时每题按 1 倍计算，已填的权重保留，重新开启后恢复。</div>
      <h4>计分汇总</h4>
      <div class="ed-row"><span>计分题</span><b>${scoredCount()} 道</b></div>
      <div class="ed-row"><span>满分</span><b>${fmt(fullScore())} 分</b></div>
      <table class="ed-mini"><thead><tr><th>题</th><th>权重</th><th>满分</th></tr></thead><tbody>
        ${state.edQs.map((q, i) => `<tr><td><a data-goq="${i}">${no(i)} ${q.type}</a></td><td>${q.score ? (state.qWeightOn ? q.weight : 1) : '—'}</td><td>${qError(q) ? '<span class="ed-err">未完成</span>' : (q.score ? fmt(qFull(q)) : '不计分')}</td></tr>`).join('')}
      </tbody></table>`;
  }
  const q = state.edQs[sel], can = SCORABLE.includes(q.type);
  return `<h3>${q.type}</h3>
    <div class="ed-row"><span>本题必答</span>${sw('swReq', q.req)}</div>
    ${q.type === '问答' ? `<div class="ed-row"><span>字数限制</span>${sw('swLen', false)}</div>` : ''}
    <div class="ed-row"><span>逻辑跳转</span><a data-toast="原型中不演示逻辑跳转">设置</a></div>
    ${!can ? '<h4>计分设置</h4><div class="ed-hint">问答题是附加问题，不能计分。</div>' : `
    <h4>计分设置</h4>
    <div class="ed-row"><span>计入得分</span>${sw('swScore', q.score)}</div>
    ${!q.score ? '<div class="ed-hint">关闭后本题不计入得分和满分，选项分值保留，重新开启后恢复。</div>' : `
    ${q.type === '打分' ? `<div class="ed-row"><span>打分范围</span><span class="ed-range">
        <input type="number" value="${q.min}" min="0" data-pr="min" aria-label="最低分" /> 至 <input type="number" value="${q.max}" min="1" data-pr="max" aria-label="最高分" /></span></div>
      <div class="ed-hint" style="margin:-8px 0 16px">每级 1 分；对应评估管理的「打分限制：最少 / 最多」。</div>` : ''}
    ${OPT_TYPES.includes(q.type) ? `<div class="ed-row"><span>选项分值</span><b>${scored(q.opts).length} 个计分</b></div>
      <div class="ed-hint" style="margin:-8px 0 16px">在画布里逐个选项填写分值。</div>` : ''}
    <div class="ed-row"><span>题目权重</span>${state.qWeightOn
      ? `<input type="number" min="0" step="0.5" value="${q.weight}" data-pr="weight" aria-label="题目权重" />`
      : '<span>1 <a id="goQW">开启</a></span>'}</div>
    <div class="ed-row"><span>本题满分</span><b>${qError(q) ? '—' : fmt(qFull(q)) + ' 分'}</b></div>
    <div class="ed-hint">本题满分 = ${maxRule(q)} × 权重 ${state.qWeightOn ? q.weight : 1}。答卷得分 = 本题得分 × 权重。</div>`}`}`;
}

function edModal() {
  const m = state.edModal;
  if (m.kind === 'confirm') return `<div class="mask show" role="dialog" aria-modal="true" aria-labelledby="edmTitle"><div class="modal" style="width:min(420px, calc(100vw - 32px))">
    <h2 id="edmTitle">${m.title}</h2><p class="note" style="font-size:14px;color:var(--text-2)">${m.text}</p>
    <div class="foot"><button class="btn" id="edmCancel">取消</button><button class="btn primary ${m.danger ? 'danger' : ''}" id="edmOk">${m.ok}</button></div></div></div>`;
  if (m.kind === 'tpl') return `<div class="mask show" role="dialog" aria-modal="true" aria-labelledby="edmTitle"><div class="modal" style="width:min(460px, calc(100vw - 32px))">
    <h2 id="edmTitle">保存为模版</h2>
    <div class="field" style="margin-top:12px"><label for="tplName">模版名称</label><input type="text" id="tplName" value="${state.edHead.title}" maxlength="50" /></div>
    <p class="note">保存到「模版库 · 自定义模版」，题目、选项分值和题目权重一起保存，下次新建评估型调查时可直接选用。</p>
    <div class="foot"><button class="btn" id="edmCancel">取消</button><button class="btn primary" id="tplOk">保存</button></div></div></div>`;
  if (m.kind === 'preview') return `<div class="mask show" role="dialog" aria-modal="true" aria-labelledby="edmTitle"><div class="modal" style="width:min(420px, calc(100vw - 32px));max-height:86vh;overflow-y:auto;background:#f5f6f8">
    <div class="row between"><h2 id="edmTitle" style="margin:0">预览：学员作答页</h2><button class="btn link" id="edmCancel" aria-label="关闭">✕</button></div>
    <div class="stu-target" style="margin-top:12px"><span class="stu-note">被评测对象</span><b>（示例）张明</b></div>
    <p class="stu-title">${state.edHead.title}</p><p class="stu-note" style="margin-bottom:8px">${state.edHead.desc}</p>
    ${state.edQs.map((q, i) => stuQ(q, i, false)).join('')}
    <p class="stu-note stu-center">预览不会保存作答</p></div></div>`;
  return '';
}

function bindEditor() {
  const on = (sel, ev, fn) => { const el = main.querySelector(sel); if (el) el.addEventListener(ev, fn); };
  const cur = () => state.edQs[state.selQ];
  const open = v => {   // 切换到另一题时自动保存当前题（只是退出编辑，修改已实时写入）
    state.selQ = v; state.edNew = false;
    state.edSnap = typeof v === 'number' ? JSON.stringify(state.edQs[v]) : (v === 'head' ? JSON.stringify(state.edHead) : null);
    render();
  };
  main.querySelectorAll('[data-selq]').forEach(b => b.onclick = e => {
    if (e.target.closest('.ed-tools')) return;
    const v = b.dataset.selq; open(v === 'head' ? 'head' : Number(v));
  });
  main.querySelectorAll('[data-goq]').forEach(a => a.onclick = () => { open(Number(a.dataset.goq)); main.querySelector('.ed-block.sel')?.scrollIntoView({ block: 'center' }); });
  // 新增：插在选中题目后面；没有选中则放到最后
  main.querySelectorAll('[data-addq]').forEach(b => b.onclick = () => {
    const at = typeof state.selQ === 'number' ? state.selQ + 1 : state.edQs.length;
    state.edQs.splice(at, 0, newQuestion(b.dataset.addq)); touch();
    state.selQ = at; state.edSnap = null; state.edNew = true; render();
    main.querySelector('.ed-block.sel')?.scrollIntoView({ block: 'center' });
  });
  // 题目工具条
  main.querySelectorAll('[data-qact]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const i = Number(b.dataset.qi), act = b.dataset.qact, qs = state.edQs;
    if (act === 'up' && i > 0) { [qs[i - 1], qs[i]] = [qs[i], qs[i - 1]]; state.selQ = state.selQ === i ? i - 1 : state.selQ; touch(); render(); }
    if (act === 'down' && i < qs.length - 1) { [qs[i + 1], qs[i]] = [qs[i], qs[i + 1]]; state.selQ = state.selQ === i ? i + 1 : state.selQ; touch(); render(); }
    if (act === 'copy') { qs.splice(i + 1, 0, JSON.parse(JSON.stringify(qs[i]))); state.selQ = i + 1; state.edSnap = JSON.stringify(qs[i + 1]); touch(); render(); toast('已复制题目，插在原题后面'); }
    if (act === 'del') { state.edModal = { kind: 'confirm', title: '删除题目', text: `确定删除第 ${i + 1} 题「${qs[i].title}」吗？删除后不能恢复，本题的分值和权重也会一起删除。`, ok: '删除', danger: true, act: 'del', i }; render(); }
  });
  // 问卷标题和说明
  main.querySelectorAll('[data-head]').forEach(i => i.onchange = () => { state.edHead[i.dataset.head] = i.value; touch(); });
  on('#headDone', 'click', () => { if (!state.edHead.title.trim()) { toast('请填写问卷标题'); return; } state.selQ = null; render(); });
  // 右侧设置
  on('#swQWeight', 'click', () => { state.qWeightOn = !state.qWeightOn; touch(); render(); });
  on('#goQW', 'click', () => { state.selQ = null; render(); });
  on('#swScore', 'click', () => { cur().score = !cur().score; touch(); render(); });
  on('#swReq', 'click', () => { cur().req = !cur().req; touch(); render(); });
  on('#swLen', 'click', e => e.currentTarget.classList.toggle('off'));
  main.querySelectorAll('[data-pr]').forEach(i => i.onchange = () => { cur()[i.dataset.pr] = Number(i.value); touch(); render(); });
  // 题目内容与选项
  main.querySelectorAll('[data-et]').forEach(i => i.onchange = () => { cur()[i.dataset.et] = i.value; touch(); render(); });
  main.querySelectorAll('[data-ot]').forEach(i => i.onchange = () => { cur().opts[i.dataset.ot].t = i.value; touch(); render(); });
  main.querySelectorAll('[data-ov]').forEach(i => i.onchange = () => { cur().opts[i.dataset.ov].v = i.value === '' ? null : Number(i.value); touch(); render(); });
  main.querySelectorAll('[data-ons]').forEach(c => c.onchange = () => { const o = cur().opts[c.dataset.ons]; o.ns = c.checked; if (o.ns) o.v = null; touch(); render(); });
  main.querySelectorAll('[data-odel]').forEach(b => b.onclick = () => { cur().opts.splice(b.dataset.odel, 1); touch(); render(); });
  on('#eoAdd', 'click', () => { cur().opts.push({ t: '选项' + (cur().opts.length + 1), v: null }); touch(); render(); });
  // 取消：新加的题直接移除；已有的题恢复进入编辑前的内容
  on('#eqCancel', 'click', () => {
    if (state.edNew) state.edQs.splice(state.selQ, 1);
    else if (state.edSnap) state.edQs[state.selQ] = JSON.parse(state.edSnap);
    state.edNew = false; state.selQ = null; render();
  });
  on('#eqDone', 'click', () => { const e = qError(cur()); if (e) { toast(e); return; } state.edNew = false; state.selQ = null; render(); });
  // 顶部按钮
  on('#edPreview', 'click', () => { state.stu.cur = 'preview'; state.edModal = { kind: 'preview' }; render(); });
  on('#edSaveTpl', 'click', () => {
    const bad = state.edQs.findIndex(qError);
    if (bad >= 0) { toast(`第 ${bad + 1} 题：${qError(state.edQs[bad])}，完成后才能保存为模版`); state.selQ = bad; render(); return; }
    state.edModal = { kind: 'tpl' }; render();
  });
  on('#edSaveClose', 'click', () => {
    const n = state.edQs.filter(qError).length;
    state.edDirty = false; state.selQ = null; go('list');
    toast(n ? `已保存草稿，还有 ${n} 道题未完成，可在调查列表继续编辑` : '已保存草稿，可在调查列表继续编辑');
  });
  on('#edCancel', 'click', () => {
    if (!state.edDirty) { state.selQ = null; go('list'); return; }
    state.edModal = { kind: 'confirm', title: '放弃本次编辑？', text: '有未保存的修改，离开后这些修改会丢失。需要保留请点「保存并关闭」。', ok: '放弃并离开', danger: true, act: 'leave' }; render();
  });
  on('#edNext', 'click', () => {
    if (!scoredCount()) { toast('至少需要 1 道计分题'); return; }
    const bad = state.edQs.findIndex(qError);
    if (bad >= 0) { toast(`第 ${bad + 1} 题：${qError(state.edQs[bad])}`); state.selQ = bad; render(); main.querySelector('.ed-block.sel')?.scrollIntoView({ block: 'center' }); return; }
    state.edDirty = false; state.selQ = null; state.step = 'rel'; render();
  });
  // 弹窗
  on('#edmCancel', 'click', () => { state.edModal = null; render(); });
  on('#edmOk', 'click', () => {
    const m = state.edModal; state.edModal = null;
    if (m.act === 'del') { state.edQs.splice(m.i, 1); state.selQ = null; touch(); render(); toast('已删除题目'); }
    if (m.act === 'leave') { state.edDirty = false; state.selQ = null; go('list'); }
  });
  on('#tplOk', 'click', () => {
    const name = main.querySelector('#tplName').value.trim();
    if (!name) { toast('请填写模版名称'); return; }
    state.edModal = null; render(); toast(`已保存为模版「${name}」`);
  });
}

/* 第 2 步：一张表配齐「被评对象 × 评测关系 × 评测人 × 权重」。从讲师库按讲师分类批量选，支持自定义对象和关系。 */
// 关系模板为租户级，所有管理员共用，在「管理模板」里维护
state.tpls = [
  { id: 'tp1', name: '讲师评估', def: true, rels: [{ name: '学员', who: '面授学员', count: 4, weight: 60 }, { name: '班主任', who: '指定人员（赵敏）', count: 1, weight: 30 }, { name: '自评', who: '对象本人', count: 1, weight: 10 }] },
  { id: 'tp2', name: '学员评讲师', rels: [{ name: '学员', who: '面授学员', count: 4, weight: 100 }] },
  { id: 'tp3', name: '上级、同事、自评', rels: [{ name: '上级', who: '对象的直属上级', count: 1, weight: 50 }, { name: '同事', who: '', count: 0, weight: 30 }, { name: '自评', who: '对象本人', count: 1, weight: 20 }] },
];
state.tplId = 'tp1';
const curTpl = () => state.tpls.find(t => t.id === state.tplId) || state.tpls[0];
const tplText = t => t.rels.map(r => `${r.name} ${r.weight}%`).join('、');
const REL_TEMPLATE = curTpl().rels;
const REL_SUGGEST = ['学员', '班主任', '自评', '上级', '同事', '下级'];
const cloneTpl = () => curTpl().rels.map(r => ({ ...r }));
const objFromTeacher = t => ({ id: t.id, name: t.name, kind: '讲师库', no: t.no, level: t.level, dept: t.dept, pool: poolName(t.pool), rels: cloneTpl() });
const objSum = o => o.rels.reduce((s, r) => s + (Number(r.weight) || 0), 0);
const objErrors = () => state.objects.filter(o => state.relWeightOn && objSum(o) !== 100);

function stepRel() {
  const nRel = state.objects.reduce((s, o) => s + o.rels.length, 0);
  const errs = objErrors();
  const sel = state.objSel;
  return `<div class="card">
    <div class="row between" style="margin-bottom:12px">
      <div><h2 style="margin:0">评估对象与评测关系</h2><p class="note">普通调查在这一步选参与学员；评估型调查在这一步配置被评对象、评测人和权重。</p></div>
      <div class="row">
        <button class="btn primary" id="openPool">从讲师库选择</button>
        <button class="btn" id="openPeople">从人员选择</button>
        <button class="btn" id="addCustom">添加自定义对象</button>
        <button class="btn" id="openImport">批量导入</button>
      </div>
    </div>

function objRows(o, oi) {
  const n = o.rels.length + 1, sum = objSum(o), on = state.objSel.includes(oi);
  const meta = o.kind === '讲师库' ? `${o.level}　${o.no}　${o.pool}` : (o.kind === '自定义' ? '自定义对象' : o.dept);
  const head = `<td rowspan="${n}" class="objcell"><input type="checkbox" data-osel="${oi}" ${on ? 'checked' : ''} aria-label="选择${o.name}" /></td>
    <td rowspan="${n}" class="objcell">
      ${o.kind === '自定义' ? `<input type="text" value="${o.name}" data-oname="${oi}" aria-label="对象名称" style="width:140px" />` : `<b>${o.name}</b>`}
      <div class="note"><span class="tag ${o.kind === '讲师库' ? 'blue' : ''}">${o.kind}</span> ${meta}</div>
      ${state.relWeightOn ? `<div class="note ${sum === 100 ? 'ok' : 'err'}">权重合计 ${sum}%</div>` : ''}
      <button class="btn link" data-toast="原型中不演示添加介绍">添加介绍</button></td>`;
  const relRow = (r, ri) => `<tr>${ri === 0 ? head : ''}
      <td><input type="text" list="relNames" value="${r.name}" data-rname="${oi}.${ri}" placeholder="如：学员" aria-label="评测关系" style="width:96px" /></td>
      <td>${r.count ? `${r.who}${r.who === '面授学员' ? `（${r.count} 人）` : ''}` : '<span class="err">未选择</span>'} <button class="btn link" data-pickwho="${oi}.${ri}">选择</button></td>
      ${state.relWeightOn ? `<td><input type="number" min="0" max="100" value="${r.weight}" data-rweight="${oi}.${ri}" aria-label="权重" /> %</td>` : ''}
      <td><button class="btn link" data-delrel="${oi}.${ri}">删除</button></td></tr>`;
  const rows = o.rels.length ? o.rels.map(relRow).join('') : `<tr>${head}<td colspan="${state.relWeightOn ? 4 : 3}" class="err">还没有评测关系</td></tr>`;
  return rows + `<tr class="addrow"><td colspan="${state.relWeightOn ? 4 : 3}"><button class="btn link" data-addrel="${oi}">+ 添加关系</button></td></tr>`;
}

// 关系模板管理：列表（使用、设为默认、编辑、删除）+ 新建 / 编辑表单（名称、关系、评测人来源、权重，合计 100%）
const WHO_SOURCES = [
  { v: '面授学员', count: 4, note: '关联面授项目的学员' },
  { v: '指定人员', count: 0, note: '新建调查时再选人' },
  { v: '对象本人', count: 1, note: '自评' },
  { v: '对象的直属上级', count: 1, note: '从组织架构取' },
];
function tplErrors(f) {
  const errs = [];
  if (!f.name.trim()) errs.push('请填写模板名称');
  else if (state.tpls.some(t => t.name === f.name.trim() && t.id !== f.id)) errs.push(`已有同名模板「${f.name.trim()}」`);
  if (!f.rels.length) errs.push('至少添加 1 种评测关系');
  if (f.rels.some(r => !r.name.trim())) errs.push('关系名称不能为空');
  const names = f.rels.map(r => r.name.trim()).filter(Boolean);
  if (new Set(names).size !== names.length) errs.push('关系名称不能重复');
  const sum = f.rels.reduce((s, r) => s + (Number(r.weight) || 0), 0);
  if (sum !== 100) errs.push(`权重合计为 ${sum}%，需要等于 100%`);
  return errs;
}

function tplForm() {
  const f = state.tplEdit, sum = f.rels.reduce((s, r) => s + (Number(r.weight) || 0), 0), errs = tplErrors(f);
  return `<div class="row between"><h2 id="tplTitle" style="margin:0">${f.id ? '编辑模板' : '新建模板'}</h2><button class="btn link" id="tfBack">‹ 返回模板列表</button></div>
    <div class="field" style="margin-top:16px"><label for="tfName">模板名称</label><input type="text" id="tfName" value="${f.name}" maxlength="30" placeholder="如：讲师评估" /></div>
    <div class="tbl-wrap"><table class="tpl-table"><thead><tr><th>评测关系</th><th>评测人来源</th><th>权重</th><th></th></tr></thead>
      <tbody>${f.rels.map((r, i) => `<tr>
        <td><input type="text" list="relNames" value="${r.name}" data-tfn="${i}" placeholder="如：学员" aria-label="评测关系" style="width:110px" /></td>
        <td><select data-tfw="${i}" aria-label="评测人来源">${WHO_SOURCES.map(w => `<option ${r.src === w.v ? 'selected' : ''}>${w.v}</option>`).join('')}</select>
          <div class="note">${(WHO_SOURCES.find(w => w.v === r.src) || {}).note || ''}</div></td>
        <td class="nowrap"><input type="number" min="0" max="100" value="${r.weight}" data-tfp="${i}" aria-label="权重" /> %</td>
        <td><button class="btn link" data-tfdel="${i}" ${f.rels.length > 1 ? '' : 'disabled'}>删除</button></td></tr>`).join('')}</tbody></table></div>
    <datalist id="relNames">${REL_SUGGEST.map(n => `<option value="${n}"></option>`).join('')}</datalist>
    <div class="row between" style="margin-top:8px"><button class="btn link" id="tfAdd">+ 添加关系</button>
      <span class="${sum === 100 ? 'ok' : 'err'}">权重合计 ${sum}%</span></div>
    <label class="switch" style="margin-top:12px"><input type="checkbox" id="tfDef" ${f.def ? 'checked' : ''} /> 设为默认模板（新建评估型调查时自动带出）</label>
    ${errs.length ? `<ul class="err" style="margin:12px 0 0 18px;font-size:13px">${errs.map(e => `<li>${e}</li>`).join('')}</ul>` : ''}
    <p class="note" style="margin-top:12px">修改模板不影响已经用过它的调查；已应用到对象表的关系，需要重新「应用模板」才会更新。</p>
    <div class="foot"><button class="btn" id="tfCancel">取消</button><button class="btn primary" id="tfSave" ${errs.length ? 'disabled' : ''}>保存模板</button></div>`;
}

function tplDialog() {
  const body = state.tplEdit ? tplForm() : `
    <div class="row between"><h2 id="tplTitle" style="margin:0">关系模板</h2><button class="btn link" id="tplClose" aria-label="关闭">✕</button></div>

      <span class="row" style="flex-wrap:nowrap"><button class="btn" id="tdNo">取消</button><button class="btn primary danger" id="tdYes">删除</button></span></div>` : ''}
    <div class="row between" style="margin-top:16px"><button class="btn" id="tplNew">新建模板</button><span class="note">默认模板不能删除，先把别的模板设为默认</span></div>`;
  return `<div class="mask show" role="dialog" aria-modal="true" aria-labelledby="tplTitle">
  <div class="modal" style="width:min(820px, calc(100vw - 32px));max-height:88vh;overflow-y:auto">${body}</div></div>`;
}

function bindTpl() {
  const on = (sel, ev, fn) => { const el = main.querySelector(sel); if (el) el.addEventListener(ev, fn); };
  const srcOf = r => (WHO_SOURCES.find(w => w.v === r.who) ? r.who : (r.who === '' || r.count === 0 ? '指定人员' : (/^赵|指定/.test(r.who) ? '指定人员' : '面授学员')));
  on('#tplNew', 'click', () => { state.tplEdit = { id: null, name: '', def: false, rels: [{ name: '学员', src: '面授学员', weight: 100 }] }; state.tplDelId = null; render(); });
  main.querySelectorAll('[data-tpledit]').forEach(b => b.onclick = () => {
    const t = state.tpls.find(x => x.id === b.dataset.tpledit);
    state.tplEdit = { id: t.id, name: t.name, def: !!t.def, rels: t.rels.map(r => ({ name: r.name, src: srcOf(r), weight: r.weight })) }; state.tplDelId = null; render();
  });
  main.querySelectorAll('[data-tpldel]').forEach(b => b.onclick = () => { state.tplDelId = b.dataset.tpldel; render(); });
  on('#tdNo', 'click', () => { state.tplDelId = null; render(); });
  on('#tdYes', 'click', () => {
    const t = state.tpls.find(x => x.id === state.tplDelId);
    state.tpls = state.tpls.filter(x => x.id !== state.tplDelId);
    if (state.tplId === t.id) state.tplId = state.tpls.find(x => x.def).id;
    state.tplDelId = null; render(); toast(`已删除模板「${t.name}」`);
  });
  const f = state.tplEdit;
  if (!f) return;
  on('#tfName', 'change', e => { f.name = e.target.value; render(); });
  main.querySelectorAll('[data-tfn]').forEach(i => i.onchange = () => { f.rels[i.dataset.tfn].name = i.value; render(); });
  main.querySelectorAll('[data-tfw]').forEach(s => s.onchange = () => { f.rels[s.dataset.tfw].src = s.value; render(); });
  main.querySelectorAll('[data-tfp]').forEach(i => i.onchange = () => { f.rels[i.dataset.tfp].weight = Number(i.value) || 0; render(); });
  main.querySelectorAll('[data-tfdel]').forEach(b => b.onclick = () => { f.rels.splice(b.dataset.tfdel, 1); render(); });
  on('#tfAdd', 'click', () => { f.rels.push({ name: '', src: '指定人员', weight: 0 }); render(); });
  on('#tfDef', 'change', e => { f.def = e.target.checked; });
  const back = () => { state.tplEdit = null; render(); };
  on('#tfBack', 'click', back); on('#tfCancel', 'click', back);
  on('#tfSave', 'click', () => {
    if (tplErrors(f).length) return;
    const rels = f.rels.map(r => { const w = WHO_SOURCES.find(x => x.v === r.src); return { name: r.name.trim(), who: r.src === '指定人员' ? '' : r.src, count: w.count, weight: Number(r.weight) }; });
    let t = state.tpls.find(x => x.id === f.id);
    if (t) Object.assign(t, { name: f.name.trim(), rels });
    else { t = { id: 'tp' + Date.now(), name: f.name.trim(), rels }; state.tpls.push(t); }
    if (f.def) state.tpls.forEach(x => { x.def = x.id === t.id; });
    const isNew = !f.id; state.tplEdit = null; render(); toast(isNew ? `已新建模板「${t.name}」` : `已保存模板「${t.name}」`);
  });
}

function bindRel() {
  const on = (sel, ev, fn) => { const el = main.querySelector(sel); if (el) el.addEventListener(ev, fn); };
  const at = s => s.split('.').map(Number);
  on('#openPool', 'click', () => { state.poolOpen = true; state.poolSel = []; render(); });
  on('#addCustom', 'click', () => {
    state.customN = (state.customN || 0) + 1;
    state.objects.push({ id: 'c' + state.customN, name: '自定义对象 ' + state.customN, kind: '自定义', rels: cloneTpl() }); render();
  });
  on('#relWeightOn', 'change', e => { state.relWeightOn = e.target.checked; render(); });
  on('#selAll', 'change', e => { state.objSel = e.target.checked ? state.objects.map((_, i) => i) : []; render(); });
  main.querySelectorAll('[data-osel]').forEach(c => c.onchange = () => {
    const i = Number(c.dataset.osel); state.objSel = c.checked ? [...state.objSel, i] : state.objSel.filter(x => x !== i); render();
  });
  on('#applyTpl', 'click', () => { state.objSel.forEach(i => { state.objects[i].rels = cloneTpl(); }); toast(`已为 ${state.objSel.length} 个对象应用关系模板`); state.objSel = []; render(); });
  on('#removeSel', 'click', () => { state.objects = state.objects.filter((_, i) => !state.objSel.includes(i)); state.objSel = []; render(); });
  main.querySelectorAll('[data-oname]').forEach(i => i.onchange = () => { state.objects[i.dataset.oname].name = i.value || '未命名对象'; });
  main.querySelectorAll('[data-rname]').forEach(i => i.onchange = () => { const [o, r] = at(i.dataset.rname); state.objects[o].rels[r].name = i.value.trim(); render(); });
  main.querySelectorAll('[data-rweight]').forEach(i => i.onchange = () => { const [o, r] = at(i.dataset.rweight); state.objects[o].rels[r].weight = Number(i.value) || 0; render(); });
  main.querySelectorAll('[data-delrel]').forEach(b => b.onclick = () => { const [o, r] = at(b.dataset.delrel); state.objects[o].rels.splice(r, 1); render(); });
  main.querySelectorAll('[data-addrel]').forEach(b => b.onclick = () => { state.objects[b.dataset.addrel].rels.push({ name: '', who: '', count: 0, weight: 0 }); render(); });
  main.querySelectorAll('[data-pickwho]').forEach(b => b.onclick = () => {
    const [o, r] = at(b.dataset.pickwho), rel = state.objects[o].rels[r];
    if (!rel.count) { rel.who = '指定人员（2 人）'; rel.count = 2; render(); toast('原型中直接填入 2 名指定人员'); }
    else toast('选择评测人：指定人员、面授学员、对象本人、对象的直属上级');
  });
  on('#tplSel', 'change', e => { state.tplId = e.target.value; render(); });
  on('#openTpl', 'click', () => { state.tplOpen = true; render(); });
  on('#tplClose', 'click', () => { state.tplOpen = false; state.tplEdit = null; state.tplDelId = null; render(); });
  if (state.tplOpen) bindTpl();
  main.querySelectorAll('[data-tpldef]').forEach(b => b.onclick = () => { state.tpls.forEach(t => { t.def = t.id === b.dataset.tpldef; }); render(); toast('已设为默认模板，新建评估时自动带出'); });
  main.querySelectorAll('[data-tpluse]').forEach(b => b.onclick = () => { state.tplId = b.dataset.tpluse; state.tplOpen = false; render(); });
  on('#openImport', 'click', () => { state.importOpen = true; render(); });
  on('#importClose', 'click', () => { state.importOpen = false; render(); });
  on('#importCancel', 'click', () => { state.importOpen = false; render(); });
  on('#importOk', 'click', () => { state.importOpen = false; render(); toast('原型中不演示上传；导入后对象和关系追加到表格，错误行可下载错误列表'); });
  on('#openPeople', 'click', () => { state.peopleOpen = true; state.peopleSel = []; render(); });
  const pplClose = () => { state.peopleOpen = false; render(); };
  on('#pplClose', 'click', pplClose); on('#pplCancel', 'click', pplClose);
  on('#pplName', 'change', e => { state.peopleF = { ...(state.peopleF || { dept: '' }), name: e.target.value.trim() }; render(); });
  on('#pplDept', 'change', e => { state.peopleF = { ...(state.peopleF || { name: '' }), dept: e.target.value }; render(); });
  main.querySelectorAll('[data-ppl]').forEach(c => c.onchange = () => { const id = c.dataset.ppl, cur = state.peopleSel || []; state.peopleSel = c.checked ? [...cur, id] : cur.filter(x => x !== id); render(); });
  on('#pplOk', 'click', () => {
    const add = PEOPLE.filter(u => (state.peopleSel || []).includes(u.id)).map(u => ({ id: u.id, name: u.name, kind: '人员', dept: `${u.dept}　工号 ${u.code}`, rels: cloneTpl() }));
    state.objects.push(...add); state.peopleOpen = false; state.peopleSel = []; render(); toast(`已添加 ${add.length} 名人员`);
  });
  // 讲师库弹窗
  const close = () => { state.poolOpen = false; render(); };
  on('#poolClose', 'click', close); on('#poolCancel', 'click', close);
  on('#pfName', 'change', e => { state.poolF.name = e.target.value.trim(); render(); });
  on('#pfSrc', 'change', e => { state.poolF.src = e.target.value; render(); });
  on('#pfLevel', 'change', e => { state.poolF.level = e.target.value; render(); });
  on('#pfPool', 'change', e => { state.poolF.pool = e.target.value; render(); });
  on('#pfTpl', 'change', e => { state.poolTpl = e.target.checked; });
  on('#pfAll', 'change', e => { const ids = [...main.querySelectorAll('[data-pick]')].map(c => c.dataset.pick); state.poolSel = e.target.checked ? [...new Set([...state.poolSel, ...ids])] : state.poolSel.filter(id => !ids.includes(id)); render(); });
  main.querySelectorAll('[data-pick]').forEach(c => c.onchange = () => { const id = c.dataset.pick; state.poolSel = c.checked ? [...state.poolSel, id] : state.poolSel.filter(x => x !== id); render(); });
  on('#poolOk', 'click', () => {
    const add = TEACHERS.filter(t => state.poolSel.includes(t.id)).map(t => { const o = objFromTeacher(t); if (!state.poolTpl) o.rels = []; return o; });
    state.objects.push(...add); state.poolOpen = false; state.poolSel = [];
    render(); toast(`已添加 ${add.length} 位讲师${state.poolTpl ? '，并按模板生成评测关系' : ''}`);
  });
}

const visibleObjects = () => OBJECTS.filter(o => !state.deptFilter || o.dept === state.deptFilter);

function tabObject() {
  const pAvg = projectAvg();
  const rows = visibleObjects().map(o => ({ o, ...objScore(o.id), n: included().filter(a => a.obj === o.id).length }))
    .sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
  return `<table><thead><tr><th>排名</th><th>对象</th><th class="num">${state.weighted && !state.relFilter ? '加权得分' : '得分'}</th><th class="num">得分率</th><th></th><th class="num">对比平均分</th><th class="num">有效份数</th><th>各关系完成</th></tr></thead>
  <tbody>${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${r.o.name}</td><td class="num">${r1(r.score)}</td><td class="num">${r1(r.score / FULL * 100)}</td>
    <td><div class="bar"><i style="width:${r.score / FULL * 100}%"></i></div></td>
    <td class="num">${pAvg ? r1(r.score / pAvg * 100) + '%' : '—'}</td><td class="num">${r.n}</td>
    <td>${REL_NAMES.filter(rel => !state.relFilter || rel === state.relFilter).map(rel => {
      const n = included().filter(a => a.obj === r.o.id && a.rel === rel).length;
      return n ? `<span class="tag">${rel} ${n}</span>` : `<span class="tag orange">缺少${rel}</span>`;
    }).join(' ')}</td></tr>`).join('')}</tbody></table>
  <p class="note" style="margin-top:12px">项目平均分 ${r1(pAvg)}（全部有效答卷总分的平均）。${state.weighted && !state.relFilter ? '某关系没有有效答卷时，其余关系按权重重新折算。' : ''}</p>`;
}

function tabRel() {
  const rels = REL_NAMES.filter(rel => !state.relFilter || rel === state.relFilter);
  return `<table><thead><tr><th>对象</th>${rels.map(r => `<th class="num">${r}平均分</th>`).join('')}<th class="num">自评 − 学员</th><th class="num">班主任 − 学员</th></tr></thead>
  <tbody>${visibleObjects().map(o => {

    return `<tr><td>${o.name}</td>${rels.map(r => `<td class="num">${r1(s[r])}</td>`).join('')}<td class="num">${diff('自评', '学员')}</td><td class="num">${diff('班主任', '学员')}</td></tr>`;

}

function tabQuestion() {
  const objs = visibleObjects();
  return `<table><thead><tr><th>题目</th><th class="num">权重</th><th class="num">平均得分率</th><th></th>${objs.map(o => `<th class="num">${o.name}</th>`).join('')}<th>本题第一</th></tr></thead>
  <tbody>${QUESTIONS.map((q, qi) => {

    return `<tr><td>${q.title}</td><td class="num">${q.weight}</td><td class="num">${r1(all / q.max * 100)}%</td><td><div class="bar"><i style="width:${all / q.max * 100}%"></i></div></td>

function tabEvaluator() {
  const list = included();
  const pAvg = projectAvg();
  const groups = {};
  list.forEach(a => { (groups[a.who] = groups[a.who] || []).push(total(a)); });
  const rows = Object.entries(groups).map(([who, ts]) => ({ who, info: evalInfo(who), n: ts.length, m: avg(ts) }))
    .sort((a, b) => a.m - b.m);
  if (state.anon) rows.forEach((r, i) => { r.info = { name: `评测人 ${i + 1}`, dept: '—', rel: r.info.rel }; });
  return `<table><thead><tr><th>评测人</th><th>关系</th><th>部门</th><th class="num">已评</th><th class="num">平均给分</th><th class="num">与平均偏差</th><th>提示</th></tr></thead>
  <tbody>${rows.map(r => { const dev = (r.m - pAvg) / pAvg * 100; const flag = Math.abs(dev) > 15;

  <p class="note" style="margin-top:12px">偏差 =（评测人平均给分 − 全体平均 ${r1(pAvg)}）÷ 全体平均；超过 ±15% 标出。未提交的答卷不计入。${state.anon ? '匿名模式：不显示评测人姓名和部门。' : ''}</p>`;
}
