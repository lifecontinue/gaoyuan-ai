<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>样式 2 · 扁行</title>
<link rel="stylesheet" href="shell.css" />
<style>
  /* ===== 只改这一段 =====
     同一内容更扁：标题直接落在页面上，卡片只有三行紧排，选中只加蓝框、不铺底。 */
  :root {
    --page: #f8f8f8;
    --card: #fff;
    --line: #e5e5e5;
    --text: #1f1f1f;
    --muted: #595959;
    --meta: #8c8c8c;
    --blue: #0152d9;
    --radius: 8px;
    --gap: 8px;
    --card-pad: 10px 12px;
  }
  body { background: var(--page); }
  .banner { margin: 0 0 8px; color: var(--meta); font-size: 12px; line-height: 20px; }
  .back { border: 0; background: none; color: var(--blue); padding: 0 0 8px; cursor: pointer; }
  .hero { padding: 4px 0 8px; }
  .hero h2 { margin: 0 0 4px; font-size: 20px; line-height: 28px; font-weight: 500; }
  .hero p { margin: 0; color: var(--muted); font-size: 14px; line-height: 22px; }
  .steps { display: flex; gap: 16px; margin-top: 8px; color: var(--meta); font-size: 12px; line-height: 20px; }
  .steps b { color: var(--blue); font-weight: 500; }
  .steps .on { color: var(--text); }
  .chips { display: flex; gap: 20px; margin: 8px 0 10px; border-bottom: 1px solid var(--line); }
  .chips button { height: 36px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); cursor: pointer; }
  .chips button.on { color: var(--blue); border-bottom-color: var(--blue); font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--gap); }
  .group { grid-column: 1 / -1; margin: 10px 0 0; font-size: 12px; line-height: 20px; font-weight: 500; color: var(--muted); }
  .card { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--card-pad); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .card b { font-size: 14px; line-height: 22px; font-weight: 500; }
  .card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 20px; }
  .card .meta { color: var(--meta); font-size: 12px; line-height: 20px; }
  .card:hover { border-color: #b9d0f7; }
  .card.on { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
  .card.blank { border-style: dashed; }
  .dock { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 12px; padding: 10px 0 0; border-top: 1px solid var(--line); background: transparent; }
  .dock strong { font-size: 14px; font-weight: 500; }
  .dock p { margin: 2px 0 0; color: var(--meta); font-size: 12px; line-height: 20px; }
  .go { height: 32px; padding: 0 16px; border: 0; border-radius: 4px; background: var(--blue); color: #fff; cursor: pointer; }
  .go:hover { background: #2a6bdd; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="应用导航">
    <div class="brand">21</div>
    <button class="nav" type="button">首页</button>
    <button class="nav" type="button">组织结构</button>
    <button class="nav" type="button">资源管理</button>
    <button class="nav" type="button">线上培训</button>
    <button class="nav on" type="button">评估调研</button>
    <button class="nav" type="button">考试管理</button>
    <button class="nav" type="button">报表管理</button>
    <button class="nav" type="button">平台设置</button>
  </nav>
  <div class="shell">
    <header class="top">
      <button class="tab" type="button">评估管理</button>
      <button class="tab on" type="button">调查管理(新)</button>
      <span class="spacer"></span>
      <span class="search">搜索应用</span>
      <span class="who">切换学员</span>
      <span class="who"><span class="avatar">高</span>高源</span>
    </header>
    <main><div id="stage"></div></main>
  </div>
</div>
<script src="scene.js"></script>
</body>
</html>
