<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>评估调查</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --primary: #0152D9; --primary-hover: #2A6BDD; --primary-soft: #EEF4FF;
    --text-1: #1F1F1F; --text-2: #595959; --text-3: #8C8C8C;
    --border: #D9D9D9; --divider: #E5E5E5; --page: #F8F8F8; --card: #FFFFFF; --block: #F5F5F5;
    --danger: #FF4D4F; --danger-soft: #FFF1F0; --success: #52C41A; --success-soft: #F6FFED;
    --warning: #FAAD14; --warning-soft: #FFFBE6; --primary-active: #003EAA; --border-strong: #B9D0F7; --text-disabled: #BFBFBF;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang-SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; font-size: 14px; line-height: 22px; color: var(--text-1); background: var(--page); }
  button, input, select { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 64px 1fr; min-height: 100vh; }
  .shell { min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 40px; flex: none; display: flex; align-items: center; gap: 24px; padding: 0 24px 0 16px; background: #fff; border-bottom: 1px solid var(--divider); position: sticky; top: 0; z-index: 30; }
  .apptabs { display: flex; align-items: stretch; height: 40px; gap: 4px; align-self: flex-end; }
  .apptabs button { border: none; background: none; font: inherit; color: var(--text-2); padding: 0 20px; border-radius: 8px 8px 0 0; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .apptabs button.on { background: var(--primary-soft); color: var(--primary); }
  .apptabs svg { width: 12px; height: 12px; }
  .topbar-r { margin-left: auto; display: flex; align-items: center; gap: 24px; color: var(--text-2); }
  .topbar-r .search { width: 160px; height: 28px; border-radius: 16px; background: var(--block); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--text-disabled); }
  .topbar-r button { border: none; background: none; font: inherit; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .topbar-r button:hover { color: var(--primary); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
  .ic { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
  .side { background: var(--primary); color: #fff; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; position: sticky; top: 0; height: 100vh; }
  .side .brand { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; font-weight: 500; margin-bottom: 12px; }
  .side a { width: 56px; padding: 8px 0; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(255,255,255,.85); font-size: 12px; line-height: 20px; cursor: pointer; text-decoration: none; }
  .side a svg { width: 20px; height: 20px; }
  .side a:hover { background: rgba(255,255,255,.12); }
  .side a.on { background: rgba(255,255,255,.2); color: #fff; }
  main { padding: 24px; min-width: 0; }
  h1 { font-size: 24px; line-height: 32px; font-weight: 500; margin-bottom: 16px; }
  h2 { font-size: 16px; line-height: 24px; font-weight: 500; margin-bottom: 12px; }
  .card { background: var(--card); border-radius: 8px; padding: 24px; margin-bottom: 16px; }
  .note { font-size: 12px; line-height: 20px; color: var(--text-3); }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .btn { height: 32px; padding: 0 16px; border-radius: 4px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn.primary:active { background: var(--primary-active); border-color: var(--primary-active); }
  .btn:disabled { cursor: not-allowed; color: var(--text-disabled); background: var(--block); border-color: var(--border); }
  .btn.link { border: none; padding: 0; height: auto; color: var(--primary); background: none; }
  input[type=text], input[type=number], select { height: 32px; border: 1px solid var(--border); border-radius: 4px; padding: 0 8px; background: #fff; }
  input[type=number] { width: 72px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--border-strong); box-shadow: 0 0 0 2px var(--primary-soft); }
  .btn:focus-visible { outline: 2px solid var(--border-strong); outline-offset: 1px; }
  input::placeholder, textarea::placeholder { color: var(--text-disabled); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--divider); vertical-align: middle; }
  th { background: var(--block); font-weight: 500; color: var(--text-2); white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 0 8px; border-radius: 4px; font-size: 12px; line-height: 20px; background: var(--block); color: var(--text-2); white-space: nowrap; }
  .tag.blue { background: var(--primary-soft); color: var(--primary); }
  .tag.red { background: var(--danger-soft); color: var(--danger); }
  .tag.green { background: var(--success-soft); color: #389E0D; }
  .tag.orange { background: var(--warning-soft); color: #AD6800; }
  .banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 4px; background: var(--primary-soft); margin-bottom: 16px; }
  .banner.warn { background: var(--warning-soft); }
  .flowhead { --e-primary: var(--primary); --e-text-2: #595959; --e-border: #D9D9D9; --e-border-light: #E5E5E5;
    margin: -24px -24px 16px; position: sticky; top: 40px; z-index: 20; font-size: 14px; color: #1F1F1F; }
  .stepbar { display: flex; align-items: center; gap: 8px; list-style: none; margin: 0; padding: 0; font-size: 14px; color: var(--text-3); white-space: nowrap; }
  .ed-head h1 { flex: none !important; }
  .ed-head .stepbar { margin: 0 auto 0 40px; } /* 紧跟标题，三步里位置不随右侧按钮变化 */
  .stepbar em { font-style: normal; }
  .ed-head h1 { white-space: nowrap; }
  @media (max-width: 1280px) { .ed-head .stepbar li:not(.on) em { display: none; } }
  .stepbar li { display: flex; align-items: center; gap: 8px; }
  .stepbar li + li::before { content: ""; width: 28px; height: 1px; background: var(--border); }
  .stepbar li.done + li::before { background: var(--primary); }
  .stepbar i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; margin-right: 6px; }
  .stepbar li > span, .stepbar button { display: inline-flex; align-items: center; }
  .stepbar li.on { color: var(--primary); font-weight: 500; }
  .stepbar li.on i { background: var(--primary); border-color: var(--primary); color: #fff; }
  .stepbar li.done i { border-color: var(--primary); color: var(--primary); }
  .stepbar button { border: none; background: none; padding: 0; font: inherit; color: var(--text-2); cursor: pointer; }
  .stepbar button:hover { color: var(--primary); }
  .tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--divider); margin-bottom: 16px; }
  .tabs button { border: none; background: none; height: 40px; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .switch input { width: 16px; height: 16px; accent-color: var(--primary); }
  /* 设置类开关：与第 1 步题目设置的滑块一致；表格勾选、批量选择仍用复选框 */
  .switch input.tg, input.tg { appearance: none; -webkit-appearance: none; width: 30px; height: 16px; border-radius: 8px; background: #D9D9D9; position: relative; cursor: pointer; flex: none; margin: 0; border: none; transition: background .15s; }
  input.tg::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: left .15s; }
  input.tg:checked { background: var(--primary); }
  input.tg:checked::after { left: 16px; }
  input.tg:disabled { opacity: .5; cursor: not-allowed; }
  .bar { height: 8px; border-radius: 4px; background: var(--block); min-width: 80px; position: relative; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--primary); }
  .err { color: var(--danger); }
  .ok { color: #389E0D; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: grid; grid-template-columns: 112px 1fr; gap: 8px 16px; align-items: center; margin-bottom: 16px; }
  .field label { color: var(--text-2); }
  .typecards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .typecard { border: 1px solid var(--border); border-radius: 8px; padding: 16px; cursor: pointer; background: #fff; text-align: left; }
  .typecard.on { border-color: var(--primary); background: var(--primary-soft); }
  .typecard b { display: block; font-weight: 500; margin-bottom: 4px; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 10; }
  .mask.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 24px; width: min(560px, calc(100vw - 32px)); }
  .modal .foot { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
  .toast { position: fixed; top: 56px; left: 50%; transform: translateX(-50%); background: #fff; padding: 10px 16px; border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; z-index: 100; }
  .toast.show { display: block; }
  .scroll { overflow-x: auto; }
  .muted { color: var(--text-3); }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .side { display: flex; flex-wrap: wrap; padding: 8px; }
    .side .brand, .side .group { display: none; }
    .side a { padding: 6px 10px; }
    main { padding: 16px; }
    .flowhead { margin: -16px -16px 16px; overflow-x: auto; }
    .subnav { margin: -16px -16px 16px; padding: 0 16px; overflow-x: auto; gap: 16px; }
    .grid2, .typecards { grid-template-columns: 1fr; }
    .field { grid-template-columns: 1fr; }
  }

  /* ===== 第 1 步：沿用调查管理(新)「新建问卷」页（参照 survey-paragraph-one-per-question/ref/） ===== */
  main.editor-mode { padding: 0; }
  .ed { --e-primary: var(--primary); --e-primary-light: var(--primary-soft); --e-text: #1F1F1F; --e-text-2: #595959; --e-text-3: #8C8C8C;
        --e-border: #D9D9D9; --e-border-light: #E5E5E5; --e-danger: #FF4D4F;
        display: flex; flex-direction: column; min-height: calc(100vh - 40px); background: #F8F8F8; font-size: 14px; color: var(--e-text); }
  .ed-head { height: 64px; background: #fff; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--e-border-light); flex: none; position: sticky; top: 40px; z-index: 12; }
  .ed-head h1 { font-size: 16px; font-weight: 400; margin: 0; flex: 1; display: flex; align-items: center; gap: 8px; }
  .ed-btn { height: 32px; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--e-border); background: #fff; border-radius: 4px; color: var(--e-text-2); font-size: 14px; margin-left: 8px; cursor: pointer; white-space: nowrap; }
  .ed-btn:hover { color: var(--e-primary); border-color: var(--e-primary); }
  .ed-btn.primary:hover { background: var(--primary-hover); color: #fff; }
  .ed-btn.primary { background: var(--e-primary); border-color: var(--e-primary); color: #fff; }
  .ed-body { flex: 1; display: grid; grid-template-columns: 188px minmax(0, 1fr) 288px; align-items: start; }
  .ed-pal { background: #fff; padding: 16px; position: sticky; top: 104px; max-height: calc(100vh - 104px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #C4C4C4 transparent; }
  .ed-pal-title { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--e-text-2); padding: 8px 0 4px; margin-top: 8px; }
  .ed-pal-title:first-child { margin-top: 0; }
  .ed-pal-title svg { width: 12px; height: 12px; }
  .ed-pal-title span { color: var(--e-text-3); }
  .ed-pal-item { height: 32px; margin: 8px 0; padding: 0 12px; background: #F5F5F5; border-radius: 4px; display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; border: none; width: 100%; color: var(--e-text); }
  .ed-pal-item:hover { background: var(--e-primary-light); color: var(--e-primary); }
  .ed-pal-item svg { width: 14px; height: 14px; flex: none; }
  .ed-pal-item .sc { margin-left: auto; font-size: 12px; color: var(--e-text-3); }
  .ed-pal-note { font-size: 12px; color: var(--e-text-3); line-height: 1.6; padding: 4px 2px 0; }
  .ed-wrap { overflow: visible; padding: 0 24px 80px; background: var(--block); min-height: calc(100vh - 104px); }
  .ed-sum { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-radius: 4px; background: #EEF4FF; color: var(--e-text-2); font-size: 12px; padding: 8px 12px; margin: 12px 0 0; }
  .ed-sum b { color: var(--e-primary); font-weight: 600; }
  .ed-canvas { background: #fff; margin-top: 16px; border-radius: 8px; overflow: hidden; }
  .ed-block { position: relative; border: 1px solid transparent; border-bottom-color: var(--e-border-light); cursor: pointer; }
  .ed-block:hover { border-color: #B9D0F7; }
  .ed-block.sel { border-color: var(--e-primary); box-shadow: inset 3px 0 0 var(--e-primary); }
  .ed-h { padding: 22px 52px 20px; }
  .ed-h-title { font-size: 24px; line-height: 32px; font-weight: 500; text-align: center; margin-bottom: 10px; }
  .ed-h-desc { font-size: 14px; color: var(--e-text-2); line-height: 1.8; }
  .ed-q { padding: 14px 52px 18px; }
  .ed-tags { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .ed-tag { display: inline-block; background: #F5F5F5; color: var(--e-text-2); font-size: 12px; padding: 0 6px; line-height: 20px; border-radius: 2px; }
  .ed-tag.score { background: #EEF4FF; color: var(--e-primary); }
  .ed-q-title { font-size: 14px; display: flex; gap: 6px; align-items: baseline; margin-bottom: 14px; }
  .ed-q-title .req { color: var(--e-danger); margin-left: -10px; width: 4px; flex: none; }
  .ed-q-title .no { font-weight: 600; flex: none; }
  .ed-stars { display: flex; gap: 16px; color: var(--e-text-3); font-size: 12px; }
  .ed-stars span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .ed-stars span::before { content: "★"; color: #D9D9D9; font-size: 16px; }
  .ed-essay { height: 60px; border: 1px solid var(--e-border-light); border-radius: 3px; color: #BFBFBF; font-size: 12px; padding: 8px; }
  .ed-props { background: #fff; padding: 16px 24px; position: sticky; top: 104px; max-height: calc(100vh - 104px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #C4C4C4 transparent; }
  .ed-props h3 { font-size: 14px; font-weight: 500; margin: 0 0 16px; }
  .ed-props h4 { font-size: 12px; font-weight: 500; color: var(--e-text); margin: 20px 0 12px; padding-top: 16px; border-top: 1px solid var(--e-border-light); }
  .ed-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--e-text-2); margin-bottom: 16px; gap: 8px; }
  .ed-row a { color: var(--e-primary); cursor: pointer; }
  .ed-row input[type=number] { width: 64px; height: 26px; border: 1px solid var(--e-border); border-radius: 3px; padding: 0 6px; font-size: 12px; }
  .ed-row b { color: var(--e-text); font-weight: 500; }
  .ed-hint { font-size: 12px; color: var(--e-text-3); line-height: 1.6; background: #F5F5F5; padding: 8px 10px; border-radius: 3px; }
  .ed-sw { width: 30px; height: 16px; border-radius: 8px; background: var(--e-primary); position: relative; cursor: pointer; flex: none; border: none; padding: 0; }
  .ed-sw::after { content: ""; position: absolute; right: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  .ed-sw.off { background: #D9D9D9; }
  .ed-sw.off::after { right: auto; left: 2px; }
  .ed-sw:disabled { opacity: .5; cursor: not-allowed; }
  @media (max-width: 760px) { .ed-body { grid-template-columns: 1fr; } .ed-pal, .ed-props { display: none; } .ed-h, .ed-q { padding-left: 20px; padding-right: 20px; } }
  .reltable td.objcell { vertical-align: middle; background: #fff; min-width: 150px; }
  .reltable td.objcell .note { margin-top: 4px; }
  .reltable tr.objlast td, .reltable td.objcell { border-bottom: 1px solid var(--border); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .ed-tag.warn { background: #FFFBE6; color: #AD6800; }
  .ed-err { color: var(--e-danger, #FF4D4F); font-size: 12px; }
  .ed-q-desc { font-size: 12px; color: var(--e-text-3); margin: -8px 0 12px; }
  .ed-opt-view { display: flex; align-items: center; gap: 10px; min-height: 26px; color: var(--e-text-2); font-size: 12px; }
  .ed-opt-view i, .ed-opt i { width: 12px; height: 12px; border: 1px solid var(--e-border); border-radius: 50%; flex: none; }
  .ed-optscore { margin-left: auto; color: var(--e-text-3); min-width: 64px; text-align: right; }
  .ed-editing { cursor: default; }
  .ed-erow { display: flex; align-items: flex-start; gap: 6px; }
  .ed-erow .no { font-size: 14px; font-weight: 600; padding-top: 6px; flex: none; }
  .ed-erow .req { color: var(--e-danger); padding-top: 6px; margin-left: -10px; width: 4px; flex: none; }
  .ed-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .ed-in { height: 30px; border: 1px solid var(--e-border); border-radius: 3px; padding: 0 8px; font-size: 12px; color: var(--e-text); background: #fff; min-width: 0; }
  .ed-in:focus { border-color: var(--e-primary); outline: none; }
  .ed-in.title { font-size: 14px; height: 32px; }
  .ed-in.num { width: 72px; }
  .ed-in:disabled { background: #F5F5F5; }
  .ed-ebody { margin: 14px 0 0 28px; }
  .ed-opts { display: flex; flex-direction: column; gap: 6px; }
  .ed-opt, .ed-opt-head { display: grid; grid-template-columns: 12px minmax(0, 1fr) 72px 44px 22px; gap: 8px; align-items: center; }
  .ed-opt.noscore { grid-template-columns: 12px minmax(0, 1fr) 22px; }
  .ed-opt-head { font-size: 12px; color: var(--e-text-3); }
  .ed-opt input[type=checkbox] { justify-self: center; width: 14px; height: 14px; accent-color: var(--e-primary); }
  .ed-x { border: none; background: none; color: var(--e-text-3); font-size: 16px; cursor: pointer; }
  .ed-x:hover:not(:disabled) { color: var(--e-danger); }
  .ed-x:disabled { opacity: .3; cursor: not-allowed; }
  .ed-add { border: none; background: none; color: var(--e-primary); font-size: 12px; padding: 4px 0 0 20px; text-align: left; cursor: pointer; }
  .ed-tip { font-size: 12px; color: var(--e-text-3); margin-top: 8px; line-height: 1.6; }
  .ed-ops { display: flex; justify-content: flex-end; margin-top: 14px; }
  .ed-range { display: inline-flex; align-items: center; gap: 4px; }
  .ed-range input { width: 48px !important; }
  .ed-mini { width: 100%; font-size: 12px; margin-top: 4px; }
  .ed-mini th, .ed-mini td { padding: 6px 4px; border-bottom: 1px solid var(--e-border-light); background: none; color: var(--e-text-2); }
  .ed-mini th { color: var(--e-text-3); font-weight: 400; }
  .ed-opt-view i.sq, .ed-opt i.sq { border-radius: 2px; }
  .ed-matrix { width: 100%; border-collapse: collapse; font-size: 12px; color: var(--e-text-2); }
  .ed-matrix th, .ed-matrix td { padding: 6px 4px; text-align: center; border: none; background: none; font-weight: 400; }
  .ed-matrix td:first-child, .ed-matrix th:first-child { text-align: left; }
  .ed-matrix i { width: 12px; height: 12px; border: 1px solid var(--e-border); border-radius: 50%; display: inline-block; }
  .ed-matrix .ed-optscore { margin: 2px 0 0; text-align: center; min-width: 0; }
  .ed-nps { display: flex; gap: 4px; flex-wrap: wrap; }
  .ed-nps span { width: 28px; height: 26px; border: 1px solid var(--e-border-light); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--e-text-3); }
  .ed-scale-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--e-text-3); margin-top: 6px; max-width: 420px; }
  .ed-sub { font-size: 12px; color: var(--e-text); font-weight: 500; }
  .ed-ends { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--e-text-2); }
  .ed-ends .ed-in { width: 120px; margin-left: 6px; }

<script>
/* ---------- 演示数据 ---------- */
const QUESTIONS = [
  { id: 'q1', title: '授课内容贴合工作实际', max: 5, weight: 3 },
  { id: 'q2', title: '讲解清楚、重点突出', max: 5, weight: 2 },

  { id: 'q4', title: '案例实用、可借鉴', max: 5, weight: 2 },
  { id: 'q5', title: '时间把控合理', max: 5, weight: 1 },
];
const OPEN_QUESTION = '对讲师还有什么建议？';
const OPEN_ANSWERS = {
  t1: ['案例很贴近我们部门的工作', '希望多留一些练习时间', '讲得很清楚'],
  t2: ['节奏有点快', '可以多分享销售一线的例子'],
  t3: ['互动很多，课堂气氛好', '资料可以提前发'],
  t4: ['内容偏理论，希望多讲实操', '时间控制可以再好一些', '课件字太小'],
};

// 「讲师池」= 讲师中心的「讲师分类」（多级目录，接口 /app-lecturer/teacherCategory/teacherCategoryList.do）
const POOL_LIST = [{ id: 'p1', name: '培训' }, { id: 'p3', name: '研发技术' }, { id: 'p4', name: '营销管理' }, { id: 'p5', name: '课程开发技能' }, { id: 'p6', name: '课程开发技能 / 课程设计', child: true }];
const poolName = id => (POOL_LIST.find(p => p.id === id) || {}).name || '-';
const TEACHERS = [
  { id: 't1', name: '张明', no: 'JS0012', src: '内部讲师', level: '高级讲师', dept: '研发中心', pool: 'p3' },
  { id: 't2', name: '李华', no: 'JS0035', src: '内部讲师', level: '中级讲师', dept: '销售部', pool: 'p4' },
  { id: 't3', name: '王芳', no: 'JS0041', src: '内部讲师', level: '专家讲师', dept: '人力资源部', pool: 'p1' },
  { id: 't4', name: '陈刚', no: 'JS0058', src: '内部讲师', level: '初级', dept: '研发中心', pool: 'p3' },
  { id: 't6', name: '赵静', no: 'JS0066', src: '内部讲师', level: '预备讲师', dept: '财务部', pool: 'p1' },
  { id: 't7', name: '孙磊', no: 'JS0071', src: '内部讲师', level: '初级', dept: '销售部', pool: 'p4' },
  { id: 't5', name: '刘洋', no: 'WP0003', src: '外部讲师', level: '中级讲师', dept: '外部讲师', pool: 'p5' },
  { id: 't8', name: '周婷', no: 'WP0007', src: '外部讲师', level: '高级讲师', dept: '外部讲师', pool: 'p6' },
];
const OBJECTS = TEACHERS.slice(0, 4); // 结果页使用的演示对象（有答卷）

const EVALUATORS = {
  s1: { name: '周一', dept: '研发中心', rel: '学员' },
  s2: { name: '吴二', dept: '销售部', rel: '学员' },
  s3: { name: '郑三', dept: '销售部', rel: '学员' },
  s4: { name: '孙四', dept: '人力资源部', rel: '学员' },
  m1: { name: '赵敏', dept: '培训中心', rel: '班主任' },
};

// 每份答卷：对象、评测人、关系、各计分题原始分（1-5）
const A = (obj, who, rel, s) => ({ obj, who, rel, s });
const ANSWERS = [
  A('t1','s1','学员',[5,4,4,4,3]), A('t1','s2','学员',[5,5,4,4,4]), A('t1','s3','学员',[4,4,4,4,2]), A('t1','s4','学员',[5,5,5,4,4]),
  A('t1','m1','班主任',[4,4,4,4,4]), A('t1','t1','自评',[5,5,5,5,3]),
  A('t2','s1','学员',[4,4,4,3,4]), A('t2','s2','学员',[4,3,4,4,3]), A('t2','s3','学员',[3,3,4,3,3]), A('t2','s4','学员',[5,4,4,4,4]),
  A('t2','m1','班主任',[4,4,3,4,4]), A('t2','t2','自评',[5,5,5,5,5]),
  A('t3','s1','学员',[5,5,5,5,4]), A('t3','s2','学员',[5,5,4,5,4]), A('t3','s3','学员',[4,5,5,4,4]), A('t3','s4','学员',[5,4,5,5,5]),
  A('t3','m1','班主任',[5,5,4,4,4]),
  A('t4','s1','学员',[3,4,3,3,3]), A('t4','s2','学员',[3,3,3,3,4]), A('t4','s3','学员',[2,3,3,2,3]), A('t4','s4','学员',[4,4,3,4,4]),
  A('t4','m1','班主任',[3,3,3,3,3]), A('t4','t4','自评',[4,4,4,4,4]),
];

/* ---------- 页面状态 ---------- */
const state = {
  page: 'list', step: 'score', tab: 'rank',
  qWeightOn: true, qWeights: QUESTIONS.map(q => q.weight),
  objects: [], objSel: [], poolOpen: false, poolSel: [],
  poolF: { name: '', src: '', level: '', pool: '' },
  relFilter: '', deptFilter: '', anon: false, selQ: null,
};
const REL_NAMES = ['学员', '班主任', '自评'];

/* ---------- 计分（与 PRD 2.2 一致） ---------- */
const FULL = QUESTIONS.reduce((s, q) => s + q.max * q.weight, 0); // 50
// 每份答卷先换算成标准分 = 得分 ÷ 本答卷应得满分 × 问卷满分；关系平均、加权、去高去低、排名都用标准分。
// 选了「不计分」选项的题记为 null，从这份答卷的应得满分里扣掉；应得满分为 0 的答卷不参与得分计算。
const rawTotal = a => a.s.reduce((n, v, i) => v == null ? n : n + v * QUESTIONS[i].weight, 0);
const ansFull = a => a.s.reduce((n, v, i) => v == null ? n : n + QUESTIONS[i].max * QUESTIONS[i].weight, 0);
const total = a => { const f = ansFull(a); return f ? Math.round(rawTotal(a) / f * FULL * 100) / 100 : null; };
const scoredTotals = list => list.map(total).filter(v => v != null);
const avg = list => { const l = list.filter(v => v != null); return l.length ? l.reduce((a, b) => a + b, 0) / l.length : null; };
const r1 = v => v == null ? '-' : (Math.round(v * 10 + 1e-9) / 10).toFixed(1);

// state.trim 是「去掉最高分、最低分」总开关；项目设置里可以只去其一（评估管理「计算总分和平均分」）
state.trimHi = false; state.trimLo = false;
Object.defineProperty(state, 'trim', { get() { return state.trimHi || state.trimLo; }, set(v) { state.trimHi = state.trimLo = v; } });
function trimmed(totals) {
  if (!state.trim) return totals;
  const t = [...totals].sort((a, b) => a - b);
  if (state.trimHi && t.length - 1 >= 1) t.pop();   // 去掉最高分，剩余不足 1 份时不去
  if (state.trimLo && t.length - 1 >= 1) t.shift(); // 去掉最低分
  return t;
}
function included() {
  return ANSWERS.filter(a => !(state.ansState && state.ansState[`${a.obj}|${a.who}`])
    && (!state.relFilter || a.rel === state.relFilter)
    && (!state.deptFilter || objById(a.obj).dept === state.deptFilter));
}
const objById = id => OBJECTS.find(o => o.id === id);
const evalInfo = who => EVALUATORS[who] || { name: objById(who).name, dept: objById(who).dept, rel: '自评' };

function relScore(objId, rel) {
  const totals = scoredTotals(included().filter(a => a.obj === objId && a.rel === rel));
  return totals.length ? avg(trimmed(totals)) : null;
}
function objScore(objId) {
  const totals = scoredTotals(included().filter(a => a.obj === objId));
  return { score: totals.length ? avg(trimmed(totals)) : null, missing: [] };
}
function projectAvg() { return avg(scoredTotals(included())); }

/* ---------- 渲染 ---------- */
const $ = s => document.querySelector(s);
const main = $('#main');
function go(page) { state.page = page; render(); window.scrollTo(0, 0); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2000); }

function render() {
  document.querySelectorAll('.side a[data-page]').forEach(a => a.classList.toggle('on', state.page !== 'student'));
  const sw = document.querySelector('#switchRole span'); if (sw) sw.textContent = state.page === 'student' ? '返回管理端' : '切换学员';
  main.classList.toggle('editor-mode', state.page === 'create' && state.step === 'score');
  main.innerHTML = ({ list: pageList, create: pageCreate, result: pageResult, legacy: pageLegacy, callers: pageCallers, tplLib: pageTplLib, scene: pageScene, student: pageStudent, detail: pageDetail, monitor: pageMonitor })[state.page]();
  bind();
}

function pageLegacy() {
  return `<h1>我管理的评估</h1>
  <div class="banner warn"><span>评估管理已并入评估调查，新建评估请到评估调查。历史评估可以继续查看排名和导出。</span>
    <button class="btn primary" data-go="create">去新建评估型调查</button></div>
  <div class="card"><div class="scroll"><table>
    <thead><tr><th>评估名称</th><th>状态</th><th>结束时间</th><th>操作</th></tr></thead>

      <tr><td>2026 Q2 内训师评估</td><td>已结束</td><td>2026-06-30</td><td><span class="muted">查看排名　导出</span></td></tr>
      <tr><td>2026 Q3 内训师评估</td><td>进行中</td><td>2026-11-15</td><td><span class="muted">查看排名　导出</span></td></tr>
    </tbody></table></div>
    <p class="note" style="margin-top:12px">「新建项目」「复制项目」已隐藏；进行中的评估照常作答到结束时间。</p>
  </div>`;
}

function pageCreate() {
  if (state.step === 'score') return stepScore();
  const body = ({ rel: stepRel, setting: stepSetting })[state.step]();
  // 第 ②③ 步顶栏与第 ① 步一致：标题、步骤条、操作按钮在同一行
  const btns = state.step === 'rel'

}


/* 第 1 步沿用调查管理(新)的「新建问卷」页：左侧题型（点击添加）、中间画布（点题目直接编辑）、右侧题目设置。
   普通调查 = 现网全量题型（不计分）；评估问卷只放能计分的题型：单选、多选、打分、NPS，问答单列为「附加问题」。

  ['选择题', ['单选', '多选']],
  ['评分题', ['打分', 'NPS']],
  ['附加问题（不计分）', ['问答']],

const SCORABLE = ['单选', '多选', '打分', 'NPS'];
/* 调查问卷题型栏对齐调查管理（新）现网 + 已规划新增题型；评估问卷不要用这套 */
const NORMAL_PALETTE = [

const PAL_ICON = {

const OPT_TYPES = ['单选', '多选'];
const MATRIX_ROW_TYPES = ['矩阵单选', '矩阵多选', '矩阵量表', '矩阵填空', '矩阵打分', '矩阵滑动'];
const LIST_OPT_TYPES = ['排序题'];
const NEW_TYPE_MARK = new Set(['矩阵多选', '排序题', '签名题', '矩阵打分', '矩阵滑动']);

function newQuestion(type) {
  const base = { type, title: type === '文本段落' ? '文本段落描述' : '请输入题目', desc: '', weight: 1, score: !isNormal() && SCORABLE.includes(type), req: type !== '文本段落' };
  if (OPT_TYPES.includes(type)) return { ...base, opts: [{ t: '选项1', v: isNormal() ? '' : 2 }, { t: '选项2', v: isNormal() ? '' : 1 }, { t: '选项3', v: isNormal() ? '' : 0 }] };
  if (type === '打分') return { ...base, min: 1, max: 5 };
  if (type === 'NPS') return { ...base, title: isNormal() ? '你有多大可能向同事推荐本课程？' : '你有多大可能向同事推荐这位讲师？' };
  if (type === '填空') return { ...base, title: '请填写' };
  if (type === '排序题') return { ...base, opts: [{ t: '选项1' }, { t: '选项2' }, { t: '选项3' }, { t: '选项4' }] };
  if (MATRIX_ROW_TYPES.includes(type)) return { ...base, rows: ['行项目1', '行项目2', '行项目3'], cols: type.includes('填空') ? [] : [{ t: '列1' }, { t: '列2' }, { t: '列3' }, { t: '列4' }, { t: '列5' }] };
  if (type === '文件上传') return { ...base, title: '请上传相关材料' };
  if (type === '多段选择') return { ...base, title: '请按层级选择', opts: [{ t: '一级选项' }, { t: '二级选项' }] };
  if (type === '签名题') return { ...base, title: '请在下方签名确认' };
  return base;
}

// 编辑器里的问卷：前 4 题打分、第 5 题单选（选项分值 5~1，与结果页演示答卷一致）、第 6 题问答（附加问题）
state.edHead = { title: '内训师授课评价表', desc: '请根据本次课程的实际感受，对每位讲师分别评价。评价结果用于讲师改进和年度评优。' };
state.edQs = [
  ...QUESTIONS.slice(0, 4).map(q => ({ type: '打分', title: q.title, desc: '', min: 1, max: q.max, weight: q.weight, score: true, req: true })),
  { type: '单选', title: QUESTIONS[4].title, desc: '', weight: QUESTIONS[4].weight, score: true, req: true,
    opts: [{ t: '非常合理', v: 5 }, { t: '比较合理', v: 4 }, { t: '一般', v: 3 }, { t: '不太合理', v: 2 }, { t: '很不合理', v: 1 }, { t: '没注意', v: null, ns: true }] },
  { type: '问答', title: OPEN_QUESTION, desc: '', score: false, req: true },
];
state.edDirty = false;

// 新建时选的类型决定三步显示的字段：评估型「编辑问卷 → 对象与关系 → 项目设置」；普通调查「编辑问卷 → 选择学员 → 项目设置」
state.createType = 'eval';
const isNormal = () => state.createType === 'normal';
const typeTag = () => isNormal() ? '<span class="tag">调查问卷</span>' : '<span class="tag blue">评估问卷</span>';
const EVAL_SAMPLE = { head: { ...state.edHead }, qs: JSON.parse(JSON.stringify(state.edQs)) };
const NORMAL_SAMPLE = {
  head: { title: '2026 年度培训需求调研', desc: '请根据实际情况填写，结果用于制定下一年度的培训计划。' },
  qs: [
    { type: '单选', title: '你所在的岗位类别', desc: '', weight: 1, score: false, req: true, opts: [{ t: '管理岗', v: '' }, { t: '专业岗', v: '' }, { t: '一线岗', v: '' }] },
    { type: '多选', title: '你最想提升的能力（可多选）', desc: '', weight: 1, score: false, req: true, opts: [{ t: '沟通协作', v: '' }, { t: '专业技能', v: '' }, { t: '团队管理', v: '' }] },
    { type: '问答', title: '对培训还有什么建议？', desc: '', score: false, req: false },
  ],
};
function startCreate(type, title) {
  const smp = type === 'normal' ? NORMAL_SAMPLE : EVAL_SAMPLE;
  state.createType = type; state.edHead = { ...smp.head }; state.edQs = JSON.parse(JSON.stringify(smp.qs));
  if (title) state.edHead.title = title;
  state.normalSel = []; state.editPid = null; state.qtEditId = null; state.step = 'score'; state.selQ = null; state.edDirty = false;
  go('create');
}

const qW = q => state.qWeightOn ? (Number(q.weight) || 0) : 1;
const isEmpty = v => v === null || v === '' || v === undefined;
const scored = list => list.filter(o => !o.ns && !isEmpty(o.v));
const maxOf = list => scored(list).reduce((m, o) => Math.max(m, Number(o.v)), 0);
function qMax(q) {
  if (q.type === '单选') return maxOf(q.opts);
  if (q.type === '多选') return scored(q.opts).reduce((s, o) => s + Math.max(0, Number(o.v)), 0);
  if (q.type === '打分') return Number(q.max) || 0;
  if (q.type === 'NPS') return 10;
  return 0;
}
const qFull = q => q.score ? qMax(q) * qW(q) : 0;
const fmt = v => Number.isInteger(v) ? String(v) : v.toFixed(1);
function fullScore() { return state.edQs.reduce((s, q) => s + qFull(q), 0); }
function scoredCount() { return state.edQs.filter(q => q.score).length; }
function qError(q) {
  const blankTitle = !q.title || !q.title.trim() || q.title === '请输入题目' || q.title === '文本段落描述';
  if (blankTitle) return q.type === '文本段落' ? '请填写段落标题' : '请填写题目';
  if ((OPT_TYPES.includes(q.type) || q.type === '排序题') && q.opts.some(o => !o.t.trim())) return '选项文字不能为空';
  if (isNormal() || !q.score) return '';
  if (OPT_TYPES.includes(q.type) && q.opts.some(o => !o.ns && isEmpty(o.v))) return '请为每个选项填写分值，或设为不计分';
  if (OPT_TYPES.includes(q.type) && !scored(q.opts).length) return '至少 1 个选项计分';
  if (q.type === '单选' && scored(q.opts).some(o => Number(o.v) < 0)) return '单选题分值不能为负数';
  if (OPT_TYPES.includes(q.type) && !(qMax(q) > 0)) return '最高分值需要大于 0';
  if (q.type === '打分' && Number(q.min) < 0) return '最低分不能小于 0';
  if (q.type === '打分' && Number(q.max) > 10) return '最高分不能超过 10';
  if (q.type === '打分' && !(Number(q.max) > Number(q.min))) return '最高分需要大于最低分';
  if (state.qWeightOn && !(Number(q.weight) > 0)) return '题目权重需要大于 0';
  return '';
}
function maxRule(q) {
  if (q.type === '单选') return `最高选项分值 ${fmt(qMax(q))}`;
  if (q.type === '多选') return `计分选项分值之和 ${fmt(qMax(q))}`;
  if (q.type === '打分') return `最高分 ${q.max}`;
  if (q.type === 'NPS') return '最高 10 分';
  return '';
}
const touch = () => { state.edDirty = true; };

function stepScore() {

  const errs = state.edQs.filter(qError).length;
  return `<div class="ed ${isNormal() ? 'normal' : ''}">
  <div class="ed-head">
${state.qtEditId ? `<h1>编辑模板 <span class="tag blue">评估型调查</span></h1>

    <button class="ed-btn" id="edPreview"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6"/><path d="M6.5 5.5l4 2.5-4 2.5z"/></svg>预览</button>
    <button class="ed-btn" id="edSaveTpl"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 2.5h8l2 2v9H3z"/><path d="M5.5 2.5v3h5v-3M5.5 13.5v-4h5v4"/></svg>保存为模板</button>

        ${items.map(n => `<button class="ed-pal-item" data-addq="${n}">${PAL_ICON[n] || ''}${n}${isNormal() && NEW_TYPE_MARK.has(n) ? '<span class="sc">新</span>' : ''}</button>`).join('')}`).join('')}

      ${isNormal() ? '' : `<div class="ed-sum"><span>计分题 <b>${scoredCount()}</b> 道，满分 <b>${fmt(fullScore())}</b> 分${errs ? `　<span class="ed-err">${errs} 道题未完成</span>` : ''}</span>
        <span>${state.edDirty ? '有未保存的修改' : '已保存'}　${state.qWeightOn ? '已开启题目权重' : '未开启题目权重，每题按 1 倍计'}</span></div>`}
      <div class="ed-canvas">
        <div class="ed-block ${sel === 'head' ? 'sel' : ''}" ${sel === 'head' ? '' : 'data-selq="head"'}>${sel === 'head' ? headEdit() : `

        </div>
        ${state.edQs.length ? state.edQs.map((q, i) => `<div class="ed-block ${sel === i ? 'sel' : ''}" ${sel === i ? '' : `data-selq="${i}"`}>

      </div>
    </main>
    <aside class="ed-props" aria-label="设置">${edProps(sel)}</aside>
  </div>
  ${state.edModal ? edModal() : ''}
  </div>`;
}

function qTools(i) {
  const n = state.edQs.length;

function headEdit() {

function scoreTag(q) {
  if (isNormal()) return qError(q) ? '<span class="ed-tag warn">未完成</span>' : '';

}
const no = i => String(i + 1).padStart(2, '0');
const scoreText = o => o.ns ? '不计分' : (isEmpty(o.v) ? '<span class="ed-err">未填分值</span>' : o.v + ' 分');

function qBodyView(q) {
  if (q.type === '打分') return `<div class="ed-stars">${Array.from({ length: Math.max(0, q.max - q.min + 1) }, (_, k) => `<span>${q.min + k} 分</span>`).join('')}</div>`;

  if (q.type === '文本段落') return q.desc ? `<div class="ed-q-desc">${q.desc}</div>` : '<div class="ed-essay muted">段落说明文字</div>';

function qView(q, i) {

function qEdit(q, i) {
  let body = '';
  if (OPT_TYPES.includes(q.type) || q.type === '排序题' || q.type === '多段选择') body = `<div class="ed-opts">${optTable(q)}
      <button class="ed-add" id="eoAdd">+ 添加选项</button>
      ${q.score ? `<p class="ed-tip">${q.type === '多选' ? '多选题得分 = 所选计分选项分值之和；分值可以填负数作扣分项，本题最低 0 分。' : '单选题分值不能为负数。'}「不计分」选项被选中时不加分，也不计入本题满分，如「没注意」「不适用」。至少保留 2 个选项。</p>`
        : (q.type === '排序题' ? '<p class="ed-tip">学员按重要程度排序；本原型只示意选项编辑。</p>' : '')}</div>`;
  if (q.type === '打分') body = `${qBodyView(q)}<p class="ed-tip">${isNormal() ? '打分范围在右侧设置；调查问卷不计分排名。' : '打分范围、题目权重在右侧设置。'}</p>`;
  if (q.type === 'NPS') body = `${qBodyView(q)}<p class="ed-tip">${isNormal() ? '0–10 分，用于满意度收集。' : '0–10 分，选几分得几分；本题满分 10 分。'}</p>`;
  if (q.type === '问答' || q.type === '填空') body = `${qBodyView(q)}<p class="ed-tip">${isNormal() ? '收集文字回答。' : '附加问题：只收集文字，不计分，结果页按对象汇总回答。'}</p>`;
  if (MATRIX_ROW_TYPES.includes(q.type)) body = `${qBodyView(q)}<p class="ed-tip">矩阵行列示意，详细编辑沿用调查管理（新）现网能力。</p>`;
  if (q.type === '文件上传' || q.type === '签名题') body = `${qBodyView(q)}<p class="ed-tip">作答端交互沿用调查管理（新），本原型只示意题目。</p>`;
  if (q.type === '文本段落') body = `${qBodyView(q)}<p class="ed-tip">文本段落不是题目，不计题号、不作答。</p>`;
  const e = qError(q);
  const titlePh = q.type === '文本段落' ? '请输入段落标题' : '请输入题目';
  const titleEmpty = q.title === '请输入题目' || q.title === '文本段落描述';
  return `<div class="ed-q ed-editing">
    <div class="ed-tags"><span class="ed-tag">${q.type}</span>${scoreTag(q)}</div>
    <div class="ed-erow">${q.req ? '<span class="req">*</span>' : ''}${q.type === '文本段落' ? '' : `<span class="no">${no(i)}</span>`}
      <div class="ed-fields"><input class="ed-in title" value="${titleEmpty ? '' : q.title}" placeholder="${titlePh}" data-et="title" aria-label="题目" />
        <input class="ed-in desc" value="${q.desc}" placeholder="${q.type === '文本段落' ? '请输入段落说明（选填）' : '请输入题目说明（选填）'}" data-et="desc" aria-label="题目说明" /></div></div>
    <div class="ed-ebody">${body}</div>
    ${e ? `<p class="ed-err" style="margin:8px 0 0 28px">${e}</p>` : ''}
    <div class="ed-ops"><span class="ed-tip" style="flex:1;margin:0">点击其他题目会自动保存本题</span><button class="ed-btn" id="eqCancel">取 消</button><button class="ed-btn primary" id="eqDone">完 成</button></div>
  </div>`;
}

function edProps(sel) {
  const sw = (id, on, dis) => `<button class="ed-sw ${on ? '' : 'off'}" id="${id}" role="switch" aria-checked="${on}" ${dis ? 'disabled' : ''}></button>`;
  // 普通调查不计分：右侧只有问卷和题目的通用设置
  if (isNormal()) {
    if (sel === null || sel === 'head') return `<h3>问卷设置</h3><div class="ed-row"><span>题目数</span><b>${state.edQs.length} 道</b></div>`;
    const q = state.edQs[sel];
    return `<h3>${q.type}</h3><div class="ed-row"><span>本题必答</span>${sw('swReq', q.req)}</div><div class="ed-row"><span>逻辑跳转</span><a data-toast="该功能暂未开放">设置</a></div>`;
  }
  if (sel === null || sel === 'head') {
    return `<h3>问卷设置</h3>
      <div class="ed-row"><span>题目权重</span>${sw('swQWeight', state.qWeightOn)}</div>
      <div class="ed-hint">开启后每道计分题可以单独设权重，本题满分 = 最高分值 × 权重。关闭时每题按 1 倍计算，已填的权重保留，重新开启后恢复。</div>
      <h4>计分汇总</h4>
      <div class="ed-row"><span>计分题</span><b>${scoredCount()} 道</b></div>
      <div class="ed-row"><span>满分</span><b>${fmt(fullScore())} 分</b></div>
      <table class="ed-mini"><thead><tr><th>题</th><th>权重</th><th>满分</th><th>占比</th></tr></thead><tbody>
        ${state.edQs.map((q, i) => `<tr><td><a data-goq="${i}">${no(i)} ${q.type}</a></td><td>${q.score ? (state.qWeightOn ? q.weight : 1) : '-'}</td><td>${qError(q) ? '<span class="ed-err">未完成</span>' : (q.score ? fmt(qFull(q)) : '不计分')}</td><td>${q.score && !qError(q) && fullScore() ? Math.round(qFull(q) / fullScore() * 100) + '%' : '-'}</td></tr>`).join('')}
      </tbody></table>`;
  }
  const q = state.edQs[sel], can = SCORABLE.includes(q.type);
  return `<h3>${q.type}</h3>
    <div class="ed-row"><span>本题必答</span>${can && q.score ? '<span class="ed-hint" style="margin:0">计分题必答</span>' : sw('swReq', q.req)}</div>
    ${q.type === '问答' ? `<div class="ed-row"><span>字数限制</span>${sw('swLen', false)}</div>` : ''}
    <div class="ed-row"><span>逻辑跳转</span><a data-toast="评估型调查暂不支持逻辑跳转">设置</a></div>
    ${!can ? '<h4>计分设置</h4><div class="ed-hint">问答题是附加问题，不能计分。</div>' : `
    <h4>计分设置</h4>
    <div class="ed-row"><span>计入得分</span>${sw('swScore', q.score)}</div>
    ${!q.score ? '<div class="ed-hint">关闭后本题不计入得分和满分，选项分值保留，重新开启后恢复。</div>' : `
    ${q.type === '打分' ? `<div class="ed-row"><span>打分范围</span><span class="ed-range">
        <input type="number" value="${q.min}" min="0" data-pr="min" aria-label="最低分" /> 至 <input type="number" value="${q.max}" min="1" max="10" data-pr="max" aria-label="最高分" /></span></div>
      <div class="ed-hint" style="margin:-8px 0 16px">每级 1 分，最高 10 分。得分率 = 得分 ÷ 最高分，最低分不是 0 时，打最低档也有得分率。</div>` : ''}
    ${OPT_TYPES.includes(q.type) ? `<div class="ed-row"><span>选项分值</span><b>${scored(q.opts).length} 个计分</b></div>
      <div class="ed-hint" style="margin:-8px 0 16px">在画布里逐个选项填写分值。</div>` : ''}
    <div class="ed-row"><span>题目权重</span>${state.qWeightOn
      ? `<input type="number" min="0" step="0.5" value="${q.weight}" data-pr="weight" aria-label="题目权重" />`
      : '<span>1 <a id="goQW">开启</a></span>'}</div>
    <div class="ed-row"><span>本题满分</span><b>${qError(q) ? '-' : fmt(qFull(q)) + ' 分'}</b></div>
    <div class="ed-hint">本题满分 = ${maxRule(q)} × 权重 ${state.qWeightOn ? q.weight : 1}。答卷得分 = 本题得分 × 权重。</div>`}`}`;
}

function edModal() {
  const m = state.edModal;
  if (m.kind === 'confirm') return `<div class="mask show" role="dialog" aria-modal="true" aria-labelledby="edmTitle"><div class="modal" style="width:min(420px, calc(100vw - 32px))">
    <h2 id="edmTitle">${m.title}</h2><p class="note" style="font-size:14px;color:var(--text-2)">${m.text}</p>
    <div class="foot"><button class="btn" id="edmCancel">取消</button><button class="btn primary ${m.danger ? 'danger' : ''}" id="edmOk">${m.ok}</button></div></div></div>`;
  if (m.kind === 'tpl') return `<div class="mask show" role="dialog" aria-modal="true" aria-labelledby="edmTitle"><div class="modal" style="width:min(460px, calc(100vw - 32px))">
    <h2 id="edmTitle">保存为模板</h2>
    <div class="field" style="margin-top:12px"><label for="tplName">模板名称</label><input type="text" id="tplName" value="${state.edHead.title}" maxlength="50" /></div>
    <p class="note">保存到「模板库 · 自定义模板」，题目、选项分值和题目权重一起保存，下次新建评估型调查时可直接选用。</p>
    <div class="foot"><button class="btn" id="edmCancel">取消</button><button class="btn primary" id="tplOk">保存</button></div></div></div>`;
  if (m.kind === 'preview') return `<div class="mask show" role="dialog" aria-modal="true" aria-labelledby="edmTitle"><div class="modal" style="width:min(420px, calc(100vw - 32px));max-height:86vh;overflow-y:auto;background:#F5F5F5">
    <div class="row between"><h2 id="edmTitle" style="margin:0">预览：学员作答页</h2><button class="btn link" id="edmCancel" aria-label="关闭"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="stu-target" style="margin-top:12px"><span class="stu-note">被评测对象</span><b>（示例）张明</b></div>
    <p class="stu-title">${state.edHead.title}</p><p class="stu-note" style="margin-bottom:8px">${state.edHead.desc}</p>
    ${state.edQs.map((q, i) => stuQ(q, i, false)).join('')}
    <p class="stu-note stu-center">预览不会保存作答</p></div></div>`;
  return '';
}

function bindEditor() {
  const on = (sel, ev, fn) => { const el = main.querySelector(sel); if (el) el.addEventListener(ev, fn); };
  const cur = () => state.edQs[state.selQ];
  const open = v => {   // 切换到另一题时自动保存当前题（只是退出编辑，修改已实时写入）
    state.selQ = v; state.edNew = false;
    state.edSnap = typeof v === 'number' ? JSON.stringify(state.edQs[v]) : (v === 'head' ? JSON.stringify(state.edHead) : null);
    render();
  };
  main.querySelectorAll('[data-selq]').forEach(b => b.onclick = e => {
    if (e.target.closest('.ed-tools')) return;
    const v = b.dataset.selq; open(v === 'head' ? 'head' : Number(v));
  });
  main.querySelectorAll('[data-goq]').forEach(a => a.onclick = () => { open(Number(a.dataset.goq)); main.querySelector('.ed-block.sel')?.scrollIntoView({ block: 'center' }); });
  // 新增：插在选中题目后面；没有选中则放到最后
  main.querySelectorAll('[data-addq]').forEach(b => b.onclick = () => {
    const at = typeof state.selQ === 'number' ? state.selQ + 1 : state.edQs.length;
    state.edQs.splice(at, 0, newQuestion(b.dataset.addq)); touch();
    state.selQ = at; state.edSnap = null; state.edNew = true; render();
    main.querySelector('.ed-block.sel')?.scrollIntoView({ block: 'center' });
  });
  // 题目工具条
  main.querySelectorAll('[data-qact]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const i = Number(b.dataset.qi), act = b.dataset.qact, qs = state.edQs;
    if (act === 'up' && i > 0) { [qs[i - 1], qs[i]] = [qs[i], qs[i - 1]]; state.selQ = state.selQ === i ? i - 1 : state.selQ; touch(); render(); }
    if (act === 'down' && i < qs.length - 1) { [qs[i + 1], qs[i]] = [qs[i], qs[i + 1]]; state.selQ = state.selQ === i ? i + 1 : state.selQ; touch(); render(); }
    if (act === 'copy') { qs.splice(i + 1, 0, JSON.parse(JSON.stringify(qs[i]))); state.selQ = i + 1; state.edSnap = JSON.stringify(qs[i + 1]); touch(); render(); toast('已复制题目，插在原题后面'); }
    if (act === 'del') { state.edModal = { kind: 'confirm', title: '删除题目', text: `确定删除第 ${i + 1} 题「${qs[i].title}」吗？删除后不能恢复，本题的分值和权重也会一起删除。`, ok: '删除', danger: true, act: 'del', i }; render(); }
  });
  // 问卷标题和说明
  main.querySelectorAll('[data-head]').forEach(i => i.onchange = () => { state.edHead[i.dataset.head] = i.value; touch(); });
  on('#headDone', 'click', () => { if (!state.edHead.title.trim()) { toast('请填写问卷标题'); return; } state.selQ = null; render(); });
  // 右侧设置
  on('#swQWeight', 'click', () => { state.qWeightOn = !state.qWeightOn; touch(); render(); });
  on('#goQW', 'click', () => { state.selQ = null; render(); });
  on('#swScore', 'click', () => { cur().score = !cur().score; if (cur().score) cur().req = true; touch(); render(); });
  on('#swReq', 'click', () => { cur().req = !cur().req; touch(); render(); });
  on('#swLen', 'click', e => e.currentTarget.classList.toggle('off'));
  main.querySelectorAll('[data-pr]').forEach(i => i.onchange = () => { cur()[i.dataset.pr] = Number(i.value); touch(); render(); });
  // 题目内容与选项
  main.querySelectorAll('[data-et]').forEach(i => i.onchange = () => { cur()[i.dataset.et] = i.value; touch(); render(); });
  main.querySelectorAll('[data-ot]').forEach(i => i.onchange = () => { cur().opts[i.dataset.ot].t = i.value; touch(); render(); });
  main.querySelectorAll('[data-ov]').forEach(i => i.onchange = () => { cur().opts[i.dataset.ov].v = i.value === '' ? null : Number(i.value); touch(); render(); });
  main.querySelectorAll('[data-ons]').forEach(c => c.onchange = () => { const o = cur().opts[c.dataset.ons]; o.ns = c.checked; if (o.ns) o.v = null; touch(); render(); });
  main.querySelectorAll('[data-odel]').forEach(b => b.onclick = () => { cur().opts.splice(b.dataset.odel, 1); touch(); render(); });
  on('#eoAdd', 'click', () => { cur().opts.push({ t: '选项' + (cur().opts.length + 1), v: null }); touch(); render(); });
  // 取消：新加的题直接移除；已有的题恢复进入编辑前的内容
  on('#eqCancel', 'click', () => {
    if (state.edNew) state.edQs.splice(state.selQ, 1);
    else if (state.edSnap) state.edQs[state.selQ] = JSON.parse(state.edSnap);
    state.edNew = false; state.selQ = null; render();
  });
  on('#eqDone', 'click', () => { const e = qError(cur()); if (e) { toast(e); return; } state.edNew = false; state.selQ = null; render(); });
  // 顶部按钮
  on('#edPreview', 'click', () => { state.stu.cur = 'preview'; state.edModal = { kind: 'preview' }; render(); });
  on('#edSaveTpl', 'click', () => {
    const bad = state.edQs.findIndex(qError);
    if (bad >= 0) { toast(`第 ${bad + 1} 题：${qError(state.edQs[bad])}，完成后才能保存为模板`); state.selQ = bad; render(); return; }
    state.edModal = { kind: 'tpl' }; render();
  });
  on('#edSaveClose', 'click', () => {
    const n = state.edQs.filter(qError).length;
    state.edDirty = false; state.selQ = null; go('list');
    toast(n ? `已保存草稿，还有 ${n} 道题未完成，可在调查列表继续编辑` : '已保存草稿，可在调查列表继续编辑');
  });
  on('#edSaveLib', 'click', () => {
    const t = QTPLS.find(x => x.id === state.qtEditId), name = state.edHead.title.trim();
    if (!name) { toast('请填写模板名称（问卷标题）'); return; }
    const bad = state.edQs.findIndex(qError);
    if (bad >= 0) { toast(`第 ${bad + 1} 题：${qError(state.edQs[bad])}`); state.selQ = bad; render(); return; }
    t.name = name; t.qs = state.edQs.map(q => q.score ? q.title : `${q.title}（附加问题）`); const isNew = t.isNew; delete t.isNew;
    state.qtEditId = null; state.edDirty = false; state.selQ = null; go('tplLib'); toast(isNew ? `已新增模板「${name}」（草稿），启用后可在「从模板新增」里使用` : `已保存模板「${name}」`);
  });
  on('#edCancel', 'click', () => {
    if (state.qtEditId) { const t = QTPLS.find(x => x.id === state.qtEditId); if (t && t.isNew) QTPLS.splice(QTPLS.indexOf(t), 1); state.qtEditId = null; state.edDirty = false; state.selQ = null; go('tplLib'); return; }
    if (!state.edDirty) { state.selQ = null; go('list'); return; }
    state.edModal = { kind: 'confirm', title: '放弃本次编辑？', text: '有未保存的修改，离开后这些修改会丢失。需要保留请点「保存并关闭」。', ok: '放弃并离开', danger: true, act: 'leave' }; render();
  });
  on('#edNext', 'click', () => {
    if (!isNormal() && !scoredCount()) { toast('至少需要 1 道计分题'); return; }
    const bad = state.edQs.findIndex(qError);
    if (bad >= 0) { toast(`第 ${bad + 1} 题：${qError(state.edQs[bad])}`); state.selQ = bad; render(); main.querySelector('.ed-block.sel')?.scrollIntoView({ block: 'center' }); return; }
    state.edDirty = false; state.selQ = null; state.step = 'rel'; render();
  });
  // 弹窗
  on('#edmCancel', 'click', () => { state.edModal = null; render(); });
  on('#edmOk', 'click', () => {
    const m = state.edModal; state.edModal = null;
    if (m.act === 'del') { state.edQs.splice(m.i, 1); state.selQ = null; touch(); render(); toast('已删除题目'); }
    if (m.act === 'leave') { state.edDirty = false; state.selQ = null; go('list'); }
  });
  on('#tplOk', 'click', () => {
    const name = main.querySelector('#tplName').value.trim();
    if (!name) { toast('请填写模板名称'); return; }
    QTPLS.unshift(T(`q${Date.now()}`, '自定义模板', name, `${TODAY.replace(/-/g, '')}${String(QTPLS.length + 1).padStart(6, '0')}`, '评估型调查', '高源', '培训中心', `${TODAY} 10:00:00`, '启用', 0, state.edQs.map(q => q.score ? q.title : `${q.title}（附加问题）`)));
    state.edModal = null; render(); toast(`已保存为模板「${name}」，可在模板库和「从模板新增」里找到`);
  });
}

/* 第 2 步：一张表配齐「被评测对象 × 评测关系 × 评测人」。从讲师库按讲师分类批量选，支持自定义对象和关系。 */
// 第 ② 步：每个对象自己填评测关系（文本，可不填）和评测人；不提供关系模板；本期不做按关系加权
// 新关系的评测人还没选（本期只支持指定人员）
const newRel = () => ({ name: '', who: '', count: 0, pick: [] });
const newRels = () => [newRel()];
const objFromTeacher = t => ({ id: t.id, name: t.name, kind: '讲师库', no: t.no, level: t.level, dept: t.dept, pool: poolName(t.pool), rels: newRels() });
// 演示项目已配置好的关系（结果页的演示答卷按这三种关系计分）
const DEMO_RELS = [{ name: '学员', who: '面授学员', count: 4 }, { name: '班主任', who: '指定人员（赵敏）', count: 1, pick: ['m1'] }, { name: '自评', who: '对象本人', count: 1 }];

// 普通调查第 ② 步：选择学员（调查范围），与评估型的评测人统一放在第 ② 步
state.normalSel = [];
function stepPeople() {
  const list = state.normalSel.map(id => pickPool().find(x => x.id === id)).filter(Boolean);
  return `<div class="card"><h2>选择学员</h2>
    <div class="row" style="gap:8px;margin-bottom:16px"><button class="btn primary" id="pickPeople">选择学员</button><span class="note">已选择 ${list.length} 人</span></div>
    <div class="scroll"><table class="reltable"><thead><tr><th>姓名</th><th>工号</th><th>部门</th><th>操作</th></tr></thead>
      <tbody>${list.map(x => `<tr><td>${x.name}</td><td>${x.code}</td><td>${x.dept}</td><td><button class="btn link" data-unpick="${x.id}">移除</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted" style="text-align:center;padding:24px">还没有选择学员</td></tr>'}</tbody></table></div>
  </div>${state.whoPick ? whoDialog() : ''}`;
}
function stepRel() {
  if (isNormal()) return stepPeople();
  const nRel = state.objects.reduce((s, o) => s + o.rels.length, 0);
  const sel = state.objSel;
  return `<div class="card">
    <h2>被评测对象与评测关系</h2>
    <div class="row" style="gap:8px;margin-bottom:16px">
      <button class="btn primary" id="openPool">从讲师库选择</button>
      <button class="btn" id="openPeople">从人员选择</button>
      <button class="btn" id="addCustom">添加自定义对象</button>
      <button class="btn" id="openImport">批量导入</button>
      ${sel.length ? `<span style="margin-left:16px">已选 ${sel.length} 个对象</span><button class="btn link" id="batchWho">添加评测人</button><button class="btn link" id="removeSel">移除</button>` : ''}

// 导入：同名对象合并；同一对象同一关系的评测人合并为「指定人员」
function runImport() {
  const rows = IMPORT_ROWS.map(cells => ({ cells, err: checkImportRow(cells) })), added = [];
  rows.filter(r => !r.err).forEach(({ cells: [obj, rel, code, , intro] }) => {
    const person = pickPool().find(x => x.code === code), name = rel || '评测人';
    let o = state.objects.find(x => x.name === obj);
    if (!o) { o = { id: 'imp' + (state.objects.length + 1), name: obj, kind: '自定义', intro, rels: [] }; state.objects.push(o); added.push(obj); }
    let r = o.rels.find(x => x.name === name);
    if (!r) { r = { name, who: '', count: 0, pick: [] }; o.rels.push(r); }
    r.pick = [...new Set([...(r.pick || []), person.id])]; r.who = whoLabel('指定人员', r.pick, o); r.count = r.pick.length;
  });
  state.importRes = { rows, ok: rows.filter(r => !r.err).length, added };
}

      w.batch.forEach(i => {
        const o = state.objects[i], blank = o.rels.length === 1 && !o.rels[0].name && !(o.rels[0].pick || []).length;
        const r = { name: relName, who: whoLabel('指定人员', w.sel, o), count: w.sel.length, pick: [...w.sel] };

      });

    }
    const o0 = state.objects[w.o], name = (o0.rels[w.r].name || '').trim();
    const targets = w.allObj && name ? state.objects.flatMap(o => o.rels.filter(r => r.name.trim() === name).map(r => [o, r])) : [[o0, o0.rels[w.r]]];

  });
}

const TIME_RE = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/;
function timeError(start, end) {
  if (start && !TIME_RE.test(start)) return '开始时间格式应为「2026-11-10 09:00」';
  if (end && !TIME_RE.test(end)) return '结束时间格式应为「2026-11-20 18:00」';
  if (start && end && end <= start) return '结束时间需要晚于开始时间';
  return '';
}

  list.forEach(a => { if (total(a) != null) (groups[a.who] = groups[a.who] || []).push(total(a)); });
  const rows = Object.entries(groups).map(([who, ts]) => ({ who, info: evalInfo(who), n: ts.length, m: avg(ts) }))

// 作答时末尾显示已评项总分（评估管理「综合得分显示」）
function stuSum(objId) {
  const s = state.stu;
  return fmt(state.edQs.reduce((n, q, i) => {
    const v = s.ans[`${objId}.${i}`];
    if (!q.score || v === undefined) return n;
    const w = qW(q);
    if (q.type === '单选') return n + (q.opts[v].ns ? 0 : (Number(q.opts[v].v) || 0)) * w;
    if (q.type === '多选') return n + Math.max(0, v.reduce((m, k) => m + (q.opts[k].ns ? 0 : (Number(q.opts[k].v) || 0)), 0)) * w;
    return n + (Number(v) || 0) * w;
  }, 0));
}
function stuMissing() {
  const s = state.stu;
  return state.edQs.findIndex((q, i) => {
    if (!q.req) return false;
    const v = s.ans[`${s.cur}.${i}`];
    if (q.type === '矩阵单选' || q.type === '矩阵量表') return !v || Object.keys(v).length < q.rows.length;
    if (q.type === '多选') return !v || !v.length;
    return v === undefined || v === '';
  });
}

    main.querySelectorAll('[data-scene]').forEach(x => {

    if (!state.scene.open && !state.scene.sel) return;

      if (s.blank) { startScene(s); return; }
      const same = state.scene.open && state.scene.sel === s.id;
      openPv(s);
      main.querySelectorAll('[data-scene]').forEach(x => {
        const on = x === c;
        x.classList.toggle('on', on);

      });

  if (scUse) scUse.onclick = () => startScene(scById(state.scene.sel));
  main.querySelector('#scClose').onclick = () => go('list');
  // 点卡片/侧栏/顶栏以外的空白处：取消选中并收起侧栏
  main.querySelector('.sc')?.addEventListener('click', e => {
    if (!state.scene.open) return;
    const t = e.target;

    closePv();
  });
  const left = main.querySelector('.sc-left');
  if (left) left.addEventListener('wheel', e => {

    const top = left.scrollTop, max = left.scrollHeight - left.clientHeight;
    const next = Math.max(0, Math.min(max, top + e.deltaY));

}

// 分数相同（保留 1 位小数后）名次相同，下一名跳过，如 1、1、3
const rankOf = (rows, i, k) => rows[i][k] == null ? '-' : rows.findIndex(x => x[k] != null && r1(x[k]) === r1(rows[i][k])) + 1;
function compositeRows() {
  const pAvg = projectAvg();
  return visibleObjects().map(o => ({ o, ...objScore(o.id), n: included().filter(a => a.obj === o.id).length, pAvg }))
    .sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
}
function tabComposite() {
  const rows = compositeRows(), sel = state.rankSel;
  return `<div class="row between" style="margin-bottom:12px">
      <span class="note">勾选对象后点「绘图」，不勾选时画全部对象，最多 15 个。</span>
      <span class="row"><button class="btn" id="drawRank">绘图</button><button class="btn" data-exp="综合排名">导出</button></span></div>
  <div class="scroll"><table>
    <thead><tr><th><input type="checkbox" id="rkAll" aria-label="全选" ${sel.length === rows.length ? 'checked' : ''} /></th><th>排名</th><th>被评测对象</th><th class="num">得分</th><th class="num">得分率</th><th class="num">平均分</th><th class="num">对比平均分</th><th>有效问卷</th><th>各关系完成</th><th>操作</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr><td><input type="checkbox" data-rk="${r.o.id}" ${sel.includes(r.o.id) ? 'checked' : ''} aria-label="选择${r.o.name}" /></td>
      <td>${rankOf(rows, i, 'score')}</td><td>${r.o.name}</td><td class="num">${r1(r.score)}</td><td class="num">${r.score == null ? '-' : r1(r.score / FULL * 100)}</td>
      <td class="num">${r1(r.pAvg)}</td><td class="num">${r.pAvg && r.score != null ? r1(r.score / r.pAvg * 100) + '%' : '-'}</td>
      <td><button class="btn link" data-valid="${r.o.id}">有效问卷 ${r.n} 份</button></td>
      <td>${REL_NAMES.filter(rel => !state.relFilter || rel === state.relFilter).map(rel => {
        const n = included().filter(a => a.obj === r.o.id && a.rel === rel).length;
        return n ? `<span class="tag">${rel} ${n}</span>` : `<span class="tag orange">缺少${rel}</span>`;
      }).join(' ')}</td><td><button class="btn link" data-odetail="${r.o.id}">查看明细</button></td></tr>`).join('')}</tbody></table></div>
  <p class="note" style="margin-top:12px">得分 = 有效问卷总分之和 ÷ 有效份数${state.trim ? '；开启去掉最高分、最低分时，在每种关系内各去一份' : ''}。平均分 = 全部有效问卷总分 ÷ 有效份数；对比平均分 = 得分 ÷ 平均分 × 100%。标记无效、已回收的答卷不计入。</p>`;
}

function qAvg(objId, qi, list) { return avg((list || included()).filter(a => !objId || a.obj === objId).map(a => a.s[qi])); }
function tabSingle() {
  const qi = state.singleQ, q = QUESTIONS[qi], objs = visibleObjects();
  const allAvg = qAvg(null, qi);
  const rows = objs.map(o => ({ o, v: qAvg(o.id, qi), n: included().filter(a => a.obj === o.id).length })).sort((a, b) => (b.v ?? -1) - (a.v ?? -1));
  return `<div class="grid-single">
    <div class="pickbox"><h3>选择题目</h3>
      <label class="switch"><input type="checkbox" id="sqAll" ${state.singleQs.length === QUESTIONS.length ? 'checked' : ''} /> 全部</label>
      ${QUESTIONS.map((x, i) => `<label class="switch"><input type="checkbox" data-sq="${i}" ${state.singleQs.includes(i) ? 'checked' : ''} /> ${i + 1}. ${x.title}</label>`).join('')}
      <h3 style="margin-top:12px">选择被评测对象</h3>
      <label class="switch"><input type="checkbox" id="soAll" ${state.singleObjs.length === OBJECTS.length ? 'checked' : ''} /> 全部</label>
      ${OBJECTS.map(o => `<label class="switch"><input type="checkbox" data-so="${o.id}" ${state.singleObjs.includes(o.id) ? 'checked' : ''} /> ${o.name}</label>`).join('')}
      <button class="btn primary" id="drawSingle" style="margin-top:12px">绘图</button>
    </div>
    <div style="min-width:0">
      <div class="row between" style="margin-bottom:12px">
        <label>题目：<select id="singleQ">${QUESTIONS.map((x, i) => `<option value="${i}" ${i === qi ? 'selected' : ''}>${i + 1}. ${x.title}（权重 ${x.weight}）</option>`).join('')}</select></label>
        <button class="btn" data-exp="单项排名">导出</button></div>
      <div class="scroll"><table>
        <thead><tr><th>排名</th><th>被评测对象</th><th class="num">平均得分率</th><th class="num">本题平均分</th><th class="num">加权得分</th><th class="num">对比平均分</th><th class="num">有效问卷</th><th>操作</th></tr></thead>
        <tbody>${rows.map((r, i) => `<tr><td>${rankOf(rows, i, 'v')}</td><td>${r.o.name}</td><td class="num"><b>${r.v == null ? '-' : r1(r.v / q.max * 100) + '%'}</b></td><td class="num">${r.v == null ? '-' : r.v.toFixed(2)}</td><td class="num">${r.v == null ? '-' : r1(r.v * q.weight)}</td><td class="num">${allAvg && r.v != null ? r1(r.v / allAvg * 100) + '%' : '-'}</td><td class="num">${r.n}</td>
          <td><button class="btn link" data-odetail="${r.o.id}">查看明细</button></td></tr>`).join('')}</tbody></table></div>
      <p class="note" style="margin-top:12px">本题平均分为原始分（${q.max === 5 ? '1–5' : '0–' + q.max}）；加权得分 = 本题平均分 × 题目权重 ${q.weight}；对比平均分 = 本题平均分 ÷ 全部对象本题平均分 ${allAvg ? allAvg.toFixed(2) : '-'}。</p>
    </div></div>`;
}

function tabExtra() {

/* ---------- 弹窗 ---------- */
const OPT5 = { 5: '非常合理', 4: '比较合理', 3: '一般', 2: '不太合理', 1: '很不合理' };
function answerOf(key) { return ANSWERS.find(a => akey(a) === key); }
function openAnswer(a) {
  const idx = ANSWERS.filter(x => x.obj === a.obj).indexOf(a);
  return OPEN_ANSWERS[a.obj][idx] || '（未作答）';
}
function trimFlags(objId) {
  // 去掉最高分、最低分：在每种关系内各去一份，剩余不足 1 份时不去（与计分规则一致）
  const flags = {};
  if (!state.trim) return flags;
  REL_NAMES.forEach(rel => {
    const list = included().filter(a => a.obj === objId && a.rel === rel).sort((x, y) => total(x) - total(y));
    if (state.trimHi && list.length - 1 >= 1) flags[akey(list[list.length - 1])] = '去掉最高分';
    if (state.trimLo && list.length - (state.trimHi ? 2 : 1) >= 1) flags[akey(list[0])] = '去掉最低分';
  });
  return flags;
}
function bars(items, max, unit) {
  const h = 26, W = 520, left = 90;
  return `<svg viewBox="0 0 ${W + 60} ${items.length * (h + 10) + 10}" class="chart" role="img" aria-label="条形图">
    ${items.map((it, i) => { const y = 10 + i * (h + 10), w = max ? (it.v || 0) / max * W * 0.78 : 0;
      return `<text x="${left - 8}" y="${y + 17}" text-anchor="end" class="ct">${it.label}</text><rect x="${left}" y="${y}" width="${w}" height="${h}" rx="3" fill="${it.color || '#0152D9'}"></rect>
        <text x="${left + w + 6}" y="${y + 17}" class="cv">${it.v == null ? '-' : r1(it.v)}${unit}</text>`; }).join('')}</svg>`;
}
const COLORS = ['#0152D9', '#2BA471', '#D9822B', '#8E59C8', '#E5484D'];

function opModal() {

  }
  if (m.kind === 'chartSingle') {

    if (!qs.length || !objs.length) return wrap('单项排名图表', '<p style="margin-top:12px">请至少选择 1 道题和 1 个被评测对象。</p>', 420);

      ${qs.map(qi => `<h3 style="margin:12px 0 4px">${qi + 1}. ${QUESTIONS[qi].title}</h3>${bars(objs.map((o, i) => ({ label: o.name, v: qAvg(o.id, qi), color: COLORS[i % 5] })), QUESTIONS[qi].max, ' 分')}`).join('')}

        <td class="num">${total(a) ?? '无可计分作答'}</td><td>${flags[akey(a)] ? `<span class="tag">${flags[akey(a)]}</span>` : '计入'}</td>
        <td><button class="btn link" data-ans="${akey(a)}">查看答卷</button></td></tr>`).join('')}</tbody></table>
      <div class="calc">${REL_NAMES.map(rel => { const s = relScore(o.id, rel); return s == null ? '' : `<span>${rel}平均 ${r1(s)}</span>`; }).join('')}<b>得分 ${r1(sc.score)}</b></div>`, 760,
      `<button class="btn" data-exp="有效问卷明细">导出</button><button class="btn" data-omclose>关闭</button>`);
  }
  if (m.kind === 'odetail') {
    const o = objById(m.obj), list = included().filter(a => a.obj === o.id);
    return wrap(`查看明细：${o.name}`, `<p class="note" style="margin:8px 0 12px">有效问卷 ${list.length} 份。点姓名查看该评测人的答题情况。</p>
      ${QUESTIONS.map((q, qi) => {
        const vals = list.map(a => a.s[qi]), av = avg(vals);
        const dist = qi === 4 ? [5, 4, 3, 2, 1].map(v => [`${OPT5[v]}（${v} 分）`, vals.filter(x => x === v).length]) : [5, 4, 3, 2, 1].map(v => [`${v} 分`, vals.filter(x => x === v).length]);
        return `<div class="qd"><h3>${qi + 1}. ${q.title} <span class="tag">${qi === 4 ? '单选' : '打分'}</span> <span class="note">权重 ${q.weight}</span></h3>
          <div class="grid2"><table><thead><tr><th>${qi === 4 ? '选项' : '分值'}</th><th class="num">人次</th><th class="num">比例</th></tr></thead>
            <tbody>${dist.map(([k, n]) => `<tr><td>${k}</td><td class="num">${n}</td><td class="num">${list.length ? r1(n / list.length * 100) : 0}%</td></tr>`).join('')}
            <tr><td><b>本题平均分</b></td><td class="num" colspan="2"><b>${av == null ? '-' : av.toFixed(2)}</b>　加权 ${av == null ? '-' : r1(av * q.weight)}</td></tr></tbody></table>
          <table><thead><tr><th>评测人</th><th>关系</th><th class="num">得分</th><th class="num">加权得分</th></tr></thead>
            <tbody>${list.map((a, i) => `<tr><td><button class="btn link" data-ans="${akey(a)}">${whoName(a.who, i)}</button></td><td>${a.rel}</td><td class="num">${a.s[qi] ?? '不计分'}</td><td class="num">${a.s[qi] == null ? '-' : a.s[qi] * q.weight}</td></tr>`).join('')}</tbody></table></div></div>`;
      }).join('')}`, 900, `<button class="btn" data-exp="查看明细">导出</button><button class="btn" data-omclose>关闭</button>`);
  }
  if (m.kind === 'extra') {
    const o = objById(m.obj), list = ANSWERS.filter(a => a.obj === o.id);
    return wrap(`附加题明细：${o.name}`, `<p class="note" style="margin:8px 0 12px">${OPEN_QUESTION}</p><table><thead><tr><th>评测人</th><th>关系</th><th>回答</th></tr></thead>
      <tbody>${list.map((a, i) => ({ a, t: OPEN_ANSWERS[o.id][i], i })).filter(x => x.t).map(({ a, t, i }) => `<tr><td><button class="btn link" data-ans="${akey(a)}">${whoName(a.who, i)}</button></td><td>${a.rel}</td><td>${t}</td></tr>`).join('')}</tbody></table>`, 640);
  }
  if (m.kind === 'answer') {
    const a = answerOf(m.key), i = ANSWERS.indexOf(a), o = objById(a.obj);
    return wrap('答题情况', `<div class="kv">
        <span>被评测对象</span><b>${o.name}</b><span>评测人</span><b>${whoName(a.who, i)}${state.anon ? '' : `（${CODES[a.who]}，${evalInfo(a.who).dept}）`}</b>
        <span>评测关系</span><b>${a.rel}</b><span>提交时间</span><b>${submitTime(i)}</b><span>状态</span><b>${ansStatus(a)}</b><span>答卷总分</span><b>${total(a) ?? '无可计分作答'} / ${FULL}</b></div>
      <table><thead><tr><th>#</th><th>题目</th><th>题型</th><th>作答</th><th class="num">得分</th><th class="num">权重</th><th class="num">加权得分</th></tr></thead>
        <tbody>${QUESTIONS.map((q, qi) => `<tr><td>${qi + 1}</td><td>${q.title}</td><td>${qi === 4 ? '单选' : '打分'}</td><td>${a.s[qi] == null ? '没注意（不计分）' : (qi === 4 ? OPT5[a.s[qi]] : a.s[qi] + ' 分')}</td>
          <td class="num">${a.s[qi] ?? '-'}</td><td class="num">${q.weight}</td><td class="num">${a.s[qi] == null ? '-' : a.s[qi] * q.weight}</td></tr>`).join('')}
          <tr><td>6</td><td>${OPEN_QUESTION}</td><td>问答</td><td colspan="4">${openAnswer(a)}<span class="note">（附加问题，不计分）</span></td></tr></tbody></table>
      ${state.anon ? '<p class="note" style="margin-top:8px">匿名模式：不显示评测人身份。</p>' : ''}`, 760,
      `<button class="btn" data-exp="答卷（Word）">导出答卷</button><button class="btn" data-omclose>关闭</button>`);
  }
  return '';
}

function bindOps() {

  on('#listPublish', 'click', () => {

  on('#listExport', 'click', () => {

  // 监控
  main.querySelectorAll('[data-mtab]').forEach(b => b.onclick = () => { state.monTab = b.dataset.mtab; state.monSel = []; render(); });

  on('#mAll', 'change', e => { state.monSel = e.target.checked ? [...main.querySelectorAll('[data-msel]')].map(c => c.dataset.msel) : []; render(); });
  main.querySelectorAll('[data-mact]').forEach(b => b.onclick = () => {

// 第 ③ 步发布：新建的项目置顶到列表；编辑的项目原位更新。开始时间未到为「未开始」。
function publishProject(name, start, end) {
  const total = state.objects.reduce((n, o) => n + o.rels.reduce((m, r) => m + (r.count || 0), 0), 0);
  const st = start ? start : `${TODAY} 09:00`;
  const status = st.slice(0, 10) > TODAY ? '未开始' : '进行中';
  let p = state.editPid && state.projects.find(x => x.id === state.editPid);
  if (p) Object.assign(p, { name, start: st, end, status, total: Math.max(p.total, total) });
  else {
    const code = `P${TODAY.replace(/-/g, '')}${String(state.projects.length + 1).padStart(2, '0')}`;
    p = P(code, name, isNormal() ? '普通调查' : '评估型调查', state.edHead.title, '高源', st, end, status, TODAY, 0, isNormal() ? state.normalSel.length : total, '评估调查');
    state.projects.unshift(p);
  }
  state.editPid = null; state.pid = p.id; state.step = 'score'; state.page_no = 1;
  state.listQ = { kw: '', creator: '', createdFrom: '', createdTo: '', status: '', type: '', source: '' }; state.listF = { ...state.listQ };
  go('list'); toast(`已发布「${name}」，状态：${status}`);
}

    const bad = setChecks().find(c => !c[0]);
    if (bad) { toast(bad[2]); return; }
    if (!main.querySelector('#setCode').value.trim()) { toast('请填写调查编号'); return; }
    const name = main.querySelector('#setName').value.trim(), start = main.querySelector('#setStart').value.trim(), end = main.querySelector('#setEnd').value.trim();
    if (!name) { toast('请填写调查名称'); return; }

  on('#exportBtn', 'click', () => toast('已加入导出任务，可在导出任务列表下载'));
}

    state.newTplMode = false; $('#modalTitle').textContent = '新建调查';
    if (!isEvalType) { toast('该功能暂未开放'); return; }
    const t = T(`q${Date.now()}`, '自定义模板', '未命名模板', `${TODAY.replace(/-/g, '')}${String(QTPLS.length + 1).padStart(6, '0')}`, '评估型调查', '高源', '培训中心', `${TODAY} 10:00:00`, '草稿', 0, []);
    t.isNew = true; QTPLS.unshift(t); editTemplate(t); return;
  }
  startCreate(isEvalType ? 'eval' : 'normal');
};
document.addEventListener('click', e => {
  if (state.colOpen && !e.target.closest('.colset')) { state.colOpen = false; render(); }
  if (state.lib.more && !e.target.closest('.more')) { state.lib.more = null; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.colOpen) { state.colOpen = false; render(); return; } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (state.poolOpen || state.importOpen || state.peopleOpen || state.whoPick || state.qtpl)) { state.poolOpen = state.importOpen = state.peopleOpen = false; state.whoPick = null; state.qtpl = null; render(); } });
render();
</script>
</body>
</html>
