<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="icon" href="data:," />
<title>Neck Soccer — Head the ball with your neck</title>
<style>
  :root{
    --bg:#0c0f17; --panel:#141a26; --ink:#e8edf6; --muted:#8a93a6;
    --accent:#ff5a3c; --accent2:#3ad6c0; --good:#ffd23f; --perfect:#8ef7a9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
  #game{position:fixed;inset:0;display:block;background:
    radial-gradient(120% 90% at 50% 0%, #18202f 0%, #0c0f17 60%);}
  /* HUD */
  .hud{position:fixed;z-index:5;pointer-events:none;font-variant-numeric:tabular-nums}
  #hudTop{top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start}
  #hudGame{top:62px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  #hudDebug{top:112px;left:16px;display:flex;gap:10px;flex-wrap:wrap;max-width:min(92vw,720px)}
  .pill{background:rgba(20,26,38,.72);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);
    border-radius:999px;padding:8px 14px;font-size:14px;letter-spacing:.04em;display:flex;gap:8px;align-items:center}
  .pill b{font-size:18px;color:var(--good)}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2)}
  .pill .dot.off{background:#5a6275;box-shadow:none}
  .debug-pill,.debug-readout{background:rgba(10,14,22,.76);border-color:rgba(58,214,192,.18)}
  .debug-readout{font-size:12px;color:#bfc8d8;max-width:min(88vw,540px);line-height:1.35}
  .stat-card{min-width:128px;justify-content:space-between}
  .stat-card b{font-size:20px}
  .stat-stack{display:flex;gap:10px;flex-wrap:wrap}
  .stat-note{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .feedback-pop{position:fixed;left:50%;top:19%;transform:translateX(-50%);z-index:6;pointer-events:none;
    font-size:clamp(28px,5vw,54px);font-weight:900;letter-spacing:.04em;opacity:0;transition:opacity .15s ease}
  .feedback-pop.show{opacity:1}
  .feedback-sub{position:fixed;left:50%;top:28%;transform:translateX(-50%);z-index:6;pointer-events:none;
    font-size:14px;color:#d5dceb;opacity:0;transition:opacity .15s ease}
  .feedback-sub.show{opacity:1}
  /* center overlay */
  #overlay{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:18px;background:rgba(8,11,18,.72);backdrop-filter:blur(6px);padding:24px}
  #overlay.hidden{display:none}
  #overlay h1{font-size:clamp(28px,6vw,52px);font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--accent),var(--good));-webkit-background-clip:text;background-clip:text;color:transparent}
  #overlay p{max-width:520px;color:var(--muted);line-height:1.6;font-size:15px}
  .btn{pointer-events:auto;cursor:pointer;border:0;border-radius:14px;padding:14px 26px;font-size:16px;font-weight:700;
    color:#0c0f17;background:linear-gradient(90deg,var(--accent),var(--good));transition:transform .12s ease,filter .12s ease}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.18)}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .keys{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:13px}
  .keys span{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:4px 9px}
  #banner{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:7;display:none;
    background:rgba(255,90,60,.16);border:1px solid rgba(255,90,60,.4);color:#ffd0c6;
    padding:8px 16px;border-radius:999px;font-size:13px;pointer-events:none}
  .foot{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:#3d4658;font-size:12px;z-index:4;pointer-events:none}
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud" id="hudTop">
    <div class="pill">NECK SOCCER</div>
    <div class="pill"><span class="dot off" id="camDot"></span><span id="modeLabel">IDLE</span></div>
  </div>

  <div class="hud" id="hudGame">
    <div class="stat-stack">
      <div class="pill stat-card"><span class="stat-note">Score</span><b id="score">0</b></div>
      <div class="pill stat-card"><span class="stat-note">Combo</span><b id="combo">0</b></div>
      <div class="pill stat-card"><span class="stat-note">Power</span><b id="powerReadout">0%</b></div>
    </div>
    <div class="pill" id="statusPill">Track your head and keep the ball alive</div>
  </div>

  <div class="feedback-pop" id="feedbackPop">NICE</div>
  <div class="feedback-sub" id="feedbackSub">Keep it up</div>

  <div class="hud" id="hudDebug">
    <div class="pill debug-pill"><span class="dot" id="debugDot"></span><span id="debugLabel">DEBUG ON</span></div>
    <div class="pill debug-readout" id="debugReadout">face: -- · radius: -- · hit: --</div>
  </div>

  <div id="banner"></div>

  <video id="cam" playsinline muted style="position:fixed;inset:0;width:1px;height:1px;opacity:0;pointer-events:none"></video>

  <div id="overlay" class="hidden">
    <h1>ROUND OVER</h1>
    <p id="overlayMessage">Score 0</p>
    <div class="row">
      <button class="btn" id="btnAgain">Play Again</button>
      <button class="btn ghost" id="btnUseDemo">Use Demo</button>
    </div>
  </div>

  <div class="foot">not medical advice · just vibes · best in Chrome over localhost</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  let DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(innerWidth * DPR);
    cv.height = Math.floor(innerHeight * DPR);
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize', resize); resize();

  // ---------- Game state ----------
  const STATE = { IDLE:'IDLE', PLAY:'PLAY', OVER:'OVER' };
  let state = STATE.IDLE;
  let score = 0;
  let combo = 0;
  let camActive = false;
  let playStart = 0;
  let neutralSet = false, neutralX = 0.5, neutralY = 0.5;   // head center calibration
  let headRadRaw = 0.15;                                     // head RADIUS in raw video coords (ear-to-ear span)
  let lastNodSignal = 0;
  let debugEnabled = true;
  let faceLogTick = 0;
  const debugState = { centerX: null, centerY: null, radius: null, face: 'idle', lastHitAt: 0, hasCollision: false };
  const HEAD_TRACK_GAIN_X = 2.35;
  const HEAD_TRACK_GAIN_Y = 2.6;
  const ball = { x:0, y:0, vx:0, vy:0, r:26, rot:0, vr:0, trail:[] };
  const header = { x:0, y:0, px:0, py:0, vx:0, vy:0, r:70, has:false, lastHit:-1e9, hitFlash:-1e9, power:0, tiltPower:0 };
  const feedback = { label:'', sub:'', until:0 };

  function reset(){
    score = 0;
    combo = 0;
    ball.r = Math.max(20, Math.min(innerWidth, innerHeight) * 0.035);
    ball.x = innerWidth/2;
    ball.y = ball.r + 8;
    ball.vx = (Math.random()*2-1) * innerWidth * 0.09;   // (halved)
    ball.vy = innerHeight * 0.06;                         // (halved)
    ball.rot = 0; ball.vr = (Math.random()*2-1)*4; ball.trail.length = 0;
    header.x = header.px = innerWidth/2;
    header.y = header.py = innerHeight * 0.78;
    header.has = false; header.lastHit = -1e9;
    debugState.centerX = innerWidth/2;
    debugState.centerY = innerHeight * 0.78;
    debugState.radius = header.r;
    debugState.face = camActive ? 'waiting' : 'demo';
    debugState.lastHitAt = 0;
    debugState.hasCollision = false;
    header.power = 0;
    header.tiltPower = 0;
    feedback.label = '';
    feedback.sub = '';
    feedback.until = 0;
    updateScore();
    updateDebugReadout();
    setStatus(camActive ? 'Tracking your head — get ready to juggle' : 'Demo mode ready — move and catch the first ball');
  }

  // ---------- Physics ----------
  const G = () => innerHeight * 0.575;         // gravity px/s^2  (halved from 1.15)
  const REST = 0.86;                            // wall/floor bounce
  const HEAD_REST = 0.95;                       // bounce off head
  const HEAD_TRANSFER = 0.6;                    // how much head speed transfers (halved from 1.15)
  const HEAD_LIFT = () => innerHeight * 0.21;   // upward bias on contact (halved from 0.42)

  function step(dt){
    // ball integration
    ball.vy += G() * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.rot += ball.vr * dt;

    // walls
    if (ball.x < ball.r){ ball.x = ball.r; ball.vx = Math.abs(ball.vx)*REST; }
    if (ball.x > innerWidth - ball.r){ ball.x = innerWidth - ball.r; ball.vx = -Math.abs(ball.vx)*REST; }
    if (ball.y < ball.r){ ball.y = ball.r; ball.vy = Math.abs(ball.vy)*REST; }

    // mild horizontal centering keeps the ball inside the head's reachable band
    ball.vx += (innerWidth/2 - ball.x) * 0.5 * dt;

    // header velocity (smoothed)
    header.vx = (header.x - header.px) / Math.max(dt, 1e-3);
    header.vy = (header.y - header.py) / Math.max(dt, 1e-3);
    const movePower = Math.min(1, Math.hypot(header.vx, header.vy) / (innerHeight * 1.2));
    header.power = Math.min(1, movePower * 0.7 + header.tiltPower * 0.8);
    header.px = header.x; header.py = header.y;

    // collision: ball vs header (circle-circle)
    if (header.has){
      const dx = ball.x - header.x, dy = ball.y - header.y;
      const d = Math.hypot(dx, dy) || 1e-6;
      const minD = ball.r + header.r;
      if (d < minD && (performance.now() - header.lastHit) > 140){
        const nx = dx/d, ny = dy/d;
        // push out
        const overlap = minD - d;
        ball.x += nx * overlap; ball.y += ny * overlap;
        // reflect velocity along normal (only if approaching)
        const vDotN = ball.vx*nx + ball.vy*ny;
        if (vDotN < 0){
          ball.vx -= (1 + HEAD_REST) * vDotN * nx;
          ball.vy -= (1 + HEAD_REST) * vDotN * ny;
        }
        // transfer head momentum
        ball.vx += header.vx * HEAD_TRANSFER;
        ball.vy += header.vy * HEAD_TRANSFER;
        // upward bias so the ball gets headed back up
        ball.vy -= HEAD_LIFT() * (1 + header.tiltPower * 0.9);
        // a little spin
        ball.vr = (ball.vx / ball.r) * 6 + (Math.random()*2-1);
        // cap speed
        const sp = Math.hypot(ball.vx, ball.vy), MAX = innerHeight*1.1;  // (halved)
        if (sp > MAX){ ball.vx *= MAX/sp; ball.vy *= MAX/sp; }
        header.lastHit = performance.now();
        header.hitFlash = performance.now();
        debugState.lastHitAt = header.lastHit;
        debugState.hasCollision = true;
        combo += 1;
        score += 1 + Math.min(4, Math.floor(combo / 3));
        triggerHitFeedback();
        updateScore();
      }
    }

    // trail
    ball.trail.push({x:ball.x, y:ball.y});
    if (ball.trail.length > 14) ball.trail.shift();

    // failure: ball fell below bottom
    if (ball.y - ball.r > innerHeight + 4){
      combo = 0;
      updateScore();
      gameOver();
    }
  }

  // ---------- Render ----------
  function drawGradientBg(){
    const g = ctx.createRadialGradient(innerWidth/2, 0, 0, innerWidth/2, 0, innerHeight*1.1);
    g.addColorStop(0, '#18202f'); g.addColorStop(1, '#0c0f17');
    ctx.fillStyle = g; ctx.fillRect(0,0,innerWidth,innerHeight);
  }
  function drawCamBg(){
    const v = document.getElementById('cam');
    if (!v || !v.videoWidth){ drawGradientBg(); return; }
    const vw = v.videoWidth, vh = v.videoHeight;
    const cw = innerWidth, ch = innerHeight;
    const s = Math.max(cw/vw, ch/vh);
    const dw = vw*s, dh = vh*s;
    ctx.save();
    ctx.translate(cw/2, ch/2);
    ctx.scale(-1, 1);
    ctx.drawImage(v, -dw/2, -dh/2, dw, dh);
    ctx.restore();
    ctx.fillStyle = 'rgba(8,11,18,.34)'; ctx.fillRect(0,0,cw,ch);
  }
  function draw(){
    if (camActive) drawCamBg(); else drawGradientBg();
    if (debugState.hasCollision && performance.now() - debugState.lastHitAt > 180){
      debugState.hasCollision = false;
    }
    if (feedback.until && performance.now() > feedback.until){
      feedback.until = 0;
      feedbackPop.classList.remove('show');
      feedbackSub.classList.remove('show');
    }

    // bottom danger line
    const lineY = innerHeight - 6;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,90,60,.55)';
    ctx.lineWidth = 2; ctx.setLineDash([10,8]);
    ctx.beginPath(); ctx.moveTo(0, lineY); ctx.lineTo(innerWidth, lineY); ctx.stroke();
    ctx.setLineDash([]);
    const grd = ctx.createLinearGradient(0, lineY-40, 0, lineY);
    grd.addColorStop(0,'rgba(255,90,60,0)'); grd.addColorStop(1,'rgba(255,90,60,.12)');
    ctx.fillStyle = grd; ctx.fillRect(0, lineY-40, innerWidth, 40);
    ctx.restore();

    // trail
    if (state === STATE.PLAY){
      for (let i=0;i<ball.trail.length;i++){
        const t = ball.trail[i], a = i/ball.trail.length*0.35;
        ctx.beginPath(); ctx.arc(t.x, t.y, ball.r*a*0.9, 0, 7);
        ctx.fillStyle = `rgba(255,210,63,${a})`; ctx.fill();
      }
    }

    // ball
    drawBall(ball.x, ball.y, ball.r, ball.rot);

    // header indicator (the neck-controlled paddle)
    if (header.has || state === STATE.PLAY || state === STATE.OVER){
      drawHeader(header.x, header.y, header.r, header.has);
      if (debugEnabled) drawDebugOverlay();
    }

    // first-seconds hint
    if (state === STATE.PLAY && performance.now() - playStart < 3800){
      ctx.save();
      ctx.fillStyle = 'rgba(232,237,246,.92)';
      ctx.font = '600 18px ui-sans-serif,system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Move first. Then nod or lift into the ball for power.', innerWidth/2, innerHeight*0.15);
      ctx.restore();
    }
  }

  function drawBall(x,y,r,rot){
    ctx.save();
    ctx.translate(x,y);
    // shadow
    ctx.beginPath(); ctx.ellipse(0, r*0.9, r*0.8, r*0.3, 0, 0, 7);
    ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fill();
    ctx.rotate(rot);
    // body
    ctx.beginPath(); ctx.arc(0,0,r,0,7);
    ctx.fillStyle='#f7f9ff'; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.stroke();
    // pentagons
    ctx.fillStyle='#15171f';
    pent(0,0,r*0.46,0);
    for(let i=0;i<5;i++){
      const a = -Math.PI/2 + i*2*Math.PI/5;
      pent(Math.cos(a)*r*0.72, Math.sin(a)*r*0.72, r*0.24, a);
    }
    ctx.restore();
  }
  function pent(cx,cy,rad,rot){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a = rot - Math.PI/2 + i*2*Math.PI/5;
      const px = cx + Math.cos(a)*rad, py = cy + Math.sin(a)*rad;
      i? ctx.lineTo(px,py): ctx.moveTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }

  function drawHeader(x,y,r,active){
    ctx.save();
    ctx.translate(x,y);
    // hit flash (expanding bright ring right after a bounce)
    const since = performance.now() - header.hitFlash;
    if (since < 220){
      const t = since/220;
      ctx.beginPath(); ctx.arc(0,0, r + t*26, 0, 7);
      ctx.strokeStyle = `rgba(255,210,63,${0.8*(1-t)})`;
      ctx.lineWidth = 5; ctx.stroke();
    }
    // head fill + outline — THIS circle is the collision body (the whole head)
    ctx.beginPath(); ctx.arc(0,0,r,0,7);
    ctx.fillStyle = active ? 'rgba(58,214,192,.14)' : 'rgba(255,255,255,.05)';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = active ? 'rgba(58,214,192,.9)' : 'rgba(255,255,255,.22)';
    ctx.stroke();
    // simple face glyph so it reads as a head, not just a ring
    ctx.fillStyle = active ? 'rgba(58,214,192,.95)' : 'rgba(220,228,240,.6)';
    const eo = r*0.34, ey = -r*0.12, er = Math.max(2, r*0.10);
    ctx.beginPath(); ctx.arc(-eo, ey, er, 0, 7); ctx.arc(eo, ey, er, 0, 7); ctx.fill();
    ctx.lineWidth = Math.max(2, r*0.06);
    ctx.strokeStyle = active ? 'rgba(58,214,192,.9)' : 'rgba(220,228,240,.6)';
    ctx.beginPath(); ctx.arc(0, r*0.10, r*0.36, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
    // label
    ctx.fillStyle = active ? 'rgba(58,214,192,.95)' : 'rgba(200,210,225,.55)';
    ctx.font = '700 12px ui-sans-serif,system-ui';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('YOUR HEAD', 0, r + 18);
    ctx.restore();
  }

  function drawDebugOverlay(){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.6)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6,5]);
    ctx.beginPath();
    ctx.arc(header.x, header.y, header.r, 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = 'rgba(255,210,63,.85)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(header.x - header.r - 10, header.y);
    ctx.lineTo(header.x + header.r + 10, header.y);
    ctx.moveTo(header.x, header.y - header.r - 10);
    ctx.lineTo(header.x, header.y + header.r + 10);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,210,63,.95)';
    ctx.beginPath();
    ctx.arc(header.x, header.y, 4, 0, Math.PI*2);
    ctx.fill();

    const contacting = Math.hypot(ball.x - header.x, ball.y - header.y) < ball.r + header.r;
    ctx.font = '600 12px ui-sans-serif,system-ui';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = contacting ? 'rgba(255,210,63,.98)' : 'rgba(191,200,216,.92)';
    ctx.fillText(contacting ? 'COLLISION ZONE ACTIVE' : 'HEAD COLLIDER', header.x - header.r, header.y - header.r - 10);
    ctx.restore();
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now){
    let dt = (now - last)/1000; last = now;
    if (dt > 0.05) dt = 0.05; // clamp
    if (state === STATE.PLAY) step(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- UI ----------
  const overlay = document.getElementById('overlay');
  const scoreEl = document.getElementById('score');
  const comboEl = document.getElementById('combo');
  const powerReadoutEl = document.getElementById('powerReadout');
  const statusPill = document.getElementById('statusPill');
  const feedbackPop = document.getElementById('feedbackPop');
  const feedbackSub = document.getElementById('feedbackSub');
  const modeLabel = document.getElementById('modeLabel');
  const camDot = document.getElementById('camDot');
  const banner = document.getElementById('banner');
  const debugDot = document.getElementById('debugDot');
  const debugLabel = document.getElementById('debugLabel');
  const debugReadout = document.getElementById('debugReadout');
  function updateScore(){ scoreEl.textContent = score; comboEl.textContent = combo; powerReadoutEl.textContent = `${Math.round(header.power * 100)}%`; }
  function setMode(label, on){ modeLabel.textContent = label; camDot.classList.toggle('off', !on); }
  function showBanner(t){ banner.textContent = t; banner.style.display='block'; }
  function hideBanner(){ banner.style.display='none'; }
  function setStatus(text){ statusPill.textContent = text; }
  function showFeedback(label, sub, color){
    feedback.label = label;
    feedback.sub = sub;
    feedback.until = performance.now() + 680;
    feedbackPop.textContent = label;
    feedbackSub.textContent = sub;
    feedbackPop.style.color = color;
    feedbackPop.classList.add('show');
    feedbackSub.classList.add('show');
  }
  function triggerHitFeedback(){
    const impact = Math.max(header.power, header.tiltPower);
    if (impact > 0.72) showFeedback('PERFECT', 'Big neck snap. Huge lift.', 'var(--perfect)');
    else if (impact > 0.42) showFeedback('GREAT', 'Strong contact. Keep the rally alive.', 'var(--good)');
    else showFeedback('NICE', 'Clean touch. Stay under the ball.', 'var(--accent2)');
    setStatus(combo >= 3 ? `Hot streak ×${combo} — keep juggling` : 'Good hit — get under the next ball');
  }
  function setDebug(enabled){
    debugEnabled = enabled;
    debugDot.classList.toggle('off', !enabled);
    debugLabel.textContent = enabled ? 'DEBUG ON' : 'DEBUG OFF';
    debugReadout.style.opacity = enabled ? '1' : '.45';
    setStatus(enabled ? 'Debug on — verifying head tracking and collision' : statusPill.textContent);
  }
  function updateDebugReadout(){
    const hitAgo = debugState.lastHitAt ? `${Math.max(0, Math.round(performance.now() - debugState.lastHitAt))}ms` : '--';
    const radius = debugState.radius ? `${Math.round(debugState.radius)}px` : '--';
    const faceX = debugState.centerX == null ? '--' : Math.round(debugState.centerX);
    const faceY = debugState.centerY == null ? '--' : Math.round(debugState.centerY);
    const hitState = debugState.hasCollision ? 'contact' : 'clear';
    debugReadout.textContent = `face: ${debugState.face} · center: ${faceX},${faceY} · radius: ${radius} · hit: ${hitState} · last: ${hitAgo}`;
  }

  function startGame(){
    reset(); state = STATE.PLAY; overlay.classList.add('hidden');
    neutralSet = false;
    lastNodSignal = 0;
    playStart = performance.now();
    last = performance.now(); updateScore();
  }
  function gameOver(){
    if (state !== STATE.PLAY) return;
    state = STATE.OVER;
    setStatus('Round over — play again');
    document.getElementById('overlayMessage').innerHTML = `Score <b>${score}</b> · Combo <b>${combo}</b>`;
    overlay.classList.remove('hidden');
  }

  // ---------- Demo (mouse / touch) — ONLY used when there is no camera ----------
  let demo = false;
  function setDemoHeader(x,y){
    if (!demo || camActive) return;          // camera mode owns the head; ignore pointer entirely
    header.x = Math.max(header.r, Math.min(innerWidth-header.r, x));
    header.y = Math.max(header.r, Math.min(innerHeight-header.r, y));
    header.has = true;
  }
  addEventListener('mousemove', e => setDemoHeader(e.clientX, e.clientY));
  addEventListener('touchmove', e => { const t=e.touches[0]; if(t) setDemoHeader(t.clientX,t.clientY); }, {passive:true});

  // ---------- Camera + MediaPipe FaceMesh ----------
  let faceMesh = null, camera = null, videoStream = null, cameraRetryCount = 0;

  async function cleanupCamera(){
    try { if (camera && typeof camera.stop === 'function') camera.stop(); } catch {}
    camera = null;
    try {
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
      }
    } catch {}
    videoStream = null;
    const vid = document.getElementById('cam');
    try {
      if (vid) {
        vid.pause();
        vid.srcObject = null;
      }
    } catch {}
    camActive = false;
    header.has = false;
  }

  async function startCamera(preferRetry = true){
    setMode('CONNECTING…', false);
    if (typeof FaceMesh === 'undefined' || typeof Camera === 'undefined'){
      showBanner('Face-tracking library could not load. Switched to Demo mode.');
      demo = true; setMode('DEMO', false); setStatus('Demo mode live — tracking library unavailable');
      return false;
    }

    await cleanupCamera();
    showBanner('Connecting camera…');

    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{ width:640, height:480, facingMode:'user' },
        audio:false
      });
      videoStream = stream;
      const vid = document.getElementById('cam');
      vid.srcObject = stream;
      await vid.play();
      camActive = true;
      demo = false;

      if (!faceMesh){
        showBanner('Loading face tracking…');
        faceMesh = new FaceMesh({ locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
        faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
        faceMesh.onResults(onFace);
        console.log('[NeckSoccer] Initialising FaceMesh model…');
        await faceMesh.initialize();
        console.log('[NeckSoccer] FaceMesh model loaded OK');
      }

      camera = new Camera(vid, {
        onFrame: async () => {
          if (faceMesh && camActive) await faceMesh.send({ image: vid });
        },
        width:640,
        height:480
      });
      await camera.start();
      cameraRetryCount = 0;
      debugState.face = 'tracking';
      updateDebugReadout();
      hideBanner();
      setMode('CAMERA', true);
      setStatus('Camera ready — move under the ball and head it up');
      return true;
    }catch(err){
      console.warn('[NeckSoccer] startCamera failed:', err);
      await cleanupCamera();
      debugState.face = 'camera-error';
      updateDebugReadout();

      const raw = `${err && (err.message || err.name) ? (err.message || err.name) : 'unknown error'}`;
      const lowered = raw.toLowerCase();
      const inUse = lowered.includes('device in use') || lowered.includes('could not start video source') || lowered.includes('starting video input failed') || err.name === 'NotReadableError' || err.name === 'TrackStartError';
      const denied = err.name === 'NotAllowedError' || err.name === 'SecurityError';

      if (inUse && preferRetry && cameraRetryCount < 1){
        cameraRetryCount += 1;
        showBanner('Camera busy — retrying once…');
        setStatus('Camera busy — retrying');
        await new Promise(r => setTimeout(r, 700));
        return startCamera(false);
      }

      if (denied){
        showBanner('Camera permission denied — switched to Demo mode.');
        setStatus('Camera permission denied — demo mode enabled');
      } else if (inUse){
        showBanner('Camera is being used by another app — switched to Demo mode.');
        setStatus('Close other apps using the camera, then play again');
      } else {
        showBanner(`Face tracking init failed (${raw}) — switched to Demo mode.`);
        setStatus('Camera mode unavailable — demo mode enabled');
      }

      demo = true;
      setMode('DEMO', false);
      return false;
    }
  }

  function onFace(results){
    if (!results.multiFaceLandmarks || !results.multiFaceLandmarks.length){
      header.has = false;
      header.tiltPower = 0;
      debugState.face = 'no-face';
      setStatus('Face lost — re-center and lock back in');
      updateDebugReadout();
      return;
    }
    if ((faceLogTick++ % 45) === 0) console.log('[NeckSoccer] Face detected — landmarks OK');
    const lm = results.multiFaceLandmarks[0];
    const earL = lm[234], earR = lm[454], chin = lm[152], brow = lm[10], nose = lm[1];
    const cx = (earL.x + earR.x + chin.x + brow.x) / 4;
    const cy = (earL.y + earR.y + chin.y + brow.y) / 4;

    const earDist = Math.hypot(earL.x - earR.x, earL.y - earR.y);
    headRadRaw = earDist * 0.5 * 1.18;

    const refX = 1 - cx;
    const refY = cy;
    if (!neutralSet){ neutralX = refX; neutralY = refY; neutralSet = true; }

    const dx = refX - neutralX;
    const dy = refY - neutralY;
    const hx = innerWidth * 0.5 + dx * innerWidth * HEAD_TRACK_GAIN_X;
    const hy = innerHeight * 0.74 + dy * innerHeight * HEAD_TRACK_GAIN_Y;

    const v = document.getElementById('cam');
    if (v && v.videoWidth){
      const s = Math.max(innerWidth / v.videoWidth, innerHeight / v.videoHeight);
      const dw = v.videoWidth * s;
      header.r = Math.max(52, Math.min(140, headRadRaw * dw * 0.92));
    }

    const browToNose = Math.max(0.0001, nose.y - brow.y);
    const browToChin = Math.max(0.0001, chin.y - brow.y);
    const nodRatio = browToNose / browToChin;
    const nodDelta = Math.abs(nodRatio - lastNodSignal);
    lastNodSignal = nodRatio;
    header.tiltPower = Math.min(1, nodDelta * 18 + Math.max(0, Math.abs(dy) - 0.015) * 7);

    header.x = Math.max(header.r, Math.min(innerWidth - header.r, hx));
    header.y = Math.max(header.r, Math.min(innerHeight - header.r - 24, hy));
    debugState.centerX = hx;
    debugState.centerY = hy;
    debugState.radius = header.r;
    debugState.face = 'tracked';
    setStatus(combo >= 3 ? `Combo ×${combo} — stay calm and attack the next touch` : 'Face locked — move under the ball and strike upward');
    updateDebugReadout();
    header.has = true;
  }

  // keyboard fallback (A/D + W/S) — ONLY when no camera (accessibility)
  addEventListener('keydown', e => {
    if (state !== STATE.PLAY) return;
    if (camActive || demo) return;           // face (camera) or pointer (demo) owns the head, not keys
    const k = e.key.toLowerCase();
    const step = innerWidth*0.05;
    if (k==='a'||k==='arrowleft') header.x = Math.max(header.r, header.x-step);
    if (k==='d'||k==='arrowright') header.x = Math.min(innerWidth-header.r, header.x+step);
    if (k==='w'||k==='arrowup') header.y = Math.max(header.r, header.y-step);
    if (k==='s'||k==='arrowdown') header.y = Math.min(innerHeight-header.r, header.y+step);
    header.has = true;
  });

  addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'g') setDebug(!debugEnabled);
  });

  document.getElementById('btnAgain').onclick = async () => {
    overlay.classList.add('hidden');
    if (demo) {
      setStatus('Demo mode live — move fast and keep the rally going');
      startGame();
      return;
    }
    const ok = await startCamera();
    if (!ok) demo = true;
    startGame();
  };

  document.getElementById('btnUseDemo').onclick = async () => {
    await cleanupCamera();
    demo = true;
    overlay.classList.add('hidden');
    setMode('DEMO', false);
    setStatus('Demo mode live — move fast and keep the rally going');
    startGame();
  };

  async function boot(){
    setDebug(true);
    updateDebugReadout();
    const ok = await startCamera();
    if (!ok) demo = true;
    startGame();
  }

  boot();
})();
</script>
</body>
</html>
